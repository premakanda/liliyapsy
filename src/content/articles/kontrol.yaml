content: >-
  ## Полный контроль


  Мы живём в мире, основанном на контроле. Нам обычно кажется, что мы управляем тем, как выглядит
  наша повседневная жизнь, и верим, что способны влиять на неё собственными решениями. Сами решения
  мы строим на теоретических прогнозах и анализе того, что может произойти. Мы жаждем контроля и
  власти над настоящим и будущим, хотим формировать свою жизнь и привязаны к убеждению, что этот
  контроль у нас есть.


  Идея контроля проста: это способность направлять, формировать и влиять на реальность, на наши
  поступки, мысли и чувства — так, чтобы получить заданный результат. Нам кажется, что при
  достаточном контроле всех этих элементов — благодаря анализу, предвидению и умению принимать
  «правильные» решения — настоящее и будущее будут такими, какими мы хотим. Теоретически звучит
  правдоподобно, но все мы знаем, что это не совсем так, поэтому что мы делаем? Пытаемся
  контролировать как можно больше.


  Мы контролируем себя, свои эмоции, поведение, импульсы; контролируем других людей и их мнение о
  нас, хотим нравиться и быть принятыми; ставим цели, идём к ним, работаем над привычками,
  мотивацией, над самодисциплиной. Контролируем детей, чтобы выросли «такими, как надо»; сами
  контролируемся культурой, которая диктует: в каком-то возрасте «уже не делают», при каких-то
  условиях — «так нельзя». Нас контролирует и социальная система, подгоняя под так называемую норму.
  Мы отслеживаем буквально всё: сон, использование времени, тренировки, количество шагов за день,
  питание; детально планируем отдых и отпуск; бесконечно реализуем проекты; пользуемся GPS, лишь бы
  не заблудиться. Нам нужна власть над всем — без тени сомнения в результате. Мы пытаемся даже гнуть
  Вселенную под свои эгоистичные желания, вынуждая реальность приносить только то, чего мы хотим.
  Манипулируем всем, лишь бы было по-нашему. Никаких сюрпризов, никаких осечек — всё по плану.


  Я сейчас не про оценку «хорошо–плохо», а про наблюдение: сколько стресса порождает эта привязка к
  тотальному контролю. Проверить легко: оставь телефон дома и выйди на прогулку — или не надевай
  часы, считающие шаги. Для некоторых людей такой неучтённый променад теряет всякий смысл. Вместо
  релакса — стресс, бесконечное стремление всё держать под контролем.


  Кажется, что нам нужен контроль и что он обеспечит желаемое будущее. Но такой подход наивен,
  линейный и чрезмерно упрощённый. Это мышление в духе: «буду тяжело работать — обязательно добьюсь
  успеха». Проблема, что так бывает не всегда — и не всегда по нашей вине, хотя мы толкуем это как
  личную неудачу. Мы цепляемся за контроль, чтобы любой ценой избежать хаоса, не потерять ощущение
  безопасности — пусть даже иллюзорной. Мы не хотим сталкиваться с неопределённостью, чувством
  растерянности, не хотим признать, что многое от нас не зависит. Нам приятнее верить, что зависит
  всё.


  Но мы живём в мире неопределённости и постоянной изменчивости. В таком мире наше стремление к
  безопасности, к абсолютному порядку, к «заморозке» перемен и вечной фиксации счастья и
  удовольствия — авантюра. Нам хочется на всегда. И одновременно — избежать любой боли и страдания.
  Лучшим инструментом всё это достичь кажется жёсткий контроль, максимально плотный, чтобы «и мышь
  не проскочила». На первый взгляд тут нет ничего плохого. Но если присмотреться, видно, что
  контроль всегда связан с чем-то отверженным и подавленным, с подгонкой под стандарты,
  конформизмом, тревогой, беспомощностью, неуверенностью, стрессом. С созданием фиктивного мира, в
  котором мы якобы всем управляем и полностью защищены. Проблема в том, что этот мир поддерживается
  насилием — нажимом, принуждением, ограничениями, исключением и подавлением. Чтобы «держать всё в
  руках», нужно постоянно менять, урезать, модифицировать — это не свобода, а форма насилия.


  Мы вновь и вновь пытаемся «оседлать» себя и хаотичный мир. Люди впадают в панику от одной мысли о
  переменах и неопределённости. Хотим сохранить иллюзорную безопасность и определённость — значит,
  сжать зубы и тащить, контролируя всё, что успеем. Звучит невротично — и так оно и есть. Но есть ли
  другие варианты? И какая власть у нас реально есть? Насколько мы можем управлять тем, что
  происходит в нашей жизни? Или весь этот контроль — просто иллюзия, которой мы поддались?


  ## Иллюзия контроля


  Мы сильно переоцениваем способность контролировать себя, события и своё будущее. Из-за веры в силу
  рационального мышления и интеллекта мы легко попадаем в ловушку иллюзии контроля — убеждения, что
  можем управлять тем, над чем объективно не имеем власти. Это касается, например, будущего или
  таких систем, как экономика. Нам кажется, что мы можем «рулить» будущим. Экономистам и аналитикам
  кажется, что они управляют сложными хозяйственными системами, и они с серьезным лицом говорят, как
  будет. Неловко ведь признать, будучи экспертом, что неизвестно, что будет, и что созданное нами —
  по-честному — неукротимо.


  Студент надевает «счастливые» носки, в которых получил 5, чтобы повлиять на исход. Понятно, что
  это так не работает, но это показывает, как мы жаждем полного контроля и как глубоко сидит
  иллюзия.


  Хуже то, что иллюзия контроля прекрасно сочетается с другой когнитивной ошибкой — иллюзией
  действия: в новой и неопределённой ситуации нам нестерпимо хочется сделать хоть что-нибудь, даже
  бессмысленное. Мы плохо переносим ожидание и неопределённость. А иногда ждать — лучшее, что можно
  сделать.


  Представь человека, уверенного, что он должен любой ценой вернуть контроль над сложной ситуацией,
  и начинающего суетиться как попало. Это как дать обезьяне отвёртку и поручить ей регулировать
  сверхчувствительный механизм. Мы хотим влиять, хотим почувствовать себя лучше через действие — и
  вместо того, чтобы переждать и реагировать по мере развития событий, начинаем дёргаться.
  Подталкиваемые этими ошибками, мы нередко только ухудшаем своё положение. Вообще мы чаще всего
  действуем слишком быстро и слишком часто — лишь бы удержать иллюзорный контроль и избежать
  неопределённости.


  Звучит тоскливо — но неужели иллюзия контроля всегда вредна?


  ## Полезная сторона контроля


  Бывает и польза — порой она буквально спасает жизнь. Первое, о чём вспоминается, — Виктор Франкл.
  Ощущение хоть какой-то власти над судьбой, пусть даже иллюзорной, и сознательный разворот к
  позитивным сценариям вместо погружения в беспомощность помогали узникам концлагерей переживать
  самые страшные моменты. Это светлая сторона иллюзии контроля.


  Кроме того, ощущение, что можно влиять на свою жизнь — ставить цели и что-то предпринимать — очень
  важно для людей, застрявших в роли жертвы. Чтобы перестать быть жертвой, нужно заново
  почувствовать свою силу, свой вклад, что ты вообще способен формировать свою реальность. Это
  придаёт энергии, надежды и тягу к жизни.


  В целом связь чувства контроля и психического здоровья интересна. Мы часто скатываемся в крайности
  себе во вред: либо воображаем, что управляем бОльшим, чем на самом деле (и страдаем впустую), либо
  впадаем в полную немощь (и снова страдаем). Поэтому для психического благополучия важно очертить
  рамки контроля и ясно разделить: что действительно в нашей власти, а что полностью вне контроля.


  Как это реалистично разграничить?


  ## Контроль и психическое здоровье


  Парадокс: с одной стороны, нам нужно некое чувство контроля над своей жизнью; с другой —
  стремление подмять реальность под волю и контролировать всё приносит массу тревоги, разочарований
  и печали.


  Когда же «хорошо»? С психологической точки зрения — когда мы не перегибаем ни туда, ни сюда.


  Самым полезным шагом для многих было бы либо взять хоть что-то в свои руки, либо перестать
  пытаться контролировать то, что не контролируется. Нам свойственно хотеть контролировать всё, но
  так не бывает.


  Нужны ясные границы между тем,


  • что в нашей власти: собственные действия, слова и мысли;


  • на что мы можем влиять: например, ты можешь стараться ради повышения, делать работу максимально
  хорошо — так ты повышаешь шансы, но гарантий нет;


  • и тем, что вне контроля: итоговый результат.


  Часто люди путают эти три сферы. Нам тяжело принять, что некоторые вещи не зависят от нас; хочется
  впихнуть жизнь в простую, предсказуемую, удобную схему с гарантированным исходом — «сделаю N
  шагов, и результат обеспечен». Но это так не работает. Это фрустрирует и часто рождает чувство
  поражения: «я сделал всё, а результата нет — значит, я проиграл».


  Но возможно, ошибка была уже в старте: ты приписал себе полный контроль над ситуацией, где его по
  определению быть не могло. Мы ограничены — и это нормально. Здоровый подход — отчётливо отделять
  то, что я делаю, от эффекта, который это вызовет; то, что я контролирую, — от того, что вне моей
  власти.


  Попытки «устроить всё по-моему» и путаница между контролем, влиянием и отсутствием контроля
  принесут лишь страдания — реальность не всегда идёт по плану. Сам факт, что ты действуешь, не
  гарантирует успеха. Но действовать всё равно стоит: вовлекаться целиком, смотреть, что происходит,
  и откликаться по мере развития — потому что мы не знаем, что будет. Это наша ответственность. А
  результат — уже не наш.


  Значит, вместо жёсткого контроля нам нужна бОльшая гибкость. Гибкость — это жизнь, сила,
  естественность. Жёсткими бывают только трупы. Забавно, но чем гибче ты остаёшься, тем меньше тебе
  нужен жёсткий контроль — и тем больше реального контроля у тебя становится. Как с отношениями и
  метафорой про бабочку: если сжать — задушишь; если позволить отпустить — раскроет крылья. В
  контексте психического здоровья стоит научиться различать эти три сферы, сохранять гибкость,
  фокусироваться на том, на что можешь влиять, и выбирать в этом главное. Вместо того чтобы
  бодаться, реагируй по ходу, будь гибким, естественным, живым. Остальному — позволь случаться.


  Но можно пойти дальше — к тому, от чего у многих «ползут мурашки»: к …


  ## Отпусканию стремления к контролю


  - Сначала — беспомощность, из которой помогает выйти сильное чувство контроля;

  - потом — более реалистичный взгляд: кое-чем мы управляем, на кое-что влияем, кое-что не
  контролируем вовсе, и этому стоит научиться;

  - и, наконец, — отпускание, которое приходит из понимания и согласия с тем, что полный контроль
  невозможен, а абсолютной безопасности в изменчивом мире не существует.


  Зачем это?


  Больше всего страдают те, кто не хочет отпускать желание контролировать всё. Они сильнее остальных
  мучаются от того, что жизнь «не по-моему». И не замечают, что, чтобы закончить эти страдания,
  достаточно отпустить иллюзию контроля, позволить вещам происходить и спонтанно отвечать на
  происходящее. У нас нет и никогда не будет полного контроля. Достаточно сделать шаг назад и
  перестать притворяться, что мы властвуем над тем, над чем власти нет. Достаточно признать: у руля
  мы не всегда — чаще мы пассажиры.


  Принять это трудно: кажется, стоит только перестать контролировать — всё рассыплется. Но пока не
  попробуешь — не узнаешь. Уже само осознание, что в изменчивом мире нет безопасности, приносит
  свободу и покой. Не надо грести против течения — а большинство живёт именно так.


  Кому-то это покажется мрачно и страшно: «кто же теперь всё будет контролировать?» Разве цветку
  нужен надсмотрщик, чтобы распуститься? Оказывается, это не мы всё организуем — так почему бы не
  расслабиться и не радоваться тому, что приходит? Посмотри на птиц: они не стремятся контролировать
  порывы ветра. Они просто летят и спонтанно откликаются на то, что есть: ветер попутный — хорошо,
  встречный — тоже справятся. Без контроля.


  Это может звучать пассивно. Но всё, что нужно, чтобы освободиться от иллюзии контроля, — отпустить
  стремление контролировать. И тогда можно радоваться тому, что приходит, радоваться неведомому.
  Жизнь станет интереснее, спокойнее, лучше. Мы всё равно не знаем, что будет — и так и должно быть:
  в жизни много неопределённости, а контроль — иллюзия. Мы не знаем будущего и тем более им не
  управляем, хотя любим думать, что управляем.


  Вместо контроля предлагаю найти уверенность в неопределённости. Осознание, что жизнь
  неопределённа, приносит спокойствие. Осознание, что полной безопасности нет, — по-своему
  безопасно. Ухватиться не за что — и это хорошо, потому что всё распадается, ничто не стабильно. Мы
  не всё контролируем, потому что за пределами наших попыток «выклянчить» желаемое (любыми
  средствами — просьбой или угрозой) действует нечто/некто со своими целями и своим планом. Кто как
  называет: Дао, Вселенная, Бог — кому как близко. Так или иначе, возможно жить без контроля, страха
  и нажима — но для этого нужно отпустить контроль. В этом — свобода, спонтанность, естественность,
  свежесть и мудрость.
