author: Лилия Янушкевич
content: >-
  Есть элемент, который мы часто не замечаем. Он скрыт в повседневных решениях, в словах и
  поступках. Но именно он может быть тонким показателем того, насколько мы остаёмся собой. Когда мы
  замечаем его и позволяем ему действовать в нашей жизни, мы вдруг видим: идти к своим настоящим
  целям становится легче, понятнее и с меньшими потерями.


  Нам говорят, что успех зависит от двух вещей: сильного желания и тяжёлой работы. Такой подход
  предполагает: чтобы что-то получить, добиться, «стать кем-то», — нужно очень сильно к этому
  стремиться и давить на результат. Для этого существуют разные инструменты. Популярны визуализация;
  проговаривание перед зеркалом того, чего пока нет; закон притяжения. Советуют также выписать все
  цели на карточки и развесить их везде, где только можно. Лучше ещё и фотографии желаемого
  прикрепить, чтобы сильнее вдохновиться объектом желания.


  Помимо этого, делается большой упор на действие, на работу — чтобы всё, о чём мы мечтаем, стало
  реальностью. Нас подталкивают «вкалывать на все сто», жить в постоянном действии. Ведь само не
  сделается, и именно мы должны заставить желаемое произойти.


  В целом мы верим, что если достаточно сильно будем настаивать на конкретных результатах и
  отказываться принимать всё, что ниже наших ожиданий, то в конце концов мечты сбудутся. Короче,
  должно быть по-нашему. Я так хочу и точка.


  Мы пытаемся контролировать массу вещей: контролируем себя, других и обстоятельства — лишь бы
  повысить вероятность того, что получим желаемое. Так мы стремимся застраховать результат. Но
  почему нам так важна эта страховка?


  Потому что мы рассчитываем, что реализованные цели и мечты дадут нам что-то большее. Чаще всего —
  счастье, удовлетворённость, безопасность, внутренний покой, удовольствие, любовь, радость, чувство
  значимости. Мы хотим, чтобы они как-то подняли нашу самооценку, и чтобы сделали из нас
  определенного «кого-то».


  Разумеется, мы не хотим оставлять всё на волю случая — это слишком важно, поэтому мы так бьёмся за
  результаты. И нам кажется: если перестанем упорствовать, результатов не будет. Когда я говорю с
  людьми о саморазвитии, у меня впечатление, что именно так выглядит норма в популярной версии
  личностного роста.


  А что, если такая натужность не нужна? Что, если не надо «загонять себя»?


  Проблема силового подхода к целям в том, что дела не всегда идут по-нашему — как бы сильно и
  упорно мы ни старались. И тут концепция «нажимать и давить» трещит по швам, потому что выясняется:
  итог не целиком зависит от нас.


  Что мы делаем, когда всё идёт не по плану? Либо удваиваем усилия, либо сдаёмся. Но что ни выбери —
  это форма сопротивления реальности: обе позиции жёсткие. Здесь нет связи между мной и реальностью.
  Либо «как я хочу», либо «никак».


  Это может казаться нормальным. Но, увы, иногда то, что кажется нормальным, — не полезно, а то, что
  полезно, — совсем не норма. Мы не любим, когда всё выскальзывает из рук. Мы не любим
  неопределённость и хотим поскорее всё узнать и решить — желательно в нашу пользу. Но в основании
  этой позиции лежит убеждение, что мы знаем, что для нас хорошо. А я совсем не уверена, что
  действительно знаем.


  Нам кажется, что с миллионом на счету мы будем счастливы, что партнёр даст нам безопасность и
  покой, что когда-нибудь допишем книгу — и ощутим полноту жизни, что вот достигнем 100 тысяч
  подписчиков на YouTube — и мир наш, а мы наконец «станем кем-то», лучше, чем сейчас. Возможно,
  сейчас мы чувствуем себя «недостаточно хорошими» и хотим наконец почувствовать «достаточно» — и
  для этого нам и нужны те самые результаты.


  Интересно, сколько из вас узнаЮт в себе такое понимание развития, и каковы плоды?


  ## Фантом


  По моему опыту, таким образом мы достигаем только одного: по дороге к своему вымышленному образу
  «кого-то» мы всё дальше уходим от себя и становимся всё несчастнее — независимо от того, достигли
  желаемого или нет. Полагаю, у вас есть похожий опыт. Может, на минуту радуешься своим достижениям,
  появляется чувство «я — кто-то», но это недолго длится, и быстро накатывает странная пустота. Ты
  не совсем понимаешь, что происходит: вроде всё хорошо — и в то же время нет.


  Из этого состояния можно сделать вывод, что нужно «ещё чего-то», что наконец даст желаемое и
  «сделает из тебя того, кем хочешь быть». Либо до тебя дойдёт, что что-то здесь не так. А
  собственно, что именно «не так»?


  То, что очень часто результаты, на которые мы рассчитываем, — вовсе не «обычные» результаты. Мы
  рассчитываем, что они нас создадут, определят, приблизят к нашей идее о себе, к некоему идеалу. То
  есть по сути достижения должны тебя определять — а ты в этой версии становишься искусственной
  конструкцией.


  И ты думаешь, что если приклеишь к себе достаточно «шильдиков» и побед, то сможешь немного стать
  тем «лучшим кем-то», погреться в тепле собственных успехов. Как говорится, «стать лучшей версией
  себя», не обязательно — собой.


  Мы предпочитаем срастись со своим выдуманным образом и шаг за шагом достраивать его подходящими
  результатами — вместо того чтобы быть собой. Нам кажется, что мы знаем, «как должно быть», и, если
  так не будет — «тем хуже для реальности». К несчастью, у реальности есть недостаток: она не
  исчезает лишь потому, что мы придумали другое.


  А наши конструкции родом из очень узкой перспективы — на себя и на жизнь. Мы попросту создаём
  фантом, который пытаемся воплотить. И если все эти результаты должны усиливать нашу идею о себе, а
  на деле — строить фантом, неудивительно, что мы держимся за них зубами и когтями. Только правды в
  этом нет; это далеко от реальности. Не является подлинным, когда мы реализуем свои цели и мечты,
  исходя из стремления поддержать искусственный, выдуманный образ себя.


  Хорошо, а дальше что? Что, лучше вообще не иметь целей, видения, планов, направления? Кто я буду
  без этого всего? Кто я буду без фантома? Кем я стану, если всё перестанет меня определять?


  И это отличный вопрос. Если бы всего этого не было — что осталось бы?


  ## Две дороги


  Для меня это сводится к выбору одной из двух дорог: жить образом или жить правдой. Отсюда два пути
  постановки и реализации целей: ложный — ради поддержания фантома, и настоящий — ради выражения
  подлинного.


  Фантом предполагает заранее фиксированный результат; подлинность — нет. И в зависимости от
  выбранной дороги ты либо будешь прятаться от себя за маской убеждений о себе и мире, либо будешь
  открывать себя без избегания. Это два разных подхода, которые приводят к совершенно разным
  результатам, даже если внешне цели у людей выглядят одинаково.


  Если выберешь маску/фантом — пропасть между внешним и внутренним будет расти; появятся пустота и
  тревога. Если выберешь путь узнавания себя — придёт спокойствие, и пропасть начнёт исчезать. Проще
  говоря: истинное видение разрушит твой ложный образ, а конструирование ложного образа разрушит
  тебя.


  Выбор, конечно, за тобой: можно мучиться, не принимать реальность и строить замки на песке; а
  можно «плыть вместе с жизнью», иметь цели и реализовывать их куда меньшим усилием, а то и с
  удовольствием.


  ## Как это сделать?


  ## Независимость от результата


  Звучит как «золотая таблетка»? На этот раз — нет. Суть в том, чтобы соединять свои настоящие цели
  и стремления с естественным ходом жизни, не зацикливаясь на итогах. Это означает умение оставаться
  верным своим подлинным целям и ценностям, но при этом принимать, что жизнь идёт своим путём — не
  всегда так, как мы планируем.


  Что значит быть независимым от результата? Это можно описать как доверие в действии. Это жизненная
  позиция, способ думать и действовать — в согласии с собой и с реальностью.


  Самое интересное: именно такой подход даёт лучшие результаты и позволяет действовать на
  максимально возможном уровне. Хотя здесь сами результаты — вторичны. Это означает: каким бы ни был
  исход — так или иначе, это «хорошо», потому что само действие в этом сценарии сближает с
  реальностью. Ты просто делаешь всё, что можешь, — а остальное отпускаешь, потому что остальное не
  так важно. И не важно оно потому, что то, что ты делаешь, исходит из правды, а не из строительства
  искусственного образа, за который придётся бесконечно цепляться и трястись.


  ## Быть собой — твоё «максимум»


  Если бы я тревожилась, «как примут» мои статьи — хорошо или плохо, — то, наверное, никогда ничего
  не опубликовала бы. Я не пишу это ради большего количества «лайков». Это приятно, но в сущности —
  не важно.


  Я не настраиваю свою работу под какой-нибудь «скрипт». Я отдала столько, сколько могла, — на этом
  всё. Это лучшее, что я могу. Я не думаю о количестве клиентов — у меня есть цели, да, но случится
  это или нет — отпускаю. Я сосредоточена на том, что делаю, и позволяю себе быть ведомой: вижу, что
  что-то не работает — значит не работает. Не «дожимаю», хотя у меня есть цели и видение — только
  они не из желания подкормить образ.


  Это забавное сочетание: вроде «не очень важно» — и в то же время «не всё равно».


  Я не пытаюсь манипулировать реальностью, собой, людьми или обстоятельствами, чтобы выжать
  желаемое. Не форсирую, не тороплюсь, не пытаюсь вытравить тревогу, страх, неопределённость, хаос.
  Смотрю — и не смотрю на итог.


  Держу открытым ум и стараюсь открывать сердце, слушаю интуицию — просто радуюсь моменту и жизни,
  имея цели. Могу даже визуализировать — но не для того, чтобы приклеиться к видению, а просто
  потому, что это приятное чувство. Это не значит, что если не получу желаемого — мой мир рухнет. Я
  оставляю пространство для разных исходов — не обязательно таких, какие я придумала, хотя у меня
  есть свой замысел. Я вовлечена — хотя не знаю, куда это меня приведёт.


  Так можно раскрыться навстречу тому, «чего хочет от тебя жизнь», а не наоборот. Так успех приходит
  мягко: стоит труда, но не становится навязчивой идеей. Так действия становятся проще, плавнее и
  менее болезненны. Отсутствие жёсткой «калькуляции» и нажима — действительно освобождает.


  Чтобы так было, достаточно обратить внимание: правда ли направление, куда ты хочешь идти, или оно
  должно послужить строительству фантома? Если правда — просто начни, без ожиданий. Если видишь, что
  это попытка определить себя через результат — посмотри, что за этим стоит. Тогда ты начнёшь
  рассматривать то, чего в обычных условиях хотел бы избежать, — через строительство фантома.


  Когда по-настоящему осознаешь, «о чём это», какие у тебя намерения, — фантом начнёт терять
  значение, и легче будет пойти в сторону подлинного выражения себя. Если направление истинно и ты
  не привязан к исходам, ты естественно свяжешь свои цели и стремления с внимательностью к
  реальности — она тоже подаёт сигналы. Если не привязан — ты будешь плыть, но не против течения.
  Естественно соединять свои цели и мечты с тем, что ты улавливаешь — назовём это от Вселенной.


  Только так ты возьмёшь максимум того, что можешь, и будешь реализовывать близкое тебе — с куда
  меньшим усилием. Ты просто реализуешь свой потенциал. Ты не станешь «кем-то бОльшим» или «меньшим»
  — ты станешь собой.


  ## Мир — это ты, а ты — это мир


  К этому хочу добавить ещё одно. Эту концепцию очень легко понять неправильно. Можно решить, что
  раз так, то цели не имеют смысла; или что независимость от результата означает, будто нам «всё
  равно» на результат. Ни то ни другое, на мой взгляд, не верно.


  Хорошо иметь цели, хорошо иметь видение, вовлекаться и действовать. Проблема начинается там, где
  это перестаёт нам служить — то есть, когда усиливает иллюзию, и когда мы пытаемся использовать
  идею «отпускания ожиданий», «освобождение от привязанности к результату» для того, чтобы… всё
  равно получить конкретный результат. Не будь таким человеком, не обманывай себя. Либо ты подлинный
  — либо нет.


  Плыви с жизнью, имей цели, будь собой — и «покори мир», не меняя его, потому что мир — это ты, а
  ты — это мир.


  ## Как эффективно ставить и достигать целей


  - Простой и действенный способ формулировать и достигать цели, которые не будут ещё одним пунктом
  в списке дел.

  - Несколько элементов, которые сделают их реализацию не только легче, но и куда более вероятной.


  ## Что такое цель


  Сколько раз ты говорил или слышал: «Хочу больше денег, хочу быть здоровее, лучшую работу, дом
  побольше, быть стройнее…» — и потом ничего не делал? Такие заявления не имеют ничего общего с
  реальными целями, но хорошо показывают, как легко перепутать случайное желание с целью.


  Цель — это не «хотелка» и не простое стремление, хотя желание можно взять отправной точкой для
  формулирования конкретной цели. Если ты принимаешь желания за цели, значит, по сути, у тебя нет
  реальных целей и шансов их добиться.


  Все хотят «чтобы было лучше», но обычно так не работает, если нет активности, ясного направления и
  готовности идти. Цель — это конкретное обещание будущего удовольствия, однако мы устроены так, что
  скорее избегаем боли, чем стремимся к удовольствию — и, думаю, именно это вызывает главные
  проблемы с достижением целей и вообще с изменениями в жизни. Грамотная постановка целей
  «переключает сценарий» — переводит нас в режим стремления.


  Формулировать цели вроде бы просто, но здесь есть несколько ловушек, в которые легко попасть
  впервые. Из-за них цели могут так и остаться недостигнутыми.


  ## SMART


  Есть очень простая методика постановки целей — многие слышали о ней — SMART. Её часто применяют в
  бизнесе: она просто и чётко формулирует цели. Её слабость (а в некоторых случаях — сила) в том,
  что она мало анализирует более глубокие аспекты цели. Она скорее «операционная»: с её помощью
  легко сформулировать цель с потенциалом реализации — хотя, считаю, этого мало для «верхнеполочных»
  целей. Но прежде объясню, что такое SMART.


  S.M.A.R.T. — это акроним, в котором каждая буква обозначает характеристику цели:


  • S — Specific (специфичная, чётко определённая)


  • M — Measurable (измеримая)


  • A — Achievable / Attractive / Ambitious (достижимая / привлекательная / амбициозная)


  • R — Relevant / Realistic (релевантная / реалистичная)


  • T — Time-bound (ограниченная во времени)


  S — Специфичная: ясно, чего именно ты хочешь достичь. Можно начать с общего «хочу чаще ездить в
  горы» — это первый шаг, направление намечено. Но чтобы это стало SMART-целью, нужно уточнить. Чем
  точнее знаешь, чего хочешь, тем выше шанс добиться. M — Измеримая: насколько часто? Например, 3
  раза в год. Измеримость нужна, чтобы отслеживать прогресс и подтвердить факт достижения: «Я
  действительно уже год/два выезжаю 3 раза в год в разные горы мира». A — Достижимая/Амбициозная:
  ищем мотивацию — что такого важного в этой цели? Зачем она мне? В нашем примере: «потому что это
  реализация моей страсти». R — Реалистичная: в практике — возможна ли цель? Какие ресурсы нужны?
  Больше денег, отпуск, вписать поездки в семейную жизнь… Есть ли время, физическая и психическая
  энергия? Если нет — как добыть и хочу ли я этого на данном этапе? T — Сроки: конкретная дата или
  период. Например: «Каждый год, начиная с 2025-го, я буду ездить в горы 3 раза».


  ## SMART — недостаточно


  Кажется, мы застряли в «задачном» мире, где, как машины, выполняем пункты, а SMART идеально
  вписывается в эту культуру — что-то вроде чек-листа к отметке. Он звучит как обязанность — и,
  думаю, оставить цель на этом уровне значит сильно повысить вероятность её несвершения.


  Меня более всего в SMART задевает требование «реалистичности». Если бы Христофор Колумб ставил
  цели по SMART, он бы не вышел из порта. Если бы Мартин Лютер Кинг ставил цель по SMART, фраза «I
  have a dream» так и не прозвучала бы.


  SMART-у недостаёт по-настоящему мотивирующего компонента — эмоциональной связи цели с живой
  мечтой, стоящей за ней; такого сильного видения, чтобы даже сухая формулировка начинала сочиться
  сочными смысловыми и эмоциональными «дивидендами». Вот чего здесь не хватает.


  Хочу подчеркнуть три вещи, которые помогут «оживить» SMART-цели — и на операционном уровне, и на
  уровне мотивации.


  ## План, «зачем» и что в этом прекрасного


  1) Конкретный план. Раз есть цель, нужен план практической реализации: что именно, когда и с какой
  периодичностью ты сделаешь. Это перевод цели в набор задач. Плюс — краткий протокол действий «на
  случай сбоев». Чем конкретнее — тем лучше.


  2) «Зачем» — ценность. Без выхода к ценности — сердцевине цели — трудно разбудить настоящую
  мотивацию. Спроси себя: «Зачем на самом деле мне эти горы? Что там такого? Что даёт мне эта
  страсть?» В моём случае за поездками стоит ценность СВОБОДА. Вот источник главной мотивации.
  Полезно помнить: ценность можно проживать и другими способами — если горы временно недоступны,
  ищем альтернативы, чтобы не впадать в фрустрацию.


  3) Эмоциональный образ. Опиши для себя, что ты чувствуешь, когда реализуешь цель. Например: «Когда
  я в горах, меня наполняет чувство свободы, всё становится возможным. Всё тело пульсирует жизнью и
  сладкой усталостью. Красота природы и мощь гор возвращают мне внутреннюю гармонию — так я очищаюсь
  и отдыхаю». Так цель связывается с эмоциями и ценностями — и становится притягательнее, а
  вероятность реализации растёт.


  И ещё… Цель должна быть сформулирована позитивно: говори, чего хочешь, а не чего не хочешь. «Не
  хочу весь год сидеть дома» → «Хочу часто ездить в горы» — и дальше уточняем по SMART.


  Цель должна зависеть от тебя: «Хочу каждый раз ездить в горы с мужем/женой» — зависит не только от
  тебя. Важно, чтобы цели были амбициозными — парадоксально, так их легче достигать: «Хочу в Альпы»,
  а не «в уже привычные в Крыму». Большая, новая, захватывающая цель поднимает энергию.


  Цели нужно записывать — это маленькое обязательство. Незаписанная цель быстро забудется. Помогает
  и сказать о цели тому, чьё мнение для тебя особенно важно — это повышает дисциплину.


  ## На чём фокус при реализации


  Многие советуют «держать в фокусе большой итог». Полезно видеть его ежедневно — на заставке
  телефона, над кроватью, на зеркале — рядом краткий план и эмоциональное описание ценности. Это
  помогает не забывать и поддерживает мотивацию. Но главный фокус должен сместиться на план — на
  ежедневные маленькие выборы: регулярные накопления на поездки, физподготовка, организация отпуска
  и работы так, чтобы цель стала возможной. Малые, единичные элементы плана — без них большая цель
  либо невозможна, либо очень трудна. Ключ к большому — фокус на малом.


  Разумеется, стоит сверять ежедневные действия с большим ориентиром: каков прогресс, сработает ли
  план в заданные сроки. Но без маленьких шагов — ничего не выйдет.


  ## Зачем вообще цели


  Что меняется в жизни человека, который ставит цели, согласованные с его ценностями? Такой человек
  — активная творческая сила своей жизни: он не плывёт пассивно по течению, он действует. Цели
  становятся источником мотивации и удовлетворения, укрепляют самооценку — это один из столпов так
  называемой «целеустремлённой жизни», воспитывают выдержку, волю и дисциплину. Наличие целей
  добавляет смелости, повышает решительность, помогает справляться со страхом и беспомощностью,
  свойственными людям без целей. Это не значит, что всё будет «розово и идеально», это значит, что
  препятствия преодолевать легче — потому что за целью стоит нечто важнее, чем сам временный тупик.


  ## С чего начать


  1) Разумный старт — посмотреть на свою текущую ситуацию. Где ты сейчас? Оценить степень
  удовлетворённости в разных сферах: работа, семья, финансы, физическая форма и здоровье, личное
  развитие, отдых, хобби и интересы, интимная жизнь и т. д. Каждую значимую сферу оценить по шкале
  1–10 и записать, что именно означает для тебя эта цифра. Так ты увидишь, что уже есть и на каком
  уровне ты находишься.


  2) Найди время для тихой рефлексии о мечтах. Час в неделю без людей, телефона, компьютера, ТВ —
  только ты, блокнот и ручка. Поток мыслей: не обязательно конкретно — до конкретики дойдём позже.
  Просто признай, что мечты у тебя есть — и из-за отсутствия отвлечений они начнут проступать.


  3) Думай о том, что приносит тебе наибольшее удовольствие, от чего кровь бежит быстрее. Чего бы ты
  хотел добиться? Что по-настоящему возбуждает и радует? Что бы ты сделал, будь успех гарантирован,
  без ограничений? Эти вопросы помогут перейти к следующему шагу.


  4) Выпиши все свои мечты. Не думай — просто пиши: пусть будет нелогично, повторно, без цензуры.
  Это не обязано быть «реальным» или «разумным». Даже самые дикие и безумные идеи — на бумагу. Пусть
  будет 100 или 200 — пиши, пока не иссякнет.


  5) Выбери самые важные — те, от которых «теплеет». То, что зажигает внутренний огонь. Большие
  вещи. Расставь по приоритету.


  6) Допустим, у тебя получилось 20 главных мечтаний. Преврати их в цели по SMART. Не со всеми
  получится — и это хорошо. Так из мечтаний родится около 20 потенциальных целей, к которым можно
  привязать ценности, составить план и добавить эмоциональное видение — описание, что в них для тебя
  привлекательно. Не обязательно реализовывать все записанные цели. И даже лучше, что так: по тому,
  куда уходит больше сил и энергии, ты поймёшь, что действительно важно. Тратить время на
  второстепенное — значит мешать продвижению в главном.


  Возможно, среди мечтаний был жизненный замысел — «большая мечта», кажущаяся нереальной. То, что ты
  хочешь отдать миру. Это не будет SMART-целью с готовой дорогой и решением. Придётся прорубать
  собственную тропу. Думаю, только в таком формате можно определить свой жизненный ориентир и
  создать собственную структуру его реализации — говорить о нём языком мечты, а не только
  прагматичный языком.


  И это - базовый изъян SMART: жизненную цель, миссию, призвание нельзя уложить лишь в прагматичный
  контекст. Жизненной цели подчиняются многие другие, меньшие, — и благодаря этому человек
  чувствует, что реализует призвание, а не «разменивается по мелочам», определяя цели только по
  SMART.


  SMART — мало. Нужна точка отсчёта — мечта, стоящая за целями, настолько большая, что даже пугает.
  Да, даже величайшие мечты нужно приземлять в действия, но только такой подход гарантирует, что
  вместо «задачности» мы удержим широкий контекст: сначала наше «зачем», и лишь затем — «как». И это
  правильная последовательность при постановке самых больших и важных в жизни целей.
