author: Лилия Янушкевич (подтвердить авторство после редакторской проверки)
content: '## Цена — не единственный критерий


  Стоимость консультации может отражать образование, накопленный опыт, формат работы и организационные расходы. Но высокая
  цена сама по себе не гарантирует, что конкретный специалист будет вам подходить.


  ## Что важно узнать заранее


  Уточните, сколько длится встреча, какая стоимость действует для первой и последующих консультаций, нужны ли дополнительные
  платежи, как происходит перенос и отмена. Договорённости полезно получить в понятном письменном виде.


  ## Разовый разговор и регулярная работа


  Иногда человеку нужно прояснить конкретную ситуацию, в других случаях запрос предполагает последовательную работу. Вопрос
  о формате лучше обсуждать после знакомства и без обязательства покупать пакет встреч.


  ## Проверяем собственный комфорт


  Решение о продолжении должно учитывать не только финансы, но и чувство доверия и понимание процесса. Актуальные цены именно
  Лилии Янушкевич появятся на сайте после подтверждения владельцем.

