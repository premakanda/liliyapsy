content: '## У разных запросов разный масштаб


  Сложная жизненная развилка, повторяющиеся конфликты и глубокое чувство неуверенности могут требовать разного времени для
  обсуждения. На продолжительность влияют обстоятельства, доступные ресурсы, регулярность встреч и то, как человек оценивает
  движение к своей цели.


  ## Ориентиры вместо обещаний


  После знакомства можно обсудить, что хотелось бы изменить и по каким признакам вы заметите движение. Такие ориентиры полезнее
  обещания решить определённую проблему к конкретной дате.


  ## Можно пересматривать цели


  Иногда запрос уточняется в процессе. Человек вправе задавать вопросы об эффективности работы, предлагать обсудить промежуточные
  результаты и менять приоритеты.


  ## Когда завершать


  Решение о завершении можно принять совместно, когда человек чувствует, что получил достаточно пользы для актуального запроса,
  либо когда нужно сменить специалиста или формат. Важно, чтобы завершение было понятным и уважительным.

