content: >-
  ## Когнитивные искажения — что это?


  Когнитивные искажения — это такие ошибки мышления. Нам кажется, что мы всегда решаем всё логично,
  но на самом деле мы часто полагаемся на простые привычные схемы. Это как «ярлыки в голове»: они
  помогают быстро принимать решения и экономят силы — иначе мы бы застревали на каждом шаге. Но беда
  в том, что эти схемы не всегда подходят. В сложных ситуациях они могут подвести и привести к
  серьёзным ошибкам.


  Слово «когнитивные ошибки» звучит пугающе, но на самом деле они часто помогают — мы решаем быстрее
  и тратим меньше сил. Иногда мы используем их просто из лени, чтобы не думать слишком глубоко или
  не портить себе настроение. Главная сложность в том, что свои собственные ошибки мы почти не
  замечаем. Даже если знаем о них, полностью избежать их невозможно. Но это знание полезно: важно
  понимать, когда стоит задуматься и разбирать ситуацию, а когда можно спокойно полагаться на
  привычные «ярлыки».


  Что делать, зависит от веса решения. Вряд ли стоит разбирать ошибки ради выбора «Mercedes или
  Audi» — стоимость промаха невысока. Но если решается «быть или не быть» твоему бизнесу — полезно
  заранее понять, какие искажения могут всплыть в голове.


  Что именно такое когнитивные искажения? Это повторяющиеся отклонения от рационального мышления и
  поведения: мы систематически «съезжаем» в одну и ту же колею и приходим к схожему типу ошибки.
  Примеры: мы острее чувствуем потерю, чем равноценный выигрыш. Потерянные 100 долларов ранят
  сильнее, чем найденные 100 радуют; чтобы компенсировать потерю, нужно найти примерно 200. Или: мы
  выше ценим вещь, которая уже наша, чем идентичную, но чужую (сам предмет от этого объективно не
  меняется).


  Искажений море, но сегодня рассмотрим несколько, которые особенно сильно могут увести жизнь не
  туда или надолго застрять её в неудобной точке.


  ## Эффект подтверждения


  Факты не меняются от того, что мы их игнорируем — а эффект подтверждения этому сильно помогает.
  Это склонность подтверждать то, во что уже веришь. Мы отбрасываем сведения, противоречащие нашим
  убеждениям, и активно ищем подтверждения своим взглядам, аккуратно поддерживая целостность своего
  мировоззрения, чтобы не задеть эго.


  Чем крепче убеждение, тем легче мы себя обманываем, видим мир в кривом зеркале и игнорируем
  противоречащие факты — и это опасно. Веришь, что «люди злые, мир жестокий» — найдёшь этому
  подтверждения и отфильтруешь добро. Веришь в обратное — тоже найдёшь подтверждения и
  проигнорируешь негатив. И так ты становишься носителем убеждений, которые властвуют над тобой, а
  не наоборот.


  Ситуацию усугубляют медиа и Интернет: никогда ещё не было так просто найти «эхо-камеру» и
  бесконечно усиливать собственную «правду». Лекарство — регулярно ставить под сомнение свои самые
  «несомненные» взгляды. Это неприятно (часто на них держится вся конструкция жизни), но именно
  «убийство любимых теорий» даёт рывок вперёд: старый порядок рушится, на время возникает хаос —
  чтобы появилось место для лучшего порядка.


  ## Эффект невозвратных (утонувших) затрат


  «Я 30 лет работаю в этой компании — не могу просто уйти», «столько вложено в этот союз — не
  разорвать, хоть несчастлив(а)», «вложил кучу денег в ремонт машины — продавать жалко». Знакомо?
  Это и есть ошибка: ориентир на уже потраченные время/деньги/силы удерживает нас в невыгодных
  решениях и тянет к дальнейшим затратам.


  Рациональнее «отрезать хвост» — искать работу, где не умираешь душой; заканчивать отношения,
  приносящие одни беды; продавать проблемный авто. Правило: игнорируй прошлые вложения и оценивай
  решение с точки зрения настоящего и будущего. Чем дольше тонем, тем труднее выбраться.


  ## То, что на поверхности


  Представь генерала, у которого есть несколько любимых приёмов. Он применяет их снова и снова, даже
  если ситуация совсем другая. Он выбирает то, что первым приходит в голову, а не то, что реально
  лучше.


  Мы часто поступаем так же — берём первое решение, которое всплыло в памяти. Чтобы не попасть в эту
  ловушку, полезно общаться с людьми, которые мыслят иначе, и учиться видеть больше вариантов. Ведь
  если у тебя в руках только молоток, всё вокруг будет казаться гвоздями.


  ## Иллюзия нулевого риска


  Все хотят выигрыш без риска. Мы стремимся его минимизировать, а лучше — ликвидировать, и готовы
  дорого платить за иллюзию нуля. Но управление риском — это не устранение, а дозирование. В жизни
  невозможно убрать риск полностью, да и не всегда это выгодно. Неопределённость — часть изменений,
  роста и возможностей. Примирись с тем, что абсолютной гарантии нет нигде. Разумно дозируй риск и
  не откладывай важное «пока не станет совсем безопасно».


  ## Адаптация к счастью


  Мы надеемся, что достижение цели даст устойчивое счастье: должность, сумма на счёте, машина… Увы,
  радость быстро «нормализуется», и уровень благополучия возвращается к прежнему. Мы ставим новые
  цели в погоне за тем же ощущением — и так по кругу. Помни об этом эффекте, чтобы не подменять
  смысл жизни бесконечной гонкой за краткими всплесками дофамина.


  ## Иллюзия действия


  Мы переоцениваем любое действие и недооцениваем паузы и наблюдение. Делать хоть что-то зачастую
  психологически легче, чем остановиться и подумать — особенно в неясности (исторически «в раздумьях
  мог съесть тигр»). Итог: много суеты — мало прогресса.


  Если не знаешь, что делать, сначала осмысли ситуацию, выбери точку старта — и только потом
  действуй. Паскаль был прав: «все несчастья людей от того, что они не умеют спокойно сидеть в
  комнате». Попробуй час посидеть без дел, телефона и книжки — увидишь, как тянет «что-нибудь
  сделать».


  ## Социальное доказательство


  «Если многие так думают/делают — значит, это верно». Нет. Количество сторонников не делает идею
  истинной. Мы легко поддаёмся групповому давлению и порой отвечаем в группе прямо противоположно
  тому, что сказали бы один на один.


  Будь настороже к фразам «все так делают» и к рекламе «бестселлер, миллионы покупателей». Сверяй
  «что думает группа» с твоими ценностями и фактами. Радикальный пример злоупотребления — массовые
  суициды в сектах.


  ## Когнитивный диссонанс


  Коротко: как мы себя обманываем ради душевного комфорта. Ты стремился к повышению — не вышло.
  Возникает противоречие «хотел — не получил», неприятное напряжение. Один из «лёгких» способов
  снять его — придумать утешительную историю: «ну и хорошо, будет время на свой бизнес», — хотя
  десять лет ты так и не сделал ни шага.


  Цена такого самоуспокоения — отсутствие прогресса. Честнее признать: мне было важно, мне больно —
  и использовать это напряжение как топливо для развития: либо расти в компании, либо наконец начать
  свой проект.


  ## Как снизить ущерб от когнитивных искажений


  Искажения не нужно «вырывать с корнем» — они помогают экономить силы и сохраняют энергию. Но важно
  понимать, где можно доверять быстрым решениям, а где стоит притормозить и проверить себя.


  Важно понимать, какие бывают задачи:

  - В мелочах опирайся на простые правила — не трать силы на то, что не имеет большого значения.

  - В серьёзных решениях (работа, бизнес, отношения, деньги, дети) — замедляйся и смотри, не сбивают
  ли тебя привычные ошибки мышления: эффект подтверждения, «утонувшие» затраты, влияние чужого
  мнения, иллюзия контроля и другие. Так ты начнёшь принимать более ясные решения, а значит —
  станешь спокойнее и счастливее.
