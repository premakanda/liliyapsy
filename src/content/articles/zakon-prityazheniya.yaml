content: >-
  ## Закон притяжения: популярный подход


  Что первым делом приходит в голову, когда слышим «закон притяжения»? Что о нём говорят, как мы это
  понимаем и какие у нас ожидания? Кто-то, возможно, не имеет никаких представлений, но многие
  смотрели фильм «Секрет» и были впечатлены тем, как легко, согласно этой теории, можно получать от
  жизни всё, что захочешь. Фильм звучит убедительно: выступают учёные, психологи, физики — вроде бы
  всё солидно. Есть и более глубокий — метафизический — слой: мол, Вселенная будет исполнять наши
  желания, если мы правильно всё сделаем, а закон притяжения как раз для этого и нужен.


  Проще говоря, речь о манифестации — притягивании в свою жизнь желаемого через «посыл» Вселенной
  соответствующих сигналов: что излучаешь — то и получаешь. Посылаешь позитив — притягиваешь
  позитивные обстоятельства; кормишься негативными мыслями и чувствами — притягиваешь негатив. Иными
  словами: на чём фокусируешься, того становится больше. Отсюда совет: думай о том, чего хочешь (а
  не о том, чего не хочешь), культивируй положительные эмоции — и Вселенная принесёт ещё больше
  хорошего.


  ## Как это делать на практике?


  В классике закона притяжения обычно выделяют такие шаги:


  1) Определи, чего хочешь. С этого всё начинается. Здесь уже первые трудности: многие вообще не
  знают, чего хотят; проще назвать то, чего не хотят. Но и это можно развернуть: от «чего не хочу»
  перейти к «чего хочу вместо этого». Лучше формулировать позитивно и по-крупному. Не «не хочу
  долгов», а «у меня 100 тыс. евро на счету». Желание должно быть настолько большим, чтобы едва
  помещалось бы в голове. Замечу, что в фильмах и книгах о законе притяжения желания почти всегда
  материальные: богатство, дома, машины — к этому ещё вернусь.


  2) Найди и «очисти» блокирующие убеждения. После формулировки намерения всплывают сомнения и
  отговорки: «я недостоин…», «я недостаточно способный…», «я не зарабатываю достаточно…», «я не
  умею…». Эти установки блокируют манифестацию, поэтому их надо обнаружить и проработать — привести
  в согласие сознательное и бессознательное. Если ты всем сердцем хочешь дом, но внутри уверен, что
  это невозможно, ты посылаешь Вселенной противоречивые сигналы — и желание не сбудется.


  3) Проживи как «уже имеющееся». Нужно ярко представить, что желаемое уже осуществилось: увидеть,
  услышать, «потрогать», прочувствовать эмоции обладания. Это «уреаливает» намерение и, как
  считается, поднимает позитивные эмоции (а значит, притягивает позитивные обстоятельства). Похоже
  работает и благодарность: когда ты доволен тем, что уже есть, позитив множится.


  4) Отпусти контроль и действуй «по вдохновению». Формула такая: Я этого хочу, очень хочу, но если
  не получу — тоже ок. То есть не зависеть от результата; якобы тогда Вселенная быстрее доставит
  «заказ», потому что намерение идёт не из нехватки, а из удовлетворённого «здесь-и-сейчас». При
  этом не предписывается бездействовать: нужно совершать вдохновлённые действия — следовать
  внутренним импульсам: позвонить старому знакомому, написать письмо, появиться в нужном месте и
  т.п.


  ## Как это работает на самом деле


  Хорошо. Но работает ли это так на самом деле?


  И да, и нет. Если оголить закон притяжения — убрать Вселенную, энергии и всю метафизику, — что
  останется? Ровно то, что мы и так делаем, чтобы достигать целей. Всё вполне земное: чётко
  формулировать желаемое в позитивной форме, работать с ограничивающими убеждениями и мысленными
  привычками, визуализировать, поддерживать нужное эмоциональное состояние, планировать и
  действовать, меньше цепляясь за результат и больше — за процесс.


  Магии здесь нет: это работа с умом — направлять внимание к желаемому, а не к проблемам и
  препятствиям. Желаемое, которое тебя вдохновляет, поднимает эмоции, помогает обозначить цели,
  преодолеть внутренние/внешние барьеры, спланировать путь и — в хорошем состоянии — дойти до
  действий, которые эффективнее. Если ты зациклен только на проблемах, ты не знаешь, чего хочешь, а
  лишь воюешь с «ветряками», и это логично тянет за собой отрицательные мысли и эмоции, которые
  ухудшают поведение, а значит и результат.


  Простой пример: ты идёшь на собеседование и уверен, что «не достоин», «не справишься», «тебя
  разоблачат». Какие эмоции и поведение это породит? Робость, зажатость, извиняющийся тон — и,
  вероятно, само исполняющееся пророчество о провале. Поэтому, вместо бесконечной починки
  «недостатков», определи вдохновляющее видение будущего, очисти голову от мусора, наведи порядок в
  убеждениях, эмоциях и планах — и действуй. Porsche не появится у твоего подъезда только потому,
  что ты рисуешь его на карточке и смотришь каждый день. И уж точно Вселенная не существует ради
  исполнения эгоистичных прихотей.


  По сути, твой внутренний мир — убеждения, ожидания, прошлый опыт — либо подталкивает тебя к
  действиям и состояниям, ведущим к целям, либо уводит в сторону. Смысл — обуздать ум, чтобы он
  помогал, а не мешал. Желаемое притягивается либо твоими действиями, либо случайностью вроде
  выигрыша — в любом случае речь о вероятностях, а не о магической доставке.


  ## Ловушка


  Если всё так приземлённо, где же здесь ловушка?


  В книгах и фильмах про закон притяжения желания почти всегда про «богатства»: машины, дома,
  контракты, деньги, даже парковочные места. Сам по себе материальный уровень ок. Вопрос — зачем мы
  так рвёмся притянуть эти вещи и готовы на всё, включая «магические» практики?


  Во-первых, потому что это проще, чем честно пахать. Во-вторых, потому что «все хотят быть
  счастливыми» и верят, что обладание желаемым их «исцелит». Ловушка в том, что независимо от того,
  добудешь ли ты Porsche тяжёлым трудом или «оно упадёт с неба», счастья это не даст. Это топливо
  для Эго. Закон притяжения в метафизической подаче — всего лишь ещё один способ манипулировать
  реальностью ради ненасытного эго. А эго одной машиной не насытить: захочется больше, круче,
  дороже. Это гонка без финиша.


  Проблема глубже: это способ отношения к реальности. Мы пытаемся манипулировать всем — собой,
  другими и самой реальностью — в пользу своего эго: «Суд судом, а справедливость должна быть на
  нашей стороне». И даже когда получаем своё, очень скоро хотим другого или большего. Метод под
  названием «Вселенная, принеси по моему списку» подпитывает этот голод.


  ## Есть ли в этом хоть какая-то духовность?


  Да, здесь есть духовная грань, но я вижу её иначе, чем это описывают классики закона притяжения.
  Не в том дело, что вселенная магически исполнит наши прихоти. Я бы развернула вектор: куда
  интереснее, что сама жизнь приносит нам, чем то, что мы пытаемся выторговать, сидя в ограниченной
  позиции вечных хотелок эго.


  Как делаю я: да, я ставлю цели, иду к ним, работаю с убеждениями и умом, иногда визуализирую,
  поднимаю эмоции и действую, отпуская результат — я за это. Но вместо ожидания, что это сделает
  меня счастливой, вместо давления и «выкручивания рук» реальности — доверяю, что жизнь знает лучше.
  Я подстраиваюсь под то, чего хочет жизнь, а не только под своё хочу. Делаю своё и остаюсь открытой
  к тому, что приносит вселенная, вместо манипуляций ради эгоистичных прихотей.


  Жизнь приносит гораздо больше, чем я способна придумать из узкой перспективы эго, и приносит то,
  что тебе сейчас нужно для роста сознания, а не для насыщения эго. Смысл — хотеть воли вселенной, а
  не навязывать ей свою. Откуда мне, из моей ограниченной позиции, знать, что мне действительно на
  пользу? Можно иметь желания и делать шаги в их сторону — но не моя воля главная. В гармонии с
  жизнью ты можешь получить то, о чём эго и мечтать не смело. Желания, идущие из глубины, и желания
  эго — разные. Изобилие при этом никуда не девается — но оно иное по качеству.


  Искусство — не быть пассивным, но при этом сдаться жизни. Тогда происходят по-настоящему
  удивительные вещи, естественным образом рождаются огромная благодарность и любовь. Не нужно
  манипулировать и жить по принципу: сдамся и доверюсь — лишь бы всё было по-моему. Речь не об этом.
  Последнее слово — за вселенной: она принесёт ровно столько и ровно то, что нужно, без подпитки
  вечного голода эго. Мой опыт именно такой: во многих смыслах — наоборот, чем в начальной схеме
  закона притяжения. И, честно, я давно не была такой спокойной и довольной. Мною не дёргают
  ненасытные желания и беспокойство.


  И ещё одна мысль, которую легко перепутать: мы часто принимаем удовлетворение желания и
  удовольствие за подлинное счастье. Но счастье приносит ум, свободный от желания, а не объект,
  который его удовлетворил. Заметьте: спокойствие приходит после удовлетворения — потому что на миг
  ты свободен от хотения — и мы ошибочно приписываем «вещам» силу «делать нас счастливыми». На самом
  деле счастье — это отсутствие жажды.
