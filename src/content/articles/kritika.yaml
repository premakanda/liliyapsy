content: >-
  ## Как избежать критики


  Аристотель писал: если хочешь избежать критики — ничего не говори, ничего не делай и ничем не
  будь. Думаю, даже это не спасёт: тебя всё равно упрекнут за то, что ты молчишь, ничего не делаешь
  и, по сути, «никто». Кем бы ты ни был, найдётся тот, кто раскритикует твою внешность, характер,
  работу — за то, какой ты есть… или какой не есть. Мы окружены критикой как никогда прежде: сегодня
  критиковать может весь мир — стоит только тебе или твоей работе оказаться в интернете. Причём чаще
  всего тебя судят люди, которые не имеют ни малейшего представления о том, кто ты, и делают выводы
  по обрывкам публикаций, решая, будто знают о тебе всё.


  Для многих такая критика особенно тяжела: она воспринимается как обидная и несправедливая — и
  нередко такой и бывает. С другой стороны, слова людей, которые ничего для нас не значат, могут
  ранить меньше, чем колкость близкого. Всё зависит от человека и того, как он это принимает.


  Чаще всего под удар попадают те, кто что-то вообще делает: необычное, публичное, крупное; те, у
  кого непопулярные взгляды и кто не боится их озвучивать; просто известные — актёры, музыканты,
  политики — чья жизнь фактически стала публичной.


  Критика тяжела почти для всех — независимо от источника и даже от её справедливости. Похвалы
  слушать приятнее. Иногда советуют «секреты стойкости»: «не обращай внимания», «забудь», «делай
  своё», «ты достоин лишь похвал». Но я считаю, что полностью игнорировать негатив — плохая идея:
  критика несёт огромный потенциал, который нельзя терять из-за неспособности с ней обращаться.


  ## Как извлекать пользу из критики


  Речь, конечно, не о хейте ради хейта, о сливе злости и желании задеть. Я говорю о такой критике,
  которая может улучшить то, что ты делаешь, — то есть о конструктивной. Чтобы ей воспользоваться,
  важна форма, в которой она подана, но ещё важнее — твоя готовность её принять. Полное
  игнорирование всех замечаний — не выход. Выход — такое отношение к критике, при котором ты
  переносишь её достойно и используешь в своих интересах: для развития и доработки того, что
  делаешь, опираясь на свою цель, своё видение.


  Другими словами: использовать чужое замечание, чтобы ускорить рост, повысить качество работы или
  изменить поведение. Для этого иногда полезно послушать, что люди говорят о твоих делах,
  творчестве, манере. Это не «истина в последней инстанции», но это может быть подсказкой,
  материалом, который ты адаптируешь под свои задачи и применишь в согласии с тем, куда идёшь.


  ## Конструктивная критика


  Её условно два типа. Первый — когда мысль верная и опирается на факты, но высказана неловко.
  Второй — когда и по существу верно, и форма уважительная и точная.


  Пример из моего опыта: людям не нравилось качество звука в моих видео. Писали по-разному: кто-то с
  юмором — «кладу телефон в миску и сажусь в ванной, чтобы хоть что-то расслышать»; кто-то резко —
  «звук ужасный, выключил через пару минут»; кто-то давал советы — «какой микрофон купить», «как
  обработать», кто-то даже предлагал помощь с обработкой. Все говорили об одном и том же, но
  совершенно разными словами.


  Как ни скажи — это была конструктивная критика: факт (звук действительно был слабым) стимулировал
  меня экспериментировать и исправлять. Конструктив в этом смысле как боль в теле: не всегда
  приятно, но сигнализирует, что что-то не так, обрати внимание. Игнорировать, как стрелять себе в
  ногу.


  Важно уметь смотреть сквозь туман неудачной подачи на сам факт: правда ли это? Хотя, конечно,
  форма влияет на готовность человека услышать и учесть замечание.


  ## Сэндвич-метод


  Лучшая конструктивная критика — это и корректность по сути, и бережная форма. Даже когда человек
  прав, но говорит неумело, у многих включается авто оборона, и дальше говорить бесполезно. Самая
  рабочая техника обратной связи — «бутерброд»: замечание между двумя проявлениями признательности.


  Про звук это могло бы звучать так: «Мне нравится ваша работа, но звук очень тихий, я не дослушал —
  хорошо бы его подтянуть. В любом случае спасибо за видеоуроки». Такая подача — подарок: и по делу,
  и шансы быть услышанным максимальные. У адресата не запускается защитный рефлекс.


  И все же, главное при работе с критикой — не «как её сказали», а как ты её принял, отреагировал и
  использовал.


  ## Правда критики


  Если у тебя зрелая позиция, ты извлечёшь пользу даже из неуклюже сформулированной, но фактической
  реплики: спокойно оценишь и поправишь. А если можешь это — тем легче тебе будет принять критику,
  сказанную корректно.


  Помни: не все умеют говорить «по-красивому» и не все хотят — это не отменяет их правоты. Важнее
  всего — истинность.


  ## Разрушительная критика


  В отличие от конструктивной, она пустая: «ты тупой», «уродливый», «некомпетентный», «всё у тебя —
  отстой» и прочий набор. Это хейт. И то, заденет он тебя или нет, во многом зависит от тебя, как и
  в случае конструктивной. Факт в том, что разрушительная критика всегда больше говорит о
  критикующем, чем о тебе.


  Это защитный механизм его эго: что-то в твоём взгляде, поведении, внешности, работе зацепило его
  картину мира. Нападая, он защищает свой мирок. Он реагирует не на тебя, а на свои эмоции.
  Парадокс: самые ярые критики сильнее всех боятся критики. Хейтер заранее бьёт первым, чтобы
  отвести удар и почувствовать себя значимым.


  Часто цель хейтера — секунда твоего внимания. В глубине он хотел бы быть ближе к тебе, быть как ты
  или делать то, что делаешь ты — поэтому и тратит силы на едкие комментарии. Ответив, ты порой
  ощутишь, как «там» спало напряжение. Тут возможны два сценария: — ты отвечаешь честно и
  обезоруживающе, и внезапно человек смягчается — оказывается, он вовсе не монстр, а иногда и в
  целом за тебя; — или хейтер только и ждал реакции, чтобы вцепиться и закрутить бурю в стакане —
  втянуть в пустую перепалку ради собственной важности.


  ## Вовлечённый хейтер


  Чего хейтер не видит: даже выцарапывая секунду внимания, он теряет уважение окружающих. Кто
  оставляет такие комменты? Чаще те, кто сам ничего стоящего не делает — им мешает страх получить в
  ответ такую же критику. Бумеранг: постоянный негатив парализует действия — человек ничего не
  делает, потому что боится критики.


  И ещё: столько энергии уходит у некоторых на производство однотипных злых реплик, которые часто
  даже не проходят модерацию. Направь эту же силу в конструктив — и можно было бы творить чудеса,
  вместо того чтобы мешать себе и другим.


  ## Когда мы особенно ранимы


  Критика никогда не сахар, особенно когда попадает точно в то, что для нас важно, или в наши
  собственные сомнения. Самый уязвимый период — начало: ты осваиваешь новое, показываешь первые
  работы, знаешь, что далеко до желаемого качества. В это время меткая, но разрушительная реплика
  легко приклеивается: мы склонны внутренне соглашаться, и один негатив может гудеть в голове часами
  и днями, перевешивая десятки похвал. Ворота для критики широко открыты, для похвал — закрыты.


  Если пережить этот этап, кожа грубеет: задевает меньше. И это ещё раз показывает: дело не в
  критикующем и не в самой критике, а в твоей реакции и последующих действиях.


  ## Типичные реакции на критику


  — Сдаться: отказаться от задуманного или уже начатого. Худший вариант — бросить из-за чьего-то
  мимолётного мнения, особенно на старте. — Атаковать: обороняться, спорить, часами доказывать,
  почему ты прав. Обычно это бесцельно: собеседнику нужен не смысл, а реакция. — Делать вид, что не
  цепляет — хотя цепляет. — Заводиться от негатива: «Я всем докажу!» — такой «топливный» гнев. —
  Самоуничижение напоказ — чтобы услышать в ответ обязательные «да ты что, всё классно!». —
  Использовать критику как фидбек: спокойно сверять с целью и планом, что можно улучшить — и
  улучшать.


  Последний вариант — лучший. Ты знаешь, чего хочешь и кто ты; берёшь критические слова, соотносишь
  с траекторией и думаешь: как это использовать, чтобы прийти быстрее и лучше. Не чтобы сдаться, не
  чтобы разозлиться, не чтобы изображать бесчувственность и не чтобы выманивать дешёвые похвалы. Это
  ускоряет развитие, даёт идеи, а твоё дело остаётся независимым от чужих мнений — потому что
  решаешь ты, как ими распоряжаться.


  ## Как справляться с критикой на практике


  Многие советы бесполезны в огне момента: «убери эмоции», «не думай», «забудь». Проще сказать, чем
  сделать. Главная задача — обуздать первый импульс: не рвануть в резкую реакцию, не вспыхнуть.
  Иначе мы слепнем к сути, воспринимаем слишком лично, а надо — серьёзно, но безлично.


  Что поможет сдержать первый порыв? Попробуй сменить перспективу: а если бы любое замечание — от
  грубого до грамотного — звучало из уст ребёнка? Это не значит, что так и есть —попробуй так
  отнестись.


  Детская реплика может быть честной, неловкой, неверной, обидной, меткой. Но реакция у тебя будет
  другой. Если ребёнок сказал бы: «Твоя работа — отстой», ты вряд ли закричал бы: «Отстой — ты сам!»
  Скорее, ты не принял бы на личный счёт, остановился, спокойно подумал: есть ли тут смысл, как
  ответить и нет ли в этом зёрнышка правды — даже если форма неприемлема.


  В мире, где многие выражают мысли и эмоции довольно по-детски, такая перспектива помогает держать
  дистанцию и одновременно — сочувствие к говорящему, даже к хейтеру. Это позволяет принимать любую
  критику без обиды и суеты — с достоинством. Пользоваться ею и при этом не вовлекаться в пустые
  споры, отвечать (или не отвечать) по своему выбору, а не по приказу эго и его автоматических
  рефлексов.


  ## Независимость от оценок


  Лучше всего — дистанция и независимость от мнений, хороших и плохих. Если ты зависишь от чужих
  похвал, ты неизбежно зависишь и от чужой критики. Тогда ты начнёшь делать не то, что хочешь, а то,
  что одобряют, и избегать того, за что ругают. Независимость — это не игнорирование. Это память о
  том, кто ты, зачем ты это делаешь, знание своих сильных и слабых сторон, готовность признать
  слабости и защитить сильные — вне зависимости от того, кто тебя критикует. Это умение использовать
  даже экспертную критику — чтобы укреплять свою самостоятельность в важной для тебя области, в
  работе, мышлении и взгляде на мир.


  То, что ты делаешь, должно быть выражением тебя — с опорой на знания, вдохновение и опыт других,
  но проходящим через фильтр пользы относительно твоих планов и целей.
