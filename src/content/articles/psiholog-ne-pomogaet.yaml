content: '## Ожидания и реальность


  Не каждая встреча приносит заметное облегчение, и не каждое изменение бывает быстрым. При этом затянувшееся ощущение бесполезности
  — повод обсудить, что именно происходит, а не автоматически обвинять себя.


  ## Что можно прояснить


  Понимаете ли вы цель встреч? Есть ли возможность задавать вопросы? Чувствуете ли вы уважение к своим границам? Понятно ли,
  почему специалист предлагает конкретные темы и способы обсуждения? Эти вопросы помогают оценивать процесс.


  ## Говорить о трудностях — нормально


  Можно прямо сказать, что вы разочарованы или не понимаете, куда движется работа. Реакция специалиста на такую обратную связь
  — важная часть профессионального контакта. Иногда полезно изменить фокус, ритм или формат.


  ## Право искать другой подход


  Если взаимопонимание не складывается или работа выходит за рамки компетенции, допустимо выбрать другого специалиста. Просьба
  о направлении к врачу при наличии медицинских симптомов — проявление заботы о безопасности, а не неудача консультаций.

