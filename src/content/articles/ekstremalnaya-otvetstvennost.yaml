  Экстремальная ответственность (Предельная ответственность или абсолютная ответственность или
  полная ответственность)


  Поговорить об ответственности меня вдохновила книга Джоко Уиллинка и Лейфа Бабина (бывших
  спецназовцев ВМС США). Они перенесли концепцию «экстремальной ответственности» из военных операций
  в бизнес и в повседневную жизнь. Это одна из тех идей, без которых практическое саморазвитие
  невозможно: без её понимания мы можем так и не сдвинуться с места, ничего не менять, не
  «разблокироваться», не начать действовать, думать и чувствовать, что способны добиться чего-то
  важного для себя и других.


  ## Почему «экстремальная»?


  Полезно наблюдать за внутренним сопротивлением: так ты на собственной шкуре почувствуешь, как
  работает твое Эго и как оно блокирует наш потенциал, закрываясь от того, что неприятно слышать —
  даже если это может помочь.


  Почему экстремальная ответственность? Потому что речь о принятии ответственности не только за то,
  что мы реально спровоцировали, но за всё — даже за то, что, казалось бы, вне нашей власти и не
  имеет к нам отношения. За требования начальника, за то, что мы не можем найти работу, и за аварию,
  которую видим на улице. Ты, наверное, думаешь: «Что за чушь? Почему я должен отвечать за то, чего
  не делал и не контролировал?» Здесь и подаёт голос твоё эго. Почти всегда мы реагируем так: «Это
  не моя вина, я ни при чём, повлиять не могу» — и умываем руки. Но стоит присмотреться к тому, что
  с тобой происходит, когда ты так делаешь — когда ты не берёшь ответственность за то, что
  происходит вокруг и внутри тебя, — чтобы понять, как это сужает твою способность действовать и
  бьёт по эмоциям.


  ## Два пути


  Проще всего проверить это на конкретном примере. Допустим, ты полгода ищешь инвестора для своего
  бизнеса, но изначально убеждён: рынок сложный, инвесторов мало, их требования запредельны. Поиск
  тянется уже 7–8 месяцев, а ты только крепнешь в убеждении, что рынок «плохой» и все против тебя.
  На миг это приносит облегчение, но потом приходит бессилие: ты чувствуешь себя жертвой
  обстоятельств, ментально от них сбегаешь, лишаешь себя силы и желания действовать, становишься
  пассивным, внутри растёт неприязнь. Что это за чувство? Прибавляет ли оно сил — или забирает? Как
  ты видишь своё будущее и будущее проекта? Скорее всего, не слишком радужно. Так ты взращиваешь в
  себе ментальность жертвы и тонешь в беспомощности. Ровно так же может быть в любой другой сфере: в
  отношениях, с финансами, со здоровьем. Но на этом история не заканчивается — состояние можно
  изменить.


  Вообрази ту же ситуацию, но с другим подходом. Ты ищешь инвестора, разослал тьму писем — ноль
  эффекта, поиск тянется. Но ты готов взять ответственность за своё положение, не опускаешь руки.
  Вместо этого спрашиваешь: какие у меня есть варианты? Что ещё я могу сделать, чтобы найти
  инвестора? Может, поговорить лично с тем, кто нашёл деньги для похожего проекта, — и понять, что
  он делал иначе? Может, вместо «бумажной» презентации записать яркое видео, которое выделит меня
  среди других? Может, стоит пройти курс или дополнительное обучение, которое поможет? Так ты берёшь
  ответственность, перехватываешь инициативу, открываешь новые возможности. Это работает в любой
  сфере жизни.


  ## Что это даёт?


  Что происходит с тобой эмоционально, когда ты так поступаешь? Ты чувствуешь, что почти в любой
  ситуации можно что-то сделать — это касается и твоего настроя, и внешних обстоятельств. Появляется
  чувство влияния и контроля. Вместо части проблемы ты становишься частью решения. Растёт желание
  действовать, ты видишь, что не всё потеряно.


  И даже если результат окажется не тем, на что ты рассчитывал, — за него тоже можно взять
  ответственность: понять, что не сработало, а что получилось, и в следующий раз применить уроки,
  чтобы добиться лучшего исхода. В этом и сила экстремальной ответственности: не отдавать контроль.
  Уверена, найдутся те, кто скажут: «Бессмыслица, против логики и интуиции». На это есть разумная
  причина — о ней сейчас.


  ## Почему мы не хотим быть ответственными?!


  Если у тебя «внутри всё закипает» от одной мысли брать ответственность за то, на что будто бы не
  влияешь, — это твоё эго идёт в атаку. Эго всегда ставит нас в оборону: даже когда мы всё
  испортили, у нас есть тенденция искать виноватых где угодно, только не в себе. Что в этом плохого?
  То, что, когда «виноваты все вокруг, только не я», — у нас ноль возможностей учиться; мы отдаём
  всю силу, чтобы менять ситуацию, и по собственной воле становимся жертвами. А у жертвы как? Раз
  «не по моей вине» и «ничего не изменить», — значит, и пробовать незачем. Как с таким подходом
  исполнять мечты? Это и так нелегко, даже без того, чтобы подставлять самому себе подножки. Это
  требует взять ответственность за всю свою жизнь, принять управление в свои руки. Как человек,
  уверенный, что «виноваты все» и он ни на что не влияет, способен это сделать?


  Чтобы взять ответственность, иногда приходится проглотить гордость, решиться на шаг, принять
  просчитанный риск, «помучить» своё эго и привыкнуть к мысли: рост и движение к цели — это не
  только радость и удовлетворение, но порой тяжёлая схватка с собой. Как на поле боя, ждать, что
  «кто-то спасёт, заметит и оценит», — опасная стратегия: можно не дождаться. Ожиданием и
  пассивностью мечты не исполняются, мудрее и счастливее мы от этого не становимся. Проактивная
  позиция даёт прогресс — а любой прогресс, даже маленький, рождает веру, надежду и смелость.
  Поэтому, не сказав себе: «С сегодняшнего дня командую здесь я», мы остаёмся бессильны и начинаем
  думать, будто «нам не суждено жить лучше». Это можно изменить — в том числе благодаря
  экстремальной ответственности. С неё начинается любая перемена.


  ## Ответственность ≠ самобичевание


  Важно чётко отличать: быть ответственным за всё в своей жизни — не значит быть «во всём
  виноватым». Многое происходит вне нашего контроля. Речь не о том, что ты виноват в странной идее
  начальника, в плохой экономике или в случившейся аварии. Речь о том, что с каждой из этих вещей
  что-то можно сделать, если ты добровольно не откажешься от своего влияния.


  Конечно, есть и то, что ты действительно «запорол» — и это твоя вина. Но приняв за это
  ответственность, ты перестаёшь жить с постоянным уколом совести: это превращается в исправимое —
  через более грамотные действия в похожей ситуации в будущем. Так ты выигрываешь — независимо от
  того, по чьей вине что-то пошло не так. По сути, только приняв полную ответственность за всё, ты
  сможешь двигаться дальше и эффективно учиться — на своих успехах, на своих ошибках и на чужих.


  ## Жертва


  Есть и другие последствия — брать ответственность или нет. Это разница между тем, чтобы быть
  творцом своей жизни, и тем, чтобы быть жертвой. Пропасть между теми, кто обвиняет всех и вся, и
  теми, кто берёт ответственность, колоссальна — не только во внешнем восприятии, но и в
  самочувствии. Обвиняя обстоятельства и людей в своих несбывшихся мечтах, мы становимся их
  заложниками. Невозможно творить что-то большое, если мы боимся, что «что-то пойдёт не так и это
  будет моя вина», и страшимся оказаться без «козла отпущения» — поэтому «лучше не рисковать».


  Добавлю: если ты нацелился на большое, идёшь к тому, чего раньше никогда не достигал, — что-то
  обязательно пойдёт не так. И не один раз. Экстремальная ответственность поможет извлечь уроки и
  пытаться до результата. Беречь своё эго ценой своих мечтаний — слабая стратегия. Мы становимся
  маленькими и беспомощными, уходим в оборону, не видим своих ошибок, не учимся, отталкиваем людей и
  растим к ним неприязнь. Это ментальность жертвы.


  ## Творец


  А вот человек, готовый нести ответственность за свои промахи, промахи своих сотрудников и быть
  лидером — в жизни и в компании — даёт себе право создавать. Если ты берёшь ответственность за всё:
  за мечты, за работу, за людей вокруг — тебя окружит уважение. Ты перестанешь тыкать в виноватых
  пальцем и начнёшь сильнее уважать самого себя. Ты станешь лидером своей жизни и примером для
  других. Увидев это, люди рядом могут пойти за твоим примером: друзья и сотрудники перестанут
  перекладывать вину и начнут внимательнее смотреть на себя — станут лидерами собственной жизни.


  Лидер не только строит стратегию и достигает цели — он вдохновляет. Вдохновлять можно негативно и
  позитивно. Ответственный лидер — тот, кому можно доверять и кто сам себе доверяет: нет такой вещи,
  с которой он не справится. И даже если что-то пойдёт не так, у него хватит смелости вслух признать
  ошибку и изменить необходимое, чтобы она не повторилась; без поиска виноватых — он сам примет
  ответственность, предварительно разобрав: кто и какие ошибки допустил, и найдёт способ наладить
  лучшее общение в будущем. Такого человека «не победить»: он выжмет максимум пользы и знаний из
  любой неудачи и победы. На такую смелость способен только настоящий лидер. Та же логика — и в
  жизни вообще.


  ## Твой выбор


  Выбор пути — за тобой. Хочешь ли ты реально творить свою жизнь или предпочитаешь ждать, что «само
  всё как-нибудь изменится»? Второй способ безотказно работает, когда тебе нужны изменения к худшему
  — сомневаюсь, что это твоя цель. Это твоя жизнь — и ты за неё ответственен.


  ## С чего начать?


  Есть предложение: попробуй неделю. Не обвиняй других, сосредоточься на себе, бери ответственность
  за каждую ситуацию и действуй, исходя из убеждения, что всегда можно что-то сделать. Возьми
  ответственность за своих сотрудников или за членов своей семьи и их ошибки: разработай стратегию
  исправления, не обвиняй их — ошибки команды или семьи - это зона ответственности лидера, который
  должен объяснить не только что делать, но и зачем. Возьми ответственность за себя и свою жизнь.
  Эго будет сопротивляться, ты будешь хотеть отказаться от ответственности за разные вещи — но
  удержись. Посмотри, как ты себя почувствуешь: как вырастет чувство влияния, самоуважение, как
  поменяются отношения, подход к работе, к сотрудникам и начальнику, к партнеру в семье.


  Подумай, в каких сферах жизни ты всё ещё чувствуешь себя жертвой обстоятельств — и как применить
  там экстремальную ответственность. Какие новые возможности ты видишь? И какое это чувство —
  приструнить своё эго, чтобы добиться чего-то действительно важного?
