content: >-
  ## Значение мнений


  Когда ты слишком переживаешь из-за того, что о тебе думают другие, ты позволяешь чужим,
  ограниченным представлениям о том, что «возможно», «правильно» и «нормально», диктовать твои
  стандарты. То есть совершенно посторонний человек с твоего согласия контролирует твои возможности
  и твою «нормальность», которая может быть совсем не такой, как у него. Ты отдаёшь власть над своей
  жизнью чьему-то мнению — всего лишь мысли, мимолётной и неспособной по-настоящему тебе навредить.
  Удивительно, сколько власти мы добровольно отдаём другим. На свете — миллиарды людей, у каждого
  своя история, опыт и собственное понимание возможного и нормального.


  У каждого — тысячи мнений на тысячи тем. И если ты пытаешься жить в соответствии хотя бы с
  горсткой этих мнений, ты обречён отказаться от того, чего ты хочешь и что важно тебе, и позволить
  направлять своё поведение — что делать и чего не делать — исходя из чьей-то внешней оценки. Люди
  думают всякое; их мнения бывают «плохими» и «хорошими». Но если ты слишком на них завязан, твоя
  «безумная логика» такова: любой ценой избежать отрицательных мнений и любой ценой добыть
  положительные.


  Ускользает главное: это невозможно. Потому что вместе с похвалами неизбежно придёт и критика — как
  день сменяет ночь, как есть север и юг, тепло и холод. Это естественная полярность — и она
  неразделима. К тому же и «плохое», и «хорошее» мнение — лишь мысль в твоей голове о том, что якобы
  находится в головах других.


  ## Упущенные возможности


  Мы боимся негативной оценки и считаем её чем-то крайне нежелательным не только от близких (что
  порой ещё можно понять), но и от совершенно посторонних. Правда в том, что каждый в какой-то сфере
  переживает о чужих мнениях — особенно когда кажется, что от них зависит нечто важное, или когда мы
  выносим себя и своё творчество на публику, где обязательно найдётся тот, кто раскритикует и
  назовёт это ничтожным. Это может быть твой ролик на YouTube или TikTok, рисунок, рассказ,
  бизнес-идея, стратегия проекта — или даже твой жизненный план, озвученный семье. Всё это
  столкнётся с мнениями — и они будут очень разными.


  Чтобы «показать мягкое подбрюшье», нужна смелость. Если дать чужим оценкам сбить себя с курса,
  может случиться, что ты вообще ничего не сделаешь. Не выложишь ролик, который мог бы кому-то
  помочь; не внесёшь в разговор непопулярную, дерзкую мысль; не покажешь рисунок, который мог стать
  стартом художественной карьеры; не отправишь рассказы в издательство; не запустишь дело,
  основанное на том, что важно тебе; не начнёшь жить по своему плану, а будешь жить слепком ожиданий
  других. Звучит уныло — но именно так выглядит переоценка чужих мнений и убеждённость, что кто-то
  лучше тебя знает, что тебе «следует» и «не следует» делать. Это по сути разница между жизнью и
  прозябанием.


  ## Почему чужие мнения так важны именно для тебя?


  Легко распознать человека, слишком зависимого от оценок. У него нет контакта с собственными
  целями, желаниями, ценностями, которые подпитывали бы его движения. Он ждёт, пока кто-то скажет,
  что ему делать; постоянно подстраивается; ставит чужие взгляды выше своих даже в вопросах
  собственной жизни; стремится всем угодить. Обычно так происходит, потому что ему кажется: избегая
  плохих оценок и добиваясь хороших, он что-то получит.


  Положительные отзывы дают подкрепление его образу «хорошего человека». Ему нужно внешнее
  подтверждение, ведь он хочет видеть себя таким, но слишком зависим, чтобы опираться на собственные
  стандарты. Проблема в том, что это погоня за невозможным: самооценка, построенная на внешних
  оценках, неустойчива — хорошие отзывы будут не всегда, как бы он ни старался и чем бы ни
  жертвовал.


  К тому же такие люди уверены, что «так и надо» — гнаться за одобрением, хотя эта стратегия годами
  не приносит ни принятия, ни счастья. Иногда им перепадает похвала или минута внимания — и они
  считают это поводом продолжать. Но объективно заполнить внутреннюю пустоту не получится ни
  деньгами, ни «принятием», ни любовью, ни чужими «пятёрками». Мы охотимся за всем этим, думая, что
  это внутри нас восполнит. Но ничто внешнее не заполнит внутреннюю дыру. Нужна другая стратегия.


  ## Цена чрезмерной зависимости от чужих мнений


  Цена — твоя собственная жизнь.


  Невозможно создать в своей жизни что-то подлинно ценное для тебя, если предполагаемые мысли других
  важнее, чем то, что ты хочешь сделать. Кроме того, ты становишься рабом мнений: делаешь — если это
  сулит похвалу, не делаешь — если грозит осуждением. Ты избегаешь ситуаций, где кто-то может
  подумать о тебе плохо. А это неизбежно случится, как только ты захочешь сделать что-то иначе, за
  рамками чьей-то «нормальности». Ты начнёшь угадывать, что сделать ради «плюсика», подгонять себя
  под ветер, потеряешь внутренний стержень — и то, что ты делаешь или не делаешь, будет зависеть от
  очередной розы ветров общественного мнения.


  Дальше — растерянность: ты живёшь сугубо чужими ожиданиями. На твой счёт существуют десятки мнений
  — каким тебе быть и что тебе делать. Мнение есть у всех, кроме тебя. А именно ты и должен иметь
  своё.


  Ты привязываешь самочувствие к чужим оценкам: хорошая — мне ок; плохая — мне ужасно, срочно надо
  «исправляться», понравиться. Карусель бесконечна.


  Ты теряешь свою личность: никогда не будешь собой — это чревато «плохой оценкой», а «плохая
  оценка» грозит недополучить то, чего ты вроде как хочешь. В итоге ты всё равно этого не получишь.


  И «хорошие» мнения опасны не меньше «плохих». Получая много похвал, ты можешь потерять свое
  видение: застрять в том, что нравится другим, а не тебе; захлебнуться в комплиментах и перестать
  делать то, что отзывается в тебе, а начнёшь делать то, за что тебя хвалят.


  Вывод простой: решаешь ты, а чужие мнения значения не имеют — будь то канал на YouTube, твои
  картины или рассказы. Сохраняй свой стиль: кому-то зайдёт, кому-то нет — и это нормально.


  Ни «хорошие», ни «плохие» отзывы не стоят многого, лучшее решение — независимость от любых мнений.
  Это освобождает от необходимости притворяться ради похвал и жертвовать собой, спасаясь от критики.
  Так начинается движение к тому, чего хочешь ты. Иначе ты навсегда останешься пленником мнений — то
  в аду, то в раю, в зависимости от чужого настроения, — но никогда там, где хотел бы быть ты.


  Пример. Допустим, ты художник и готовишь выставку — представляешь публике работы, над которыми
  трудился месяцы. Это для тебя важно и близко — и ты рискуешь оказаться под залпом и похвал, и
  упрёков. Если ты зависим от мнений, в голове вспыхивают мысли: «Меня высмеют, скажут, что я
  никакой художник; это трэш, китч, фаст-фуд, барахло». В чём здесь незаметная ловушка? В том, что
  эти мысли — не мысли людей. Это твои мысли.


  Получается, что ты сам создаёшь эти образы и строишь себе клетку из собственных страхов и
  комплексов — и боишься, что кто-то их обнажит, «подтвердив» ровно то, что ты сам о себе думаешь, и
  разрушит хрупкую конструкцию эго, вокруг которой ты ходишь на цыпочках. Ты буквально вкладываешь в
  головы людей свои страхи — чтобы защитить «мягкое подбрюшье» и эго. И, чтобы добить себя, ты
  веришь, что люди действительно так подумают — хотя не имеешь об этом ни малейшего представления.
  Ты игнорируешь «слона в комнате» — свой собственный вклад в создание уютной, безопасной, но
  ограничивающей ментальной клетки.


  Чужие мнения — хорошие или плохие — ничего не добавляют и ничего не отнимают у того, что ты
  создаёшь. Они мимолётны и несущественны: то так, то сяк. Это ты придаёшь им космический вес.
  Избежать мнений невозможно: кто-то всегда оценит, кто-то скажет и плохое, и хорошее. Неважно, что
  ты делаешь и с какими намерениями — всегда найдутся те, кто спроецирует на тебя свои комплексы,
  будет говорить, как «надо», а как «не надо». Люди не сидят у тебя в голове, они не знают твоего
  жизненного плана и кем ты хочешь быть. И если ты сам этого не знаешь, любое мнение будет колебать
  тебя: «а вдруг я не прав?»


  Тогда ты легко откажешься от своих намерений — будь то YouTube-канал, блог, показ картин, идей,
  любой творческий жест, отклик где-то, старт бизнеса. Нельзя допускать, чтобы чужие представления
  управляли твоим поведением. Это плохой способ жить. Иначе ты не будешь создавать то, что хочешь;
  будешь делать ненужное в надежде купить принятие, похлопывание по плечу или избежать критики.
  Бедная стратегия: она не даёт того, чего ты ищешь — счастья, покоя, наполненности — а только крохи
  кратковременного облегчения.


  ## Как практически перестать зависеть от того, что думают другие


  Во-первых, именно ты должен знать, что для тебя хорошо. Хочешь каждый день носить синюю рубашку —
  носи. Нравится это кому-то или нет — неважно. У тебя есть причины — держись их. Есть ценности и
  цель — опирайся на них. Что будет, если поддаться мнениям и сменить синюю на красную? Тут же
  найдётся кто-то, кто скажет, что красная — отвратительна, лучше коричневую. Другой заметит, что
  коричневая «как…», значит бери жёлтую. Конца не будет. Люди с готовностью предложат тебе
  альтернативные сценарии «под себя»: как тебе жить, выглядеть, что носить. Возможно, им это подошло
  бы — но не обязательно тебе. Это нормально: у каждого — своё мнение. Но у тебя тоже есть своё — и
  в вопросах твоей жизни оно должно быть главным. «Свои» люди останутся; остальные всё равно сделают
  по-своему.


  Это не значит, что нужно игнорировать все отзывы. Иногда они полезны и доброжелательны — ими можно
  воспользоваться. Но решать, что с ними делать, должен ты — не под давлением, не из-за внешней
  угрозы. Только ты видишь целиком свой план и понимаешь, как это в него ложится.


  Во-вторых. Вспомним пример с художником. Вместо того чтобы безоговорочно верить критическим
  мыслям, которые ты раздаёшь всем потенциальным зрителям твоих работ, — поторгуйся с ними. Что это
  значит? До того, как выставить работы, выпиши все мысли, которые, как ты боишься, появятся у
  зрителей: самые «сочные» сценарии, худшие реплики, оскорбления — всё на бумагу. А потом представь,
  что этот лист — человек на твоей выставке, который вслух при всех произносит всё написанное. И
  поговори с ним. Да, может, звучит странно, но это отлично обезболивает: ты сталкиваешься с худшими
  мыслями, и они становятся абсурдными и безвредными. Например, человек говорит: «Это худшая
  выставка в моей жизни, такую мешанину хлама я видел только в мусорке». Что ты можешь ответить?
  Согласиться. Пошутить. Возразить: «Отлично, цель достигнута: моей вдохновляющими темами были
  беспорядок и хаос». Или: «Может, это не мои лучшие работы, но они подходят к теме, важной для
  меня… и, похоже, для вас, раз вы здесь». Или: «Что вы! Бабушка с мамой считают, что я
  замечательный художник». Поиграй. Большинство людей не подойдёт и не скажет подобное в лицо — но
  упражнение сделает эти мысли привычными, даже смешными. Если проделывать это с каждой пугающей
  мыслью, постепенно ты перестанешь верить им автоматически. Бонус: ты лучше узнаешь себя — ведь
  выписываешь всё, чего боишься и от чего отгораживаешься (а вместе с этим — от множества
  возможностей). На листе — твои слабые места. Значит, понятно, над чем работать.


  Используй это упражнение перед презентацией, свиданием, собеседованием — перед любым событием, где
  оценка может повлиять на твоё поведение. Или после - если что-то пошло не так. И помни: хотя тебе
  кажется, что принятие других и деньги, которые они теоретически принесут за «хорошие отзывы»,
  стоят многого, — рядом со счастьем, наполненностью и покоем, которые даёт движение в поле
  собственных ценностей, планов и целей, это ничто. Да, мы все хотим хороших мнений — и видим в них
  путь к этим вещам. Но настоящий путь — независимость от мнений.
