author: Лилия Янушкевич
content: >-
  Чтобы по-настоящему расти и меняться, нужно признать очевидное: в «комнате нашего личного роста»
  часто сидит слон. Этот слон — наша травма. Она мешает нам двигаться вперёд, и пока мы делаем вид,
  что её нет, путь к развитию остаётся закрытым. Когда я говорю о настоящем развитии, я имею в виду
  путь, на котором мы не уходим от проблем, а прямо встречаемся с ними и учимся жить в реальности, а
  не в придуманных картинках. Такой путь не обещает чудес. Это значит, что нужно честно признать:
  если ты используешь личностный рост, чтобы «залатать» травму, спрятать её за деньгами и успехами
  или убежать от своей боли — ты не решаешь проблему и даже не приближаешься к этому. Конечно, проще
  сосредоточиться на целях, планах, деньгах и будущем. Но травма, оставшаяся в прошлом, всё равно
  найдёт тебя. Она похожа на тень — куда бы ты ни пошёл, она рядом. И ты не избавишься от неё, если
  просто будешь пытаться бежать быстрее. Настало время перестать использовать личностный рост как
  средство побега, ведь это не помогает. Я не говорю, что рост, который подпитывается травмой, и
  успехи, достигнутые таким образом, не имеют смысла. Есть люди, которые смогли добиться многого,
  несмотря на свои травмы. Но если развитие строится только на внешних победах, а в основе лежит
  травма, это напоминает дорогую одежду, которую надевают на разрушающееся тело. Сколько бы
  украшений ни добавить, они не изменят того, что происходит внутри. Примерно так связаны достижения
  и травмы.


  Трудно "перепрыгнуть" через то, что буквально вшито в твое тело и нервную систему, заменив это
  новым автомобилем, более привлекательным партнером, дорогим костюмом или миллионом на счету.
  Травма требует другого подхода, и, скорее всего, он тебе не понравится. Но факт в том, что это
  нельзя просто обойти, перепрыгнуть или забыть — нужно через это пройти. И это, пожалуй, самое
  важное в сегодняшней теме — нужно идти навстречу боли и прожить её. Другого пути нет.


  Я предлагаю оглянуться назад и конкретно сделать то, что необходимо. Потому что это само по себе
  не пройдёт и не оставит тебя в покое. Решай — либо ты срываешь пластырь сразу и резко, либо это
  будет тянуться бесконечно. В таких условиях очень трудно построить по-настоящему хорошую жизнь —
  хорошую не только снаружи, но и внутри. Возможно, сейчас ты не до конца понимаешь, почему —
  несмотря на большие достижения и успех — тебе всё равно не спокойно в мире и в собственном теле;
  почему ты не чувствуешь удовлетворения и радости; почему так сложно быть живым, спонтанным,
  свободным и в гармонии с собой и с миром. То, что скрывает от тебя эти чувства и блокирует твой
  рост - часто является травмой.


  ## Что такое травма?


  О травме можно говорить долго, но сегодня я постараюсь упростить этот вопрос.


  Слово "травма" пришло из греческого языка и означает "рана". В нашем случае это психологическая
  рана, которая возникает из-за сильного стресса и меняет психику и поведение человека. Важно
  понимать, что травма — это не просто само событие. Событие само по себе не всегда вызывает травму.
  Габор Матэ говорит, что травма — это то, что происходит внутри нас в ответ на какое-то событие.
  Это выводы, которые делает твоя нервная система и эмоциональная память о тебе, мире и других
  людях, и через которые ты потом воспринимаешь реальность.


  ## Как возникает эта рана?


  Представь ситуацию, которая тебя напугала и ошеломила. Например, авария, смерть человека или
  насилие. Твое тело реагирует, готовясь к действию и защите, мобилизуя все ресурсы. Но ситуация
  оказывается безвыходной — ты ничего не можешь сделать. И тогда, несмотря на всю мобилизацию, ты
  буквально замираешь. Питер Левин объясняет это так, как будто в теле одновременно нажаты педали
  газа и тормоза до упора. Под таким напряжением твоя система ломается, и ты отключаешься. Это
  называется диссоциацией. После этого появляется чувство беспомощности, ведь «двигатель» выключен,
  и ты больше не можешь двигаться. В результате этого процесса в твоем теле остается много энергии,
  которая потом будет искать выход, если ты не займешься этим сознательно.


  Травма оставляет незавершенный процесс. Мы начинаем с реакции на событие, но нет завершения — не
  происходит разрядки энергии, накопившейся в результате мобилизации. В нормальной ситуации: событие
  случилось, тело среагировало, ты мобилизовался, действовал и освободился от напряжения. Цикл
  замкнут, ничего не блокируется, и ты расслабляешься. Твоя защитная система сработала.


  Но при травме все иначе. Твоя защитная система сломалась под давлением ситуации, а тело помечает
  это событие как опасное и запоминает его как слабое место. Сигналы тревоги не могут выключиться,
  потому что для твоей системы угроза все еще жива, даже если событие давно прошло. Твое тело должно
  охранять эту уязвимость и резко реагировать на любые признаки опасности. Для этого ему нужно быть
  в постоянной готовности, что вызывает стресс и страх. Это сказывается на здоровье и повседневной
  жизни.


  Если твое тело распознает ситуацию, хоть немного похожую на ту, где произошел сбой, оно среагирует
  так же быстро и сильно, как тогда. Одной искры достаточно, чтобы снова запустить весь цикл.
  Реакция происходит автоматически, и у тебя может возникнуть ощущение, что ты не контролируешь
  себя. Жизнь начинает вращаться вокруг этой раны, и она управляет тобой. И пока это не будет
  решено, ты не найдешь покоя.


  Важно понимать, что не имеет значения, сколько тебе лет сейчас — 40 или 4, когда произошла травма.
  Если система не обновится и не убедится, что опасности больше нет, она будет продолжать
  реагировать так же.


  Питер Левин называет это "тирания прошлого". Эта тирания влияет на твою жизнь в настоящем.


  После таких событий жизнь уже не будет прежней. Ты начинаешь жить в другом мире, потому что
  фильтруешь его через измененную травмой нервную систему. Травма разрывает целостность жизни и
  отделяет тебя от самого себя. Она меняет твое восприятие себя, мира и других людей. Ты живешь в
  режиме выживания и теряешь уверенность, что сможешь справиться с будущими угрозами. Тебе кажется,
  что мир — небезопасное место. Это не способствует чувству безопасности, сосредоточенности на
  настоящем и планам на будущее. Очень тяжело одновременно контролировать внутренний хаос, жить в
  моменте и строить будущее. Это требует огромного количества энергии, чтобы просто пройти через
  день.


  Теперь понятно, почему даже миллионы на счету, красивый дом, золото и дорогие машины не изменят
  ситуацию. Как бы ни говорил так называемый "человек успеха" в Интернете, все это не решит
  проблемы.


  О травме часто думают так, как я только что описала. Как о результате какого-то страшного,
  необычного события, которое угрожает жизни и затем преследует человека. Это правда, но не вся
  правда.


  Определение травмы гораздо шире. Некоторые люди никогда не переживали таких сильных и шокирующих
  событий, но всё равно испытывают похожие последствия, как те, кто через это прошёл. Они живут с
  чувством тревоги, страха, некоторые ситуации вызывают у них сильные эмоции и быстро приводят к
  ощущению беспомощности. Им кажется, что мир небезопасен, они оторваны от себя и других и не могут
  справиться с опасностью.


  ## Почему так происходит?


  Дело в том, что для возникновения травмы важны не только масштаб события, но и его длительность и
  повторяемость. Именно поэтому травма может возникнуть не от одного шокирующего случая, а от
  чего-то более тонкого и повседневного, что накапливается со временем. Это могут быть эмоциональные
  раны — плохое обращение или игнорирование. Например, запугивание со стороны братьев и сестер,
  бедность, дискриминация, строгие замечания родителей, пристыживание, отсутствие любви, тепла,
  контакта, внимания. И это может происходить даже в любящих семьях. Родители могут даже не
  осознавать, что что-то делают не так. В таких случаях травма формируется постепенно, как капля,
  разрушающая камень. Это как смерть от тысячи мелких порезов. Постепенно разрушается целостность
  личности и её связь с окружающим миром. Человек утрачивает внутреннее единство, часть за частью.
  Ему приходится подавлять свои чувства ради сохранения связи с родителями. Это со временем лишает
  человека контакта с самим собой, подрывает доверие к себе и меняет восприятие мира как опасного
  места.


  Особенно опасно в такой травме, так это то, что она разрушает человека постепенно и незаметно. Она
  как будто крадет что-то у тебя, но не всегда понятно, что именно произошло и почему. В отличие от
  больших трагических событий, человек может даже не осознавать, что это было чем-то плохим. Такие
  люди часто говорят, что у них было замечательное детство, любящая семья, всё было хорошо, а вот с
  ними самими что-то не так, раз они сегодня так плохо реагируют на определённые ситуации. Но если
  копнуть глубже, выясняется, что отец пил, матери никогда не было дома, а они с детства заботились
  о братьях и сёстрах и поддерживали порядок в доме. Но при этом они думают, что всё было прекрасно.


  Вот так действует травма — она не даёт человеку увидеть и назвать вещи своими именами. Он
  адаптируется к среде, которая кажется нормальной, хотя на самом деле она полностью
  дисфункциональна.


  ## И ещё один важный момент.


  Возникнет ли травма, не всегда зависит от самого события. Известно, что травма наиболее
  разрушительна, когда затрагивает маленького ребёнка, повторяется годами, и причиняет её тот, кто
  должен любить и защищать. Это, пожалуй, худший сценарий, который можно себе представить.


  Но кроме того, травма может зависеть от многих факторов: качества отношений в жизни человека, его
  исходной психической устойчивости, чувствительности, темперамента, способности регулировать эмоции
  и предыдущих переживаний, которые повлияли на его нервную систему. То есть одно и то же событие
  может стать травмой для меня, но не обязательно для тебя.


  ## Как это всё связано с личностным ростом?


  Если посмотреть на разные аспекты личностного развития, такие как самооценка, продуктивность,
  уверенность в себе, ощущение контроля над своей жизнью, убеждения о себе, других и мире,
  эмоциональная независимость, стили привязанности, присутствие в настоящем, привлекательность,
  способность адекватно реагировать на жизненные ситуации, прокрастинация, перфекционизм, синдром
  самозванца, стремление угодить другим, чрезмерная доброта, ассертивность, чувство безопасности в
  мире, сложности в определении жизненной цели, отсутствие смысла, зависимости, чувство застревания
  в прошлом, пренебрежение собой, токсичное поведение и люди, чувство одиночества и изоляции,
  трудности с самоопределением, сложности в согласовании мыслей и чувств, проблемы с принятием
  решений, удовлетворённость жизнью, выгорание, нахождение в токсичных отношениях, установление
  границ, достижение важных для себя целей, жизнь по своим правилам, доверие к себе и другим,
  стрессоустойчивость и многое другое — всё это может иметь корни в травме.


  И чтобы двигаться вперёд, иногда нужно вернуться к прошлому. И это не является регрессом в
  развитии.


  Создание хорошей жизни — это ответ на трудное прошлое, и я с этим согласна. Но это не всегда
  решает все проблемы. Иногда необходимо убрать препятствие, которое мешает двигаться по дороге к
  успеху — возможно, оно появилось много лет назад. Тогда будет проще двигаться вперёд, не выбирая
  каждый раз более долгий путь, чтобы обойти проблему. Оба эти аспекта важны, и их сочетание даёт
  наилучшие результаты. Это позволяет углубить развитие на многих уровнях с минимальными
  трудностями, используя знания и инструменты, которые у тебя уже есть. Тогда ты увидишь, насколько
  всё это может быть полезным и простым. Если есть что-то в прошлом, что мешает тебе идти вперёд, не
  стоит откладывать работу над этим. Когда ты освободишься от этого, процесс развития станет
  естественным.


  Тогда тебе больше не придётся никому доказывать свою ценность или подтверждать своё право на
  существование через большие цели и достижения. Ты не будешь ограничен остатками прошлого. Это
  многое меняет, а иногда — меняет всё.


  Кроме того, я бы не хотела, чтобы и ты, и я воспринимали адаптации, возникшие в ответ на травму,
  как слабости, с которыми нужно бороться. Это неправильный путь. Жёсткая дисциплина, наказание
  себя, попытки заставить себя прогрессировать, когда тебя тяготит травма, только увеличивают
  страдание и подталкивают к ещё более экстремальным способам избежать боли, а не к её решению. Это,
  как мы знаем, приносит ещё больше неприятных последствий.


  Самое печальное, что личностный рост может усилить это ощущение. Он может навязывать мысль, что
  если что-то не получается, то это потому, что ты недостаточно стараешься, что с тобой что-то не
  так, ты не делаешь того, что нужно, ты недостаточно хорош.


  Человек, переживший травму и который всё ещё живёт с её последствиями, часто слишком суров к себе,
  как бы «стреляет себе в ногу». Он страдает от боли травмы, а затем ещё и винит себя за то, что не
  справляется. Не понимая, что дело не в его вине, а в разумных адаптациях, которые, возможно,
  когда-то спасли ему жизнь.


  Травму нельзя преодолеть силой воли или наказанием себя. Для этого требуется совсем другое —
  любопытство и сочувствие. Невозможно восстановить связь между разумом, сердцем и телом силой воли
  или спешкой. Нужно делать это аккуратно и с заботой.


  ## Как распознать травму и что с этим делать дальше?


  Травму можно распознать по тому, что в разных жизненных ситуациях к тебе возвращаются негативные
  воспоминания, вызывая сильную тревогу в настоящем. Это могут быть эмоции, образы, мысли, звуки или
  запахи, которые неожиданно возникают и словно живут своей жизнью. Если ты это испытываешь, значит,
  твоя нервная система продолжает воспринимать прошлое как нечто актуальное.


  Травму можно также распознать по провалам в памяти. Ты можешь плохо помнить своё прошлое, потому
  что травма сильно влияет на память. Эти могут быть воспоминания не связанные между собой или у них
  нет контекста. Это не цельная история, а разорванные эпизоды. И пока ты не начнёшь работать над
  этим, ты будешь вновь и вновь переживать эти отрывки, как будто они всё ещё происходят. Для тебя
  это не станет последовательной историей с началом и концом.


  Ещё один признак травмы — это несоразмерные реакции твоего тела на определённые ситуации.
  Например, твой партнёр хочет прогуляться в парке один, а тебе кажется, что это значит, что он тебя
  не любит и бросает. Это не связано с реальной ситуацией, но твоё тело реагирует тревогой, потому
  что когда-то ты уже пережил что-то подобное.


  Или, допустим, кто-то сегодня повысил на тебя голос, и ты замер. Твоя реакция точно такая же, как
  тогда, когда на тебя кричал отец, и тебе было пять лет. Как взрослый человек, ты не можешь сказать
  ни слова, а позже, уже в душе, приходят на ум отличные ответы, и ты винишь себя за то, что не смог
  достойно отреагировать.


  Если это про тебя, то стоит осознать, что ты как будто наказываешь этого пятилетнего ребёнка
  внутри себя — и я хочу, чтобы ты дал себе время осознать это полностью.


  (Как вариант, чтобы понять, насколько твоё детство было травматичным, можно пройти простой тест,
  например: https://psytests.org/typo/burbo5t.html . Хотя подобные тесты не особо научны).


  ## Что же делать, если ты обнаружишь у себя признаки травмы?


  Первым импульсом может быть желание исправить то, что, как тебе кажется, работает неправильно. Ты
  думаешь, что твоё тело реагирует неправильно. Но я хочу сказать тебе, что это не так. Твоё тело
  реагирует абсолютно нормально — это реакция друга, а не врага. Твоё тело не подводит тебя, оно бы
  подвело, если бы не реагировало вообще. Его задача — защищать тебя любой ценой, и оно делает это
  как может. Да, эти реакции могут разрушать твою жизнь сегодня, но это не повод винить себя за то,
  как эти механизмы работают. Они именно так и должны работать. Однако, если ты хочешь изменений,
  нужно что-то с этим делать, иначе этот цикл будет повторяться снова и снова.


  Но это не так уж плохо, как может показаться, потому что каждый раз, когда запускается эта
  реакция, у тебя появляется возможность взглянуть на то, что обычно остаётся скрытым, и решить, что
  с этим делать. Если травма — это разрыв связи с собой, то это значит, что ты всё ещё там, внутри.
  Ты можешь восстановить эту связь, если только откроешься для этой возможности. Достаточно убедить
  своё тело в том, что та ситуация из прошлого уже завершилась, что можно отключить сигнал тревоги,
  потому что теперь ты управляешь ситуацией. Это возможно, даже если твоё тело много лет живёт в
  режиме выживания. По сути, у меня только хорошие новости, за исключением того, что процесс может
  быть очень болезненным. Но если ты пройдёшь через это, все те части, которые когда-то были
  оторваны, начнут снова работать вместе и участвовать в процессе исцеления. Всё, что нужно — это
  создать для них безопасные условия.


  Цель исцеления — завершение цикла реакции, восстановление чувства безопасности в теле, чувства
  контроля и внутренней интеграции того, что было разрушено.


  ## Как это сделать?


  Если произошло недавнее событие, которое было настолько подавляющим, что вызвало травму, важно как
  можно скорее обратиться к другому человеку. Хорошие отношения и поддержка восстанавливают чувство
  безопасности. Также важно как можно скорее вернуть себе чувство контроля над жизнью, например,
  войти в обычную ежедневную рутину или поставить перед собой цель, к которой можно стремиться, и
  вернуться к нормальной жизни.


  Если травма накапливалась постепенно или не была проработана сразу, можно начать с того, что,
  когда ты замечаешь появление фрагмента из прошлого или резкую эмоциональную реакцию, не спрашивай
  себя, что с тобой не так. Вместо этого подумай: что произошло в твоей жизни, что ты так реагируешь
  в подобных ситуациях? От чего твоё тело пытается защитить тебя прямо сейчас? Важно подойти к этому
  с любопытством и сочувствием.


  Когда ты будешь искать ответы на эти вопросы, наверняка почувствуешь множество эмоций и телесных
  ощущений. И тут главное — вместо того чтобы автоматически от них отстраняться, постарайся остаться
  с этими чувствами. Если чувствуешь напряжение в животе — останься с этим ощущением, если тяжесть в
  груди — будь с ней, если ком в горле — не отвлекайся от этого. Пусть эти ощущения будут, не
  пытайся убежать от них. Но здесь важно не позволять себе полностью утонуть в этих чувствах. Нужно
  оставаться в контакте с настоящим моментом, чтобы не погружаться в прошлое. Чтобы это сделать,
  можно взять в руки какой-то предмет, который будет удерживать тебя в настоящем и напоминать, что
  ты здесь и сейчас, что тебе уже не 4 года. Держи этот предмет и дай себе почувствовать всё, что
  происходит в теле, пока реакция не ослабнет. Если нужно что-то сделать физически, сделай это. Это
  помогает завершить цикл, ведь выходят те чувства и действия, которые когда-то были заблокированы.
  Возможно, захочется сделать то, что раньше было невозможно, например, оттолкнуть что-то или
  ударить подушку — это поможет вернуть ощущение контроля над ситуацией. Часто после таких действий
  энергия в теле перемещается, например, из груди в живот, и появляется чувство покоя.


  Всё это возможно, хотя это не просто, и иногда стоит воспользоваться помощью. Ведь чтобы
  интегрировать фрагменты прошлого в свою жизнь, нужно делать это на всех уровнях: тела, психики и
  духа.


  Психиатр Бессел Ван дер Колк перечисляет несколько методов, которые могут помочь в этом.


  Одним из них является психотерапия, которая поможет тебе столкнуться с реальностью и называть вещи
  своими именами без смягчений, что крайне важно для процесса исцеления. Важно прямо называть
  травмирующие события — насилие, пренебрежение. Это важно, потому что люди с травмами часто склонны
  не замечать своей боли, преуменьшать её значение и смягчать суровую реальность. Присутствие
  психолога помогает это осознать и признать, что с тобой действительно случились тяжёлые вещи.
  Терапия также помогает пройти процесс горя — признание того, что случилось, хотя, возможно, не
  должно было произойти, или того, что не произошло, хотя должно было. Проще пройти это, когда рядом
  есть человек, который будет твоим свидетелем. Психолог также помогает оставаться в настоящем, если
  сам присутствует в моменте. Многие ошибочно полагают, что исцеление от травмы заключается в том,
  чтобы постоянно рассказывать о своём прошлом, но это не так. Такое повторение может травмировать
  снова. Важно не это, а то, чтобы иметь рядом того, кто может быть свидетелем твоего опыта, кто
  будет уважать все твои чувства и помогать пережить их в безопасной атмосфере.


  Это всё открывает возможность глубоко понять, что то, что произошло, уже в прошлом, и твоё тело
  может успокоиться. Поломка в системе безопасности больше не игнорируется, и больше нет
  необходимости ходить вокруг неё на цыпочках. Она становится залеченной, пусть и не идеально.
  Конечно, твоё тело может продолжать реагировать, но появляется больше гибкости и свободы в
  реакции. У тебя будет выбор — как реагировать. Что еще может помочь?


  Йога также помогает, так как она открывает путь к осознанию того, что происходит в теле. Вообще,
  любые физические действия, которые способствуют чувству тела, полезны, так как они восстанавливают
  утраченную связь с ним. Ещё один эффективный способ — театр, так как игра разных ролей помогает
  выйти из жёсткости и позволяет испытать разные эмоции. Есть также методы нейробиоуправления и
  психоделики, которые помогают приблизиться к тем частям себя, которых ты обычно избегал из-за их
  опасности. Регулярные прогулки на природе и занятия в спортзале


  На самом деле, список методов на этом не заканчивается, и каждый может найти что-то подходящее.


  **В свою очередь, я приглашаю вас ко мне на терапевтические сессии.


  Все эти методы не предназначены для того, чтобы исправить тебя, потому что с тобой и так всё в
  порядке. Они создают безопасные условия для запуска естественных процессов исцеления, которыми
  каждый может воспользоваться. Также, как и тело, психика имеет свои методы заживления ран, нужно
  только немного помочь ей в этом, а не игнорировать проблему и не заметать её под ковёр. Если можно
  сделать свою жизнь легче и лучше, почему бы этого не сделать? Нет причин, чтобы "биология стала
  твоей биографией", как кто-то однажды выразился. Так быть не должно.
