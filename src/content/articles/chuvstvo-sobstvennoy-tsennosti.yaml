content: >-
  ## Наивная самооценка


  В последнее время я замечаю довольно наивный подход к теме самооценки — он сводится скорее к
  внушению себе «я ценен», чем к реальному пониманию, что это значит, откуда берётся ощущение «я не
  такой» и как это можно поменять. Отчасти это следствие популяризации «простых решений» и культа
  хорошего самочувствия, которое будто должно решать любые проблемы — даже те, что требуют глубины и
  размышления. В этой теме поверхностность только вредит: она слишком важна и слишком многое от неё
  зависит, чтобы не вглядеться повнимательнее.


  ## Самооценка и образ «я»


  Чувство собственной ценности связано с нашим образом себя, который шире одной лишь самооценки.
  Образ себя — это то, что мы считаем правдой о себе. Если я считаю, что я некрасива, — это моя
  «правда» обо мне. Если, напротив, считаю себя привлекательной — это тоже моя «правда». И если я в
  это верю, это становится фактом для меня почти как 2+2=4. Именно поэтому попытки строить
  самооценку с помощью фраз перед зеркалом — «ты замечательный, красивый, умный» — когда внутри ты
  чувствуешь иначе, могут на минуту поднять настроение, но этого мало, чтобы создать высокую
  самооценку.


  Это не значит, что метод бессмысленный. Для тех, кто вообще не способен произнести себе такие
  слова в зеркале, это может стать первым толчком — импульсом начать реальную работу над самооценкой
  на прочной основе. Стоит попробовать ради эксперимента и посмотреть, «пройдёт ли через горло». Но
  рассчитывать, что это изменит то, что ты в самом деле думаешь о себе, — на длинной дистанции
  обречено. Самооценка не может быть оторвана от реальных фактов, которые её подтверждают. Поэтому
  внушение себе того, во что ты не веришь и чего не видишь, не сработает. Поможет понимание, как
  работает самооценка, из чего она складывается — и ДЕЙСТВИЕ, которое будет её укреплять и
  поддерживать.


  ## Что влияет на самооценку


  На самооценку влияет масса вещей, в том числе те, на которые мы почти не могли повлиять: детские
  переживания, характер отношений с родителями и их отношение к нам. Но сегодня я это опущу. Я хочу
  сосредоточиться на сферах, на которые мы можем влиять уже сейчас, будучи взрослыми: как
  использовать знание о них, чтобы строить свою самооценку — и понимать, когда мы её разрушаем, а
  когда усиливаем.


  Всё, о чём я буду говорить, опирается на мой личный опыт и на книгу Натаниэля Бранденa «6 столпов
  самооценки». Рекомендую всем, кто хочет глубже погрузиться в тему.


  ## Что такое высокая самооценка


  Высокая самооценка складывается из двух вещей:


  1. Вера в собственную эффективность — уверенность, что мы справимся с требованиями, которые


  ежедневно предъявляет к нам жизнь. Ощущение, что мы умеем думать и можем встречать то, что
  приносит жизнь: поиск и удержание работы, отношения, трудности. Иными словами — доверие к себе и
  своему уму.


  2. Самоуважение — убеждение, что мы имеем право на счастье и успех, что мы ценны, что заслуживаем


  желаемого. Это также способность добиваться важного и уметь радоваться плодам собственных усилий.


  ## Внутренний опыт


  Самооценка — это внутренний опыт, то, что мы чувствуем и думаем о себе, и это не имеет ничего
  общего с другими людьми. Только у нас есть сила и возможность работать над этим через практику —
  последовательное поведение в нескольких областях, которые Бранден называет столпами самооценки.
  Никто не построит нашу высокую самооценку за нас. Когда мы ставим её в зависимость от других, это
  похоже на веру в то, что мы будем в форме, если кто-то другой будет бегать и ходить в зал вместо
  нас.


  ## Самооценка и наши выборы


  Высокая самооценка напрямую связана с тем, как мы поступаем, — с нашими выборами. Если мы
  обманываем кого-то ради выгоды, даже когда этого никто не видит, — мы разрушаем свою самооценку.
  Если мы ведём компанию, которая декларирует «защиту природы», а тайком сливаем отходы в реку — мы
  разрушаем свою самооценку. Это не значит, что нужно отождествляться с поступком и говорить себе:
  «Я — мошенник», делая из этого идентичность. Речь о реалистичном взгляде на то, что я говорю,
  делаю и думаю — и осознании, совпадает ли это. То есть о целостности.


  Почему отсутствие целостности бьёт по самооценке даже тогда, когда никто, кроме нас, о проступке
  не знает? Потому что мы лжём себе, а самообман оставляет след. Такие вещи накапливаются в психике,
  пусть мы и не осознаём этого. А раз самооценка — производная от согласованных для нас выборов, то
  несогласованные неизбежно её подтачивают. Какая разница, что другие не знают, что ты обманываешь
  или загрязняешь, если ты это знаешь и действуешь вопреки себе — предаёшь себя. Это неизбежно
  отражается на том, что ты о себе думаешь. Страдает твоё самоуважение.


  ## Почему высокая самооценка важна и чем она отличается от низкой


  Здоровая самооценка связана с амбициями, потребностью в самовыражении, честностью по отношению к
  себе и другим, открытым умом, уважительными отношениями, доброжелательностью, готовностью помогать
  и доброй волей; с гибкостью реакции на происходящее; со способностью учиться и на этой основе
  укреплять веру в себя. Со всем тем, что необходимо для намеренного движения к целям в согласии с
  нашими ценностями. Здоровая самооценка даёт радость не только от достижения, но и от того, чему мы
  учимся по дороге. Позволяет радоваться без невротической мотивации и попыток заполнить внутреннюю
  пустоту внешними успехами. Она дарит жизнь без иррационального страха — жизнь, полную вдохновения.


  С высокой самооценкой мы настойчивее идём к целям, а само движение укрепляет самооценку. Парадокс:
  проявления высокой самооценки одновременно её подпитывают — это самоподдерживающийся механизм.
  Здоровая самооценка защищает от негативных влияний внешнего мира и даёт силу справляться с
  трудностями. Обладая высокой самооценкой, мы умеем радоваться успехам других, поддерживать их,
  мотивировать — потому что не чувствуем угрозы. И свои успехи мы ценим — видим в них подлинную
  ценность. Так происходит, потому что высокая самооценка растёт из движения к чему-то, а не из
  страха. Самооценка — и условие, и одновременно результат любого успеха.


  Низкая самооценка прорастает из страха «я недостаточно хорош». Цель человека с низкой самооценкой
  — построить чувство безопасности, то есть скорее защищаться от чего-то, чем идти к чему-то.
  Проблема в том, что длительное пребывание в обороне ещё сильнее ослабляет самооценку. Сколько бы
  успехов мы ни достигли, живя с низкой самооценкой, радоваться им полноценно не получится — мы
  чувствуем, что «не заслужили». Неудачи переживаются сильнее успехов, в памяти остаётся в основном
  то, что не вышло.


  О низкой самооценке говорит и надменность, хвастливость, заносчивость, демонстративность. Такое
  поведение часто принимают за высокую самооценку, но это признак как раз противоположного. С низкой
  самооценкой можно добиться успеха, но мы всё равно не признаем его своим, а путь к нему будет
  каторгой — вместо естественного продолжения нашего «я».


  ## 6 столпов самооценки


  Натаниэль Бранден выделил шесть базовых областей, о которых мы можем позаботиться, чтобы поднять
  самооценку: практика осознанной жизни, самопринятие, ответственность за себя,
  уверенность/самодостаточность, целеустремлённая жизнь и честность/праведность. Я кратко расскажу о
  каждой. Предлагаю тебе по ходу оценивать себя по шкале от 1 до 10: 10 — отлично, 1 — очень плохо.
  Смысл упражнения — увидеть, как обстоят дела сейчас: ближе ли ты к высокой самооценке, низкой или
  где-то посередине, и над чем стоит поработать.


  ## 1) Практика осознанной жизни


  Это осознавание реальности «здесь и сейчас» — и действия, соответствующие этой осознанности. Если
  я знаю, что мне плохо в работе, но избегаю об этом думать, — я не живу осознанно. Если понимаю,
  что мои отношения никуда не годятся, но тяну, потому что боюсь одиночества, — я лгу себе. Если
  знаю, что алкоголь и сигареты вредят здоровью, но игнорирую — я разрушаю самооценку. Я предаю свой
  ум: знаю, но делаю вид, что не вижу. Осознанная жизнь — это уважение к реальности. Это не только
  знание «как правильно», но и выбор в пользу правильного. Осознанность — это и умение подстраивать
  состояние ума под контекст: за рулём мотоцикла, например, опасно витать в мечтах — нужно
  соответствующее внимание. Как вы оцениваете свой уровень осознанной жизни от 1 до 10?


  ## 2) Самопринятие


  Это признание самим собой своего права на существование. Самопринятие — это проживание своих
  чувств, желаний и мыслей без отталкивания их. Тем самым мы даём себе право быть — ведь всё это
  часть нас. Приняв, к примеру, что тебе не хочется садиться за бизнес-план, ты парадоксальным
  образом легче за него сядешь — потому что в этом нет лжи. Нет попытки внушить себе «мне охота».
  Это даёт больше энергии к действию и позволяет лучше управлять собой, несмотря на чувства, которые
  иногда мешают действовать. У самопринятия есть и другая функция: если ты сделал то, чем не
  гордишься, ты не сможешь простить себе без принятия факта, что действительно это сделал. И, как в
  случае с осознанной жизнью, самопринятие укоренено в контексте: оно позволяет понять, почему ты
  поступил глупо в той ситуации, откуда взялось именно такое решение сейчас. Это не оправдание — это
  база для обучения без наращивания ненависти к себе. Как бы вы оцениваете своё самопринятие по
  шкале 1–10?


  ## 3) Ответственность за себя


  Принятие ответственности за себя и свою жизнь даёт ощущение контроля. Это необходимо для высокой
  самооценки, потому что мы осознаём: за наше счастье, выборы и реализацию целей отвечаем мы сами, а
  не случай. Эта мысль освобождает и прибавляет сил. Ответственность включает ещё одну вещь:
  принимая ответственность за себя, мы одновременно признаём, что другие не обязаны о нас
  заботиться, жить для удовлетворения наших потребностей — так же, как и мы не живём для
  удовлетворения их. Поэтому наши отношения становятся подлинными, а не «по расчёту». Как на шкале
  выглядит ваш уровень ответственности за себя?


  ## 4) Ассертивность (самодостаточность, отстаивание позиции)


  Это умение сотрудничать с людьми без отказа от собственных стандартов и убеждений. Это уважение к
  своим желаниям, потребностям, ценностям — и их выражение мудрым способом. Считается, что
  ассертивность — это умение говорить «нет». В такой же степени — это умение говорить «да», когда
  хочется. Ассертивность — это также умение задавать вопросы, сомневаться, пересматривать старые
  порядки и авторитеты. Иногда она требует готовности к конфронтации, когда наши ценности и
  убеждения нуждаются в защите. Люди часто боятся быть ассертивными из страха отвержения и
  одиночества. Но правда в том, что от чьего-то одобрения наша самооценка лучше не станет — это
  внутренняя игра. Насколько вы ассертивны по шкале 1–10? Как часто говорите «нет», когда хочется
  «да», и наоборот?


  ## 5) Целеустремлённая жизнь


  Это постановка целей и движение к ним. Без этого нашей жизнью правит случай, мы становимся
  реактивными, а не активными. Ждём, что «что-то изменится», но не приходим к мысли, что чтобы
  что-то изменилось, надо что-то делать и к чему-то идти. Само движение к целям расширяет горизонт,
  позволяет поверить, что нам доступно куда больше, чем мы думали. Достижение и движение
  подтверждают нашу эффективность. Но важно, какие у нас цели. Чтобы их достигать, нужно точно
  знать, чего хочешь; что делать, а чего не делать. Это требует осознанности и действий в
  соответствии с ней, итог — достижение цели. Так мы формируем внутренний капитал. Даже если мы
  достигли и потом потеряли плоды, благодаря внутреннему капиталу мы знаем, что сможем повторить. Мы
  ЗНАЕМ, как это делается. Поэтому люди, сделавшие состояние и потерявшие его, нередко способны
  восстановить богатство. Как у вас с целенаправленной жизнью по шкале 1–10? Есть ли цели? Какие?


  ## 6) Праведность / честность


  В двух словах — поступать в согласии со своими ценностями. Чтобы говорить о честности, нужно
  знать, что добро и что зло — это и оценивается через ценности. Поэтому знание того, что для нас
  важно и почему, — необходимо. Порой, чтобы быть честным с собой, приходится оспаривать нормы,
  привитые культурой или родителями — и это нормально, если мы делаем это ради повышения собственных
  стандартов. В мире невысоких стандартов это требует настоящей смелости. Оно того стоит: если мы
  часто действуем вопреки тому, во что верим, со временем мы будем уважать себя всё меньше — и тем
  самым делаем возможными для себя всё более дурные поступки. Отсутствие честности — ещё один пример
  поведения, которое подрывает нашу самооценку и нас самих. Как оцениваете свою честность по шкале
  1–10? Чаще действуете в согласии со своими ценностями или против них?


  ## Условие успеха


  К этим шести столпам я добавлю ещё один фактор, без которого всё сказанное звучит красиво, но мало
  помогает. Я имею в виду смелость — действовать и смотреть на себя объективно; иногда смелость
  возразить, а иногда — сказать «да». Без этого ничего не сдвинется.


  Как видно, построение самооценки — не такое простое и «сладкое», как кажется, и коротких путей
  здесь нет. Оно требует последовательной целостности, основой которой являются понимание и
  смелость. Но жизнь по этим принципам — вместо внушения себе и притворства — приносит реальные
  изменения в самооценке.
