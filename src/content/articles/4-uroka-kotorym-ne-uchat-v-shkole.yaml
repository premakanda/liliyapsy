slug: 4-uroka-kotorym-ne-uchat-v-shkole
title: 4 урока, которым не научат в школе
description: То, чему учат или не учат в школе, влияет не только на то, как мы справляемся с жизнью
  на практике, но и на уровень нашей удовлетворенности, ощущения смысла и самореализации.
category: Личностный рост
coverImage: null
coverAlt: null
published: true
publishedAt: 2026-11-09
updatedAt: null
author: Лилия Янушкевич
content: >-
  То, чему учат или не учат в школе, влияет не только на то, как мы справляемся с жизнью на
  практике, но и на уровень нашей удовлетворенности, ощущения смысла и самореализации. Это на личном
  уровне. А на уровне общества это формирует наши институты и качество услуг и продуктов, которыми
  мы пользуемся. Я уверена, что и на личном, и на общественном уровне всё могло бы быть намного
  лучше благодаря правильному образованию. К сожалению, сегодняшняя школьная система, по моему
  мнению, сильно отличается от того, что я понимаю под хорошим образованием. Но я не хочу, чтобы это
  поняли неправильно — я действительно ценю те положительные изменения, которые принесла
  повсеместная школьная система. Это огромное достижение, и я рада, что живу в такое время и в таком
  месте, где это доступно. Однако я считаю, что продолжать обучение в той же форме, что и раньше,
  неэффективно. Это не отвечает современным реалиям и не служит детям и обществу.


  Из того, что пригодилось мне за годы учёбы: я умею читать, писать и разменивать деньги. Конечно, я
  утрирую. Тем не менее, я считаю, что кроме базовых навыков, школа в нынешней форме пригодится тем,
  кто планирует научную карьеру. Рациональность, структура, правила — всё это работает в науке.
  Отклонения или аномалии, даже если они могут привести к новым открытиям, обычно встречаются с
  недоверием.


  Но что делать, если ты не находишь себя ни в математике, ни в письме, ни в чтении, ни в языках, ни
  в спорте, ни в искусстве, и вовсе не хочешь быть ученым? Вот в этом и проблема. По школьным
  стандартам ты словно ничего не умеешь, и неясно, что с тобой делать. Это не твоя слабость, а
  слабость системы образования. Систему можно сравнить с попыткой превратить всех детей в одну массу
  по одинаковым критериям, не учитывая их индивидуальные особенности.


  Дело не в том, чтобы перестать учить детей. Важно делать это гуманно. Помимо знаний, умения читать
  и писать, было бы неплохо, если бы кто-то в школе заинтересовался нами как людьми, тем, кто мы
  есть. Этого очень не хватает. Идея образования сама по себе хороша, но в реализации всё не так
  гладко. Иногда способ, которым идея воплощается, искажает её суть. Вместо человеческого подхода мы
  получаем фабрику, вместо интереса — формирование. Это отдаляет детей от самих себя, подрывая их
  уверенность, свободу и радость жизни. В результате они вырастают безликими, угрюмыми, уставшими,
  слишком податливыми и сосредоточенными на внешних ожиданиях.


  Интересно, что потом люди часто пытаются исправить это через личностное развитие. Но вернёмся к
  главному вопросу: какова цель образования и как она соотносится с сегодняшней моделью? Я считаю,
  что главная цель образования — помочь человеку понять, кто он есть на самом деле, и создать
  условия, чтобы он смог развивать свои таланты и превращать их в нечто полезное как для себя, так и
  для общества. Для этого нужно знать свои сильные стороны, пробовать новое, обсуждать ценности и
  эффективные инструменты. А также — умение зарабатывать на своих талантах.


  Учит ли этому школа? Какие-то отголоски можно увидеть, но это скорее исключение, чем правило.
  Возможно, у школы другие цели. Но это имеет свои последствия — как личные, так и социальные.
  Работодателям сложно найти тех, кто им действительно нужен: креативных, талантливых,
  самостоятельных людей, способных работать в команде и достигать долгосрочных целей. А получают они
  часто что-то вроде рабочей силы из индустриальной эпохи — людей без энтузиазма. Даже в базовом
  вопросе подготовки к выходу на рынок труда, школа в её текущем виде не соответствует требованиям.
  Она не успевает за современным миром. (Как сказал Кен Робинсон, нам нужна персонализация
  образования, а не стандартизация.)


  Многие люди, окончившие школу, не знают, кто они, чего хотят и что им делать дальше. Они не знают
  своих талантов, не понимают, в чём их сильные стороны и что они по-настоящему любят. Они не
  осознают свои чувства и не умеют прислушиваться к интуиции. Мы можем провести миллион тестов, но
  это не решит проблему, потому что нам не хватает осознанности. И именно об этом в школе не
  расскажут.


  ## Таланты


  Какие у тебя есть таланты? У каждого человека есть талант, и точка. К сожалению, в школе об этом
  почти не говорят. Мало кто обращает внимание на то, что действительно увлекает детей, что их
  интересует, что захватывает. Если у ребёнка талант к письму или математике, это, конечно, школа
  может развить, потому что такие вещи система образования поддерживает. А что делать с остальными
  детьми? Забыть о них? Я думаю, что больше детей потеряли связь со своими талантами в школе, чем
  развили их. И это печально. В школе повторяют одну и ту же мантру: «выучить, сдать, забыть». Но
  такое отношение не помогает ни в жизни, ни в работе. Более того, родители и учителя воспитывают в
  детях чисто прагматичный подход к жизни, как будто быть собой, следовать своему призванию и
  развивать таланты — это что-то несущественное и непрактичное. Они направляют детей к так
  называемому успеху, к тому, что приносит выгоду, вместо того, чтобы строить успех на том, кто их
  дети есть и какие у них природные склонности. Конечно, родители хотят как лучше. Они хотят, чтобы
  дети жили хорошо, но часто сами отводят их от этого пути. Из-за этого многие наши таланты и
  индивидуальные проявления интеллекта — будь то рисование пчел, приготовление бутербродов или игра
  на пианино — остаются в тени. А потом, во взрослой жизни, мы оказываемся в странной ситуации:
  вроде бы работа есть, жить можно, есть семья и дом, но чего-то не хватает. Мы чувствуем пустоту,
  неудовлетворенность, нехватку смысла. Жизнь становится тяжелой.


  К счастью, не все это переживают, но, к сожалению, такое случается часто. Если кто-то хочет выйти
  из прагматичного сна, я рекомендую фильм «Билли Эллиот». Старый, но освежающий.


  Всё это не значит, что в жизни нет места прагматизму, но вопрос в том, можно ли соединить
  прагматизм и самореализацию? Я точно знаю, что это возможно. Я также знаю, что быть собой и
  строить на этом карьеру может быть непросто, особенно если окружающая среда этому не способствует.
  Поэтому так важно, чтобы школа, а если не она, то хотя бы родители поддерживали в этом.


  Что же нужно делать после школы? Однозначно, открывать свои таланты. Не только с помощью тестов и
  инструментов, но и через наблюдение за своими ощущениями, состоянием потока, приливами и отливами
  энергии. Также через следование за тем, что естественно вызывает интерес. Может, это хип-хоп, а
  может, рисование пчел — это тоже талант и это тоже форма интеллекта. Я не вижу высшей формы
  интеллекта, чем быть самим собой.


  И тут мы подходим к ещё одной вещи, которой не научат в школе — это эмоции и всё, что связано с
  осознанием самого себя.


  ## Самоосознание


  Человек — это многомерное существо. В школе внимание уделяется лишь одному измерению —
  рациональности и логике. Всё вращается вокруг программы, знаний, обязанностей и правил. Я понимаю
  важность этого для организации учебного процесса, это очевидно. Но ситуация, когда ученик даже на
  поверхностном уровне не учит ничего о себе, недопустима. В школе не говорят об эмоциях, о том, как
  с ними справляться, и даже не обсуждают, какие эмоции мы испытываем. Никто не задаёт таких
  вопросов. Интуиция тоже не обсуждается. Естественная интуиция часто подавляется, и приходится
  доверять кому-то другому больше, чем себе, даже в мелочах.


  Также в школе не упоминается, что тело, разум, эмоции и духовные аспекты человека взаимодействуют
  и проникают друг в друга. Эта тема, как и психическое здоровье, отсутствует. Даже о том, интроверт
  ты или экстраверт, почти не говорится. Никто не учит уважать свою природу и редко проявляет
  понимание к ней, особенно если она противоречит внешним ожиданиям или требованиям программы. Вот
  почему люди часто думают, что с ними что-то не так и что им нужно быть другими. Особенно это
  касается интровертов, ведь общество всё ещё больше ценит экстраверсию.


  О убеждениях тоже в школе не услышишь. В школе тебя не учат, что ты творческая личность, потому
  что там важно уметь, а не думать или создавать. Даже если говорят о креативности, это сводится к
  повторению, а не к созданию чего-то нового.


  В школе отсутствует связь между рациональностью и осознанием себя, а ведь это могло бы стать
  мощным союзом. Короче говоря, в школе не научат, как заботиться о себе на разных уровнях. Но
  выучить стих наизусть или узнать, где находится Сенегал в Африке — пожалуйста.


  Каковы последствия этого? Молодые люди становятся интеллектуально развитыми, умными, разумными и
  воспитанными. Но у них много эмоциональных проблем. Они кажутся серьёзными, будто уже устали от
  жизни, хотя только начинают её. Они не понимают, что с ними происходит, почему они чувствуют себя
  плохо, у них мало энергии, сложности в отношениях, им трудно по-настоящему увлечься чем-то. Они
  предпочитают бесцельно листать социальные сети, злятся на себя и считают, что они никчёмные. Но на
  самом деле у них не было возможности узнать себя. Они лишь выполняли чужие ожидания, пытаясь
  угодить окружающим, и мало кто действительно интересовался ими.


  Главное для школы — чтобы ребёнок ходил на уроки, получал хорошие оценки и сдавал все тесты. Но в
  жизни этого недостаточно без осознания себя. Нельзя полноценно раскрыть интеллектуальный
  потенциал, если не умеешь справляться с эмоциями. Человек — это целостная система, и если нет
  баланса между разумом и чувствами, то можно забыть не только о креативности, но и о
  самодостаточности, радости от жизни и работы.


  Что нужно наверстать? Прежде всего — познание себя, принятие своих эмоций, понимание того, как
  работает твой мозг и психика, а также твоих убеждений. Вернуться к творчеству и интуиции, к тому,
  что когда-то вызывало у тебя энтузиазм, в чём ты был креативен. Всё это вместе с разумом даёт
  потрясающие результаты.


  Следующее, чего вряд ли узнаешь в школе — это направление, в котором ты движешься по жизни. Какую
  цель ты ставишь и зачем учишься в школе?


  ## Направление в жизни, цель и ценности


  Не знаю, как ты, но я после школы вообще не знала, чем хочу заниматься в жизни. Я даже не
  понимала, почему учу те или иные предметы. Никто не объяснял, зачем это нужно. Все чего-то
  требовали, но зачем — было неясно. Конечно, нужно было учиться, получать пятёрки и в конце
  получить диплом. Но почему именно это было так важно — неизвестно.


  Без помощи в поиске жизненного направления, без обсуждения ценностей, интуиции, творчества и
  психики сложно объяснить ребёнку, почему он должен учить то, что от него требуют, и за что его
  оценивают. Это не связано между собой. Но я считаю, что эта связь должна быть. Для этого нужно
  начать с цели и направления, то есть с интереса к самому ребёнку. Неудивительно, что многие
  молодые люди после школы чувствуют себя потерянными и разочарованными. Они выполнили все ожидания,
  получили хорошие оценки, но что это им дало? Они всё ещё не знают, что делать дальше. Более того,
  по пути они потеряли значительную часть юношеского энтузиазма и идеализма.


  В школе никто не задаёт вопрос: "Что для тебя действительно важно, кроме пятёрок и дипломов? Какой
  более важной цели должен служить весь этот труд?" Какая ценность у школы, если она не помогает
  молодым людям раскрыть свои таланты и осознание себя, чтобы превратить это в нечто достойное и
  полезное как для них самих, так и для общества? Я считаю, что если направить юношескую энергию в
  позитивное русло и связать её с лучшими ценностями и талантами человека, то результаты могут быть
  потрясающими. Жаль терять эту энергию.


  Молодёжь как никогда нуждается в поддержке в поиске себя и обсуждении ценностей. Это даёт им
  осознание, что они могут что-то привнести в мир. Только позитивная цель может обеспечить стойкую
  мотивацию и вдохновение, необходимые для полноценной и осмысленной жизни. Но для этого также нужна
  структура, которая поможет им в этом.


  Что нужно наверстать? Открыть жизненные цели, ценности и направиться к чему-то стоящему. Но это
  ещё не всё. Чтобы реализовать это, нужны инструменты, которые я называю "жизненными
  инструментами". И это следующая вещь, которой вряд ли научат в школе.


  ## Жизненные инструменты


  Я бы разделила эти инструменты на две группы.


  Первая группа — это те качества, которыми полезно обладать в жизни. Они довольно важны, на мой
  взгляд. Сюда я отнесла бы: уверенность в себе, реалистичную скромность, оптимизм, настойчивость,
  способность регулярно прикладывать усилия для достижения важных целей, выкладываться по максимуму
  и сосредотачиваться на процессе, а не только на результате.


  Вторая группа инструментов — это больше навыки и практические знания. Сюда входят: критическое
  мышление, навыки общения, знания об эффективности, управлении временем, энергией и вниманием, а
  также знания о финансах и бизнесе.


  Как всё это связано?


  Если эти инструменты объединить с ясным пониманием жизненных целей, то это даст молодому человеку,
  пожалуй, наилучшие шансы на так называемый успех — не только финансовый, но и личный.


  Что нужно изменить, чтобы такая возможность появилась?


  Взрослые. Вместо того чтобы направлять детей к тому, что, по мнению родителей и учителей, является
  «практичным», нужно помочь им идти своим жизненным путём, даже если он кажется идеалистичным и
  маловероятным. Нужно поддержать их выбор, показать, какие решения и инструменты помогут им
  двигаться в нужном направлении, а не указывать на необходимость изменить этот путь. Помочь им в
  том, что они хотят, а не в том, чего хотим мы. Конечно, можно обсудить и понять, почему был сделан
  такой выбор, но это отличается от того, чтобы говорить ребёнку, что если он не станет юристом, то
  будет никем.


  Если ты хочешь помочь своему ребёнку и дать ему хотя бы часть упомянутых выше инструментов, купи
  хороший блокнот и записывай туда всё, что замечаешь о своём ребёнке. Записывай, чем он
  интересуется с самого детства. Обращай внимание на то, когда у него появляется наибольший
  энтузиазм, что его увлекает, во что он играет, что его привлекает. Задавай вопросы, но не такие,
  как «кем ты станешь, когда вырастешь?», а скорее: «что тебе нравится?», «почему это тебе
  нравится?» Записывай всё. Разговаривай с ним о талантах и эмоциях. Пусть ребёнок знает, что такие
  темы существуют. Помогай ему развивать осознание этих вопросов. Интересуйся тем, кем является твой
  ребёнок. Всё это нужно для того, чтобы у него была отправная точка, набор информации — не советов
  и указаний, а именно наблюдений и знаний. А потом поддерживай его, показывая разные инструменты.
  Многие из этих инструментов появятся просто через сами разговоры на темы, которых в школе не
  затрагивают. Сделай это, чтобы твой ребёнок не блуждал и не чувствовал себя потерянным в будущем.
  Важно, чтобы он развивался на основе того, что у него уже есть, и осознавал свои ресурсы. Вся
  надежда — на тебя как на родителя. В итоге это пойдёт на пользу всем.
