author: Лилия Янушкевич
content: >-
  Можно найти сотни причин, которые могут испортить жизнь, но я думаю, что многие из них так или
  иначе связаны с четырьмя, о которых я сейчас расскажу. Я выделяю их, потому что они встречаются
  часто и с ними сложно справиться.


  Эти 4 вещи управляются нашими глубинными психическими, биологическими и культурными механизмами, а
  также тем, что мы пережили в детстве. К тому же, они часто действуют незаметно, и мы видим только
  их последствия, не понимая причины. Это приводит к тому, что мы пытаемся решить проблемы, устраняя
  лишь последствия, теряя из виду более широкую картину. А без неё сложно найти настоящее решение.


  Чтобы справиться с этими проблемами, нужно видеть общий контекст, а не просто пытаться
  контролировать свои реакции и ситуацию. Но сменить взгляд на ситуацию обычно непросто. Мы редко
  отходим на шаг назад, чтобы задуматься о настоящих причинах наших трудностей и поступков. Из-за
  этого мы плохо понимаем, что на самом деле управляет нашими действиями и эмоциями. Без такого
  понимания можно годами повторять одни и те же попытки что-то изменить, ожидая другого результата,
  но в итоге всё равно приходить к одному и тому же — и во внешних событиях, и в своих переживаниях.


  Первая вещь, которая может разрушить твою жизнь — это стремление получить одобрение, принятие,
  любовь, внимание и признание от родителей во взрослой жизни. Это чаще всего идет из детства. Все
  дети хотят безусловной любви и внимания от родителей, и это нормально. То, в какой мере мы
  получили эту любовь, влияет на нашу взрослую жизнь. Но когда ты уже взрослый, а всё еще
  стараешься, чтобы родители заметили, оценили или приняли тебя, — это становится проблемой.


  Если ты живешь, чтобы когда-нибудь услышать от отца, что он гордится тобой, или от матери, что она
  тебя любит, стоит задуматься: это твоя жизнь или ты продолжаешь жить ради их одобрения? И, скорее
  всего, эти попытки будут напрасны.


  Есть три причины, почему это не сработает.


  Во-первых, если родители не дали тебе достаточно эмоциональной поддержки в детстве, вероятно, у
  них самих её не было, и они не смогут дать это сейчас. Во-вторых, они, возможно, даже не знают,
  что ты от них хочешь. Ты, скорее всего, не говоришь им прямо, что тебе нужно услышать слова любви
  и признания. Вместо этого ты стараешься завоевать их внимание через свои поступки, но это редко
  работает. В-третьих, каждое разочарование от этих попыток создает между вами стену непонимания,
  что ведет к конфликтам, обидам и ещё большему напряжению.


  Проблема в том, что эти попытки найти одобрение могут продолжаться годами, ты будешь переживать те
  же эмоции — гнев, грусть, разочарование — и это станет привычным, хоть и болезненным циклом. Но в
  итоге ты никогда не услышишь то, что хочешь услышать, и это будет ещё сложнее прекратить.


  Чтобы двигаться дальше, важно принять, что отношения с родителями могут никогда не стать такими,
  какими ты их себе представляешь. Это может быть тяжело, но признание этого факта даёт свободу и
  шанс улучшить отношения. Это сложная работа, но, если ты сможешь пройти через этот процесс,
  отпустить ожидания и обиды, твои отношения с родителями могут измениться к лучшему. Главное — не
  зацикливаться на поисках их одобрения.


  Если ты продолжаешь пытаться заслужить их любовь, это может превратиться в бесконечную петлю
  разочарований. Прими ситуацию: если что-то изменится — хорошо, если нет — тоже нормально. Это и
  есть та точка, к которой нужно стремиться.


  Конечно, это непросто, но возможно. Чтобы изменить свою жизнь, задай себе несколько вопросов: если
  бы ты знал, что никогда не получишь одобрения родителей, как бы это изменило твою жизнь? Какие
  эмоции ты при этом чувствуешь? Если бы твоих родителей не было в твоей жизни, делал бы ты то же
  самое, что и сейчас? Эти вопросы могут быть болезненными, но они помогут тебе начать жить своей
  жизнью. Если тебе нужна будет в этом помощь, стоит обратиться к терапевту.


  Вторая вещь, которая может разрушить твою жизнь — это отношения с неподходящими людьми, особенно с
  «неправильным» партнером. Я не стану говорить, что ты — это среднее из пяти человек, с которыми
  проводишь больше всего времени, как часто говорят в личностном росте. Я с этим не совсем согласна.
  Конечно, окружение влияет на нас, но выбор друзей и партнёра — это результат твоих жизненных
  шаблонов, опыта и уровня развития.


  Большое влияние на все твои отношения, конечно, оказывает связь с родителями. Эта первая модель
  отношений часто повторяется в дальнейшем, и мы бессознательно выбираем людей, которые подходят под
  этот сценарий. Но хорошая новость — этот шаблон можно изменить, если работать над собой.


  Часто люди жалуются, что снова и снова притягивают к себе одних и тех же неподходящих партнёров.
  Это связано с тем, что отношения с родителями остаются ключевыми для всех других отношений в
  жизни. Они влияют на то, кого ты выбираешь в качестве партнёра и друзей, и какие эмоции
  испытываешь в отношениях. Но самый большой отпечаток на твою повседневную жизнь накладывает именно
  отношение с партнёром, так как оно сильнее всего отражает первые отношения, которые у тебя были в
  жизни.


  Можно выделить четыре типа партнёров: «берущий», «дающий», «жертва» и «здоровая смесь дающего и
  берущего». Например, берущий — это человек, который берёт от тебя больше, чем даёт; дающий — тот,
  кто всегда поддерживает, но часто в ущерб себе; жертва — тот, кто нуждается в помощи, но сам не
  может её дать. А сбалансированный партнёр умеет как давать, так и получать в равной мере. Чаще
  всего берущий выбирает дающего, жертва тянется к берущему или дающему, а сбалансированные люди
  выбирают друг друга.


  Важно понимать, что ты не можешь изменить другого человека, можешь работать только над собой.
  Нужно стать тем, кто способен построить здоровые отношения с достойным партнёром, или иметь
  смелость уйти из отношений, которые причиняют больше боли, чем радости.


  Если ты сейчас состоишь в отношениях, задай себе несколько вопросов. Кто ты в этих отношениях —
  дающий, берущий, жертва или сбалансированный? Кто твой партнёр? Как вы взаимодействуете? Какие
  эмоции ты чувствуешь, когда думаешь, что твой партнёр никогда не изменится? Чувствуешь ли ты
  радость, когда думаешь о будущем с ним, или тебя это больше утомляет? Если тебе некомфортно в этих
  отношениях, подумай, насколько они напоминают тебе о том, чему ты научился в детстве в отношениях
  с родителями?


  Важно обдумать эти вопросы. Надеюсь, что большинство поймёт, что их отношения в порядке или что
  можно что-то улучшить. Жизнь и так сложна, поэтому не стоит усложнять её ещё больше токсичными
  отношениями. Твоя цель — выбирать тех людей, которые приносят тебе счастье и помогают развиваться,
  и для этого нужно работать над собой.


  Третья вещь, которая может разрушить твою жизнь — это конформизм. Проще говоря, это слепое
  следование за толпой. Когда ты без критики принимаешь чужие ценности, убеждения и поведение,
  которые общество предлагает, как стандарт. Однако и крайнее отвержение всего подряд тоже не выход,
  потому что это просто реакция на внешнее, а не твой собственный выбор.


  Конформизм возникает по разным причинам: желание быть принятым, страх перед отвержением, нехватка
  уверенности в своих ценностях или страх перед тем, чтобы выбрать свой путь в жизни. Быть частью
  толпы или бунтовать против неё легче, чем самому осознанно выбирать свою дорогу, потому что толпа
  даёт иллюзию принадлежности и безопасности. Но за это приходится платить свободой и
  самореализацией.


  Конформизм поддерживает существующее положение вещей, ничего не меняя. Ты становишься лишь звеном
  в цепи, без настоящей индивидуальности. В мире, где царят заранее установленные правила, важно
  лишь следовать им, конкурировать за то, что считается важным в обществе: деньги, статус, внешний
  вид. И хотя кажется, что ты получаешь одобрение и успех, это успех по чужим меркам.


  Конформизм подавляет в человеке его уникальность, его способность привнести в мир что-то
  по-настоящему своё. Никто не выигрывает от того, что мы следуем готовым шаблонам жизни, вместо
  того, чтобы искать и развивать свои собственные ценности.


  Но если ты найдёшь свою истинную ценность и сможешь её реализовать, это принесёт пользу и тебе, и
  обществу. Такие люди часто сталкиваются с непониманием, потому что они не вписываются в
  общепринятые рамки. Но именно они двигают мир вперёд, потому что их решения основаны на
  внутренних, а не внешних ориентирах.


  Поэтому не нужно становиться ни покорным конформистом, ни бунтарём. Твой ориентир должен быть
  внутри. Задай себе несколько вопросов: если бы ты никогда не мог показать другим свои достижения,
  что бы было для тебя важно? Если бы деньги и статус не имели значения, как бы ты измерял свой
  успех? Этот путь потребует времени и усилий, но он приведёт к тому, что ты начнёшь жить свою
  настоящую жизнь.


  Четвёртая вещь, которая может разрушить твою жизнь, — это позволить страху управлять ею. Обрати
  внимание, я не говорю, что сам страх разрушит твою жизнь, а именно то, что если ты будешь
  принимать решения, руководствуясь только страхом, это тебя погубит. От страха невозможно полностью
  избавиться, он — одна из самых сильных человеческих эмоций, но может буквально парализовать нас.


  Интересно то, что мы часто одновременно боимся противоположных вещей. Например, с одной стороны,
  мы боимся изменений, риска и неизвестности. С другой стороны, мы боимся того, что, избегая этих
  изменений, можем упустить шанс и потратить свою жизнь впустую. Так многие люди могут оставаться в
  этом подвешенном состоянии годами, пока жизнь сама не вынудит их что-то изменить.


  Мы боимся боли, отказа, провала, а иногда даже успеха. И чтобы этого избежать, мы часто не делаем
  ничего, что могло бы привести нас к желаемому: свободе, любви, успеху или самореализации. Но этот
  путь не для тех, кто поддаётся своим страхам. Он требует более широкой перспективы и готовности
  столкнуться с тем, что большинство людей старается избегать.


  Чтобы осознать, что страх — это лишь часть жизни, можно вспомнить о неизбежности смерти. Для
  некоторых это помогает понять, что терять нам особо нечего. Это может дать силы выйти из плена
  страхов и начать действовать.


  Когда мы поддаёмся всем нашим страхам, мы упускаем множество возможностей и талантов, которые
  могли бы принести пользу не только нам, но и окружающим. Важно не пытаться полностью избавиться от
  страха, а научиться с ним жить и не позволять ему управлять нами. Поскольку страх всегда будет с
  нами, лучше уже бояться того, что стоит того, чтобы преодолевать.


  Подумай, что значит для тебя жить так, как ты хочешь? Какие страхи ты должен преодолеть для этого?
  Чего ты боишься больше всего? Одиночества? Оказаться в дураках? И что на самом деле произойдёт,
  если случится то, чего ты боишься? Это отличные вопросы для начала.


  Когда посмотришь на эти четыре вещи — стремление к одобрению родителей, отношения, конформизм и
  страх — то поймёшь, что они не обязательно разрушат твою жизнь так, что ты окажешься в беде.
  Наоборот, снаружи может казаться, что у тебя всё хорошо. Но разрушенная жизнь — это не то, как она
  выглядит со стороны. Важно то, как ты чувствуешь себя внутри.


  Если ты проживёшь свою жизнь, угождая семье или обществу, заработаешь деньги, которые их порадуют,
  проведёшь жизнь с неподходящим партнёром и позволишь страху управлять твоими решениями — то на
  смертном одре эти достижения не будут иметь никакого значения. Ведь многие люди в конце жизни
  больше всего жалеют о том, что не жили так, как хотели, и не следовали своему пути.


  Самая большая цена за уступки этим четырём вещам — это ты сам.
