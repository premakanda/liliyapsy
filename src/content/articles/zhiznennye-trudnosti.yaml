content: >-
  ## Безопасная жизнь


  Жизнь — это непрерывные перемены. Нет неизменного, раз и навсегда заданного сценария. Он меняется
  из часа в час, и часто мы не знаем, что принесёт следующий момент. Ничего постоянного и
  гарантированного нет, кроме самой изменчивости. Для многих это источник тревоги и страха перед
  неизвестным. Никому не нравится тревожиться и бояться, поэтому возникает соблазн как можно скорее
  избавиться от этих чувств — убежать, отвернуться. Но это, пожалуй, худшее, что мы можем сделать.


  Вместо того, чтобы встретить страх и неопределённость с мужеством и внутренней опорой, мы пытаемся
  контролировать жизнь, избегать непредсказуемости, боли, трудностей и перемен, которые кажутся
  угрозой. Стараемся запереть жизнь в клетке. Но, как ни странно, страх не исчезает, перемены всё
  равно приходят — и спрашивать нашего согласия не будут. Наше сопротивление ничего не меняет, кроме
  того, что усугубляет положение: мы боремся… с самой жизнью. И здесь исход предрешён. Это как плыть
  против течения бурной реки — только выматывает, а река всё равно унесёт куда захочет. Другое дело
  — перестать грести наперекор, позволить течению нести и, умело двигаясь, держаться нужного берега.


  Но мы часто выбираем обратное: хотим всё контролировать и верим, что однажды наступит день, когда
  всё будет под контролем, безопасно, стабильно и по-нашему. Некоторые гонятся за таким днём всю
  жизнь, откладывая настоящую жизнь на потом. Мы создаём мыльный пузырь будущего безопасного
  счастья, но правда о жизни остаётся прежней: всё контролировать невозможно. И всё-таки сказать,
  что ничего не контролируем, тоже неверно. У нас есть ограниченный контроль: мы можем влиять на
  многое — но не на сто процентов.


  Жизнь бывает неопределённой, трудной, капризной, требовательной — такова её природа. Значит,
  разумнее действовать, направляя важное для нас в нужную сторону, осознавая пределы контроля. Лучше
  соглашаться с тем, что приносит реальность, не отгораживаясь от неё и не цепляясь в панике за
  мнимую определённость: в противном случае мы проиграем. Принятие происходящего и движение из этого
  состояния к своим целям имеет больше смысла. Почему? Это блестяще сформулировал Сенека в
  «Нравственных письмах»: «Желающих судьба ведёт, нежелающих — тащит». Так или иначе ты окажешься
  там, где окажешься; либо пойдёшь добровольно, либо тебя поволокут. Человеку меньше достаётся,
  когда он действует в согласии с реальностью, а не вопреки ей.


  Отдаться течению — не значит махнуть рукой на действия. Наоборот: отсутствие сопротивления
  позволяет лучше расходовать энергию и получать лучшие результаты. Оно помогает быть в настоящем,
  учиться справляться с препятствиями и использовать их, а не бессмысленно с ними бодаться.
  Несогласие с фактом, отрицание, упорство «этого не должно быть» лишь добавляют страданий. Одно
  можно сказать точно: всё пройдёт, ситуация изменится. В жизни чередуются радостные и болезненные
  моменты; бояться их и любой ценой избегать — плохая стратегия. Часто именно самые тяжёлые периоды,
  правильно прожитые, дают нам самый быстрый и глубокий рост — в понимании жизни и самих себя. Жизнь
  никогда не была и не будет полностью безопасной и предсказуемой — и не должна такой быть. Она
  предполагает риск и смелость. Тем более их требует личностное развитие. Полная неподвижность — это
  не жизнь, а скорее её отсутствие.


  Не стоит тратить годы на погоню за стопроцентной определённостью: во-первых, её не будет;
  во-вторых, по пути мы отрежем себя от самой жизни. Неопределённость, неожиданности, поток — это и
  есть жизнь. Пытаясь убрать их, мы выгоняем из себя жизненность. Мы запутались в поиске
  «непоколебимой уверенности» и стали делать абсурдные вещи: «приклеиваемся» к деньгам, к партнёру,
  к вещам — в надежде, что это усмирит страх. Но это иллюзия безопасности, которая отрывает нас от
  естественного хода жизни. Мы ведём себя так, будто совершенно беззащитны — а это не так. И уйти от
  страха, убегая от него, нельзя: он часть жизни. Чтобы с ним справляться, нужно встретить его и
  принять, как естественную составляющую. Бессмысленно избегать неизбежного.


  Лучшая стратегия — понять и принять, что жизнь никогда не пойдёт строго по нашему плану. Иногда
  она подбрасывает очень тяжёлые испытания — так устроен мир, и лучше не строить иллюзий. Если
  принять это осознанно, становится легче жить. Принятие приносит внутреннюю свободу — ту, что даёт
  смелость рисковать, ведь без риска жизнь не раскроется во всей полноте. А если уцепиться за мнимую
  безопасность и застой, то не только не раскроешься, но ещё и сам себе создашь новые страдания,
  лишь бы убежать от неизбежного. Иногда действительно происходят вещи, которые сбивают с ног. Но
  готовых рецептов нет: карты тоже нет, потому что всё меняется. Ища защиту в полном контроле, мы
  всё равно окажемся в проигрыше, будем мучиться и бороться с пустыми призраками.


  ## Твоя природа


  Единственная опора, на которую стоит ставить, — это наша способность справляться с трудностями и
  восстанавливаться после них. Вот наше «страхование». Сюда и стоит инвестировать силы, а не в войну
  с реальностью, которой мы не сможем командовать.


  Вероятно, у тебя уже были тяжёлые периоды — и ты выжил. Порой спокойная жизнь раскалывается за
  секунду: смерть близкого, разрыв, финансовые проблемы… Ирония в том, что помогает нам то, чего мы
  обычно избегаем, — изменение. Даже самый чёрный период проходит, если выдержать — поэтому стоит
  заняться собой и действовать. Риск того, что всё резко ухудшится, не должен нас останавливать:
  жизнь — чтобы жить, а не избегать. Ключ в наших руках: не бежать от жизни, а развивать способность
  восстанавливаться — физически и психически. Природа на нашей стороне и это как раз то, на что мы
  действительно можем влиять.


  Решение — жить с пониманием: ты способен пройти через многое. Это правда. Ты умеешь — это заложено
  в нашей природе. Тело, мозг, эмоции, психика — восстанавливаются. Значит, нам стоит смотреть
  трудностям в лицо, управлять ими настолько, насколько возможно, преодолевать и использовать как
  шанс для роста. Иначе, пытаясь контролировать всё ценой самообмана, мы создаём альтернативную
  реальность. Но настоящая реальность всё равно прорвётся — и тогда начнётся кризис. Гораздо
  разумнее видеть вещи как есть.


  Если выбрать две главные мысли, то вот они.


  Первая: полностью безопасной жизни не существует — и не должно. Такая жизнь больше похожа на
  смерть. Строя вокруг себя крепость, ты блокируешь не только угрозы, но и саму жизнь — опыт и
  возможности роста. Ключ — проживание. Крепость подарит лишь иллюзию безопасности.


  Вторая (и, пожалуй, важнейшая): мы физически и психически созданы справляться с препятствиями. Это
  в нашем ДНК. Наше тело потрясающе восстанавливается (в разумных пределах). То же относится к
  психике и эмоциональным ранам: они тоже заживают — при должном внимании и «перевязке». Мы не так
  уж хрупки, как кажется, и с нашими способностями к восстановлению нам не нужно бесконечно
  отгораживаться от «опасной» жизни. У нас есть естественные механизмы защиты в достаточной мере. Мы
  подготовлены к трудностям, чтобы преодолевать их и учиться на них. Строя стены, ты игнорируешь
  свою способность к обновлению и превращаешь жизнь в выживание. А выживания мало, чтобы мечтать,
  достигать, жить полно. Жизнь требует риска, смелости, иногда — края. Требует умных и смелых
  решений, активных действий и поиска возможностей. Если ты сосредоточишься только на безопасности,
  ты никогда не проживёшь свой потенциал — это расточительство.


  Мир никогда не станет полностью безопасным — и это нормально, потому что ты способен с этим
  справляться и тебе не нужно бежать. Если ты веришь в свою способность преодолевать, страха меньше.
  Твоя сила — не в отчаянных попытках контролировать внешнее, а в доверии к собственной
  состоятельности и восстановлению. Вот источник подлинного чувства безопасности в неконтролируемом
  мире. Если ты веришь, что справишься — у тебя всегда будет преимущество перед трудностью. А если
  думаешь, что «не вынесу», — начинаешь действовать против себя. Поэтому помним: в нашей природе —
  справляться и извлекать пользу из испытаний. Это база.


  И если уж жизнь принесёт особенно тяжёлое испытание, помни: можно не только починить разрушенное,
  но и собрать заново — так, чтобы служило лучше. Для этого нужна встреча лицом к лицу со страхом и
  болью и честный разбор. Не избегать, не прятаться. Лучшее отношение к ударам судьбы — сочетание
  веры в способность восстановиться и взгляда на ситуацию как на вызов, несущий шанс. Иначе мы
  склонны делать неверные выводы — из страха и нежелания смотреть на больное. Цена бегства от боли —
  долгие тени последствий.


  ## Выводы


  Предположим, ты открыл бизнес — и провалился. Что дальше? Выводы могут быть противоположно
  разными.


  1. Неконструктивный, основанный на страхе: «Никогда больше. Это не для меня. Я не создан для


  бизнеса».


  2. Конструктивный: «Нужно попробовать иначе».


  А «иначе» зависит от внятного разбора ошибок и отношения к ситуации как к вызову, уроки которого
  ты используешь в следующий раз. Итоги двух вариантов радикально разные: первый закрывает двери к
  мечте, второй — открывает.


  Чтобы хорошо справляться с трудностями, нужно «оснастить» себя и выбрать правильную позицию. Ключ
  — подход. Самое простое — отступить от боли поражения и не смотреть на неё, но тогда не будет
  уроков, а заодно захлопнутся новые двери, останется незажившая рана. Смотреть неприятно — но это
  часть заживления. Это очищение раны и требует мужества. Кому-то нужен тёплый терапевт, кто-то
  справляется сам — важно, чтобы разбор действительно случился, а не подменялся автоматическими
  «объяснялками», которые дают ложное утешение и служат бегством. Мы часто не лечим свои
  эмоциональные раны, а делаем вид, что их нет. Это ошибка.


  Стоит увидеть реальность без привычных фильтров, вынести конструктивные уроки (открывающие
  возможности, а не закрывающие двери) и собрать себя заново для лучшего будущего. Мы сильнее, чем
  думаем. Если бы мы были по-настоящему «стеклянными» и неспособными к обучению, человечество бы не
  выжило. Вспомни мультфильм «Семейка Крудс» — он хорошо показывает и пользу, и риск вечного
  цепляния за известное. Мы выжили, потому что учились новому — а это требует опыта вне пещеры.


  Нам помогает изобретательность и смекалка. Здесь рождается смелая жизнь, которая не боится вызовов
  и знает: «мы справимся — мы для этого сделаны». Мы — антихрупкие. Есть отличная книга Нассима
  Талеба «Антихрупкость» — о вещах, которым вред идёт на пользу: встряски делают их сильнее. Речь не
  просто о пережидании бури, а о росте через неопределённость и ошибки. Мы способны извлечь массу
  пользы из трудностей — вопрос лишь в нашей ответной реакции. Если «оснастить» себя так, чтобы
  видеть в сложностях вызовы и превращать их в возможности — мы справимся. Приняв эту позицию,
  бояться нечего: всё станет шансом. И это выбор каждого.


  Когда такая внутренняя перестройка случается, прятаться от жизни уже не нужно. На самом деле
  вокруг — просто ситуации, нейтральные сами по себе: ничего «личного» против тебя. Относиться к ним
  как к вызовам особенно полезно, если ты созидателен и активен: чем активнее — тем больше риска и
  неожиданностей. Но при правильно настроенной любая ситуация становится шансом. Условие № 1 — не
  игнорировать трудности и не врать себе о своих чувствах. Большие испытания и так больны — не делай
  вид, что ничего не происходит: так только хуже. Закрывая глаза, мы не даём себе встретиться с
  болью, отпустить её и вырасти, чтобы обрести уверенность.


  ## Мы сами себе…


  Бывает, что кроме внешних трудностей мы сами добавляем себе страданий. Посмотри честно: не делаешь
  ли ты этого? Может, своими действиями/бездействием ты ухудшаешь ситуацию, оправдываешься,
  игнорируешь реальность, предъявляешь к жизни и людям нереалистичные ожидания, сочиняешь чёрные
  сценарии и тревожишься без повода. Мы часто страдаем из-за виртуальных вещей — того, чего не
  случилось и, возможно, не случится. Эти фантазии гораздо чаще не сбываются, чем сбываются, —
  значит, они в основном ложны, а боль — очень даже реальна и совершенно лишняя.


  Поэтому присмотрись — не добавляй себе боли сам. Смотри на реальность такой, какая она есть, а не
  через искажённый фильтр. Делай это не ради вины, а ради уроков. Вообще относись к трудностям как к
  возможности перенастроить курс. Такая честность порой приносит решения, а как минимум уменьшает
  страдание.


  Речь не о непрошибаемости и бронировании, а именно об антихрупкости. Не о том, чтобы застыть из
  страха и никуда не выходить, не о стремлении к лёгкой и безопасной жизни. Речь — о том, чтобы так
  устроиться внутри, чтобы смочь встречать противодействие: уметь лечить раны, делать поддерживающие
  выводы и перестраивать разрушенное. Здесь — наше подлинное чувство безопасности в непредсказуемом
  мире.
