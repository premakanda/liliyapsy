content: >-
  Что такое смысл жизни (и почему это не то, что ты, вероятно, думаешь), как его найти и что
  изменится, когда ты его найдёшь


  ## Две вещи


  Наверняка ты иногда, а может, и часто, размышляешь о смысле жизни и пытаешься «отыскать» его
  вокруг — разглядеть тайный порядок за происходящим. Может, ты задаёшься вопросом, какой смысл во
  всех трагедиях, проблемах, конфликтах из новостей — каков смысл всего этого в масштабе мира,
  страны и, в конце концов, твоей жизни. Возможно, кажется, что тема смысла — огромная, абстрактная,
  философская и оторванная от реальности, будто дальше пойдут «большие идеи», неприменимые в быту.
  Но это максимально далеко от правды. Смысл жизни — не абстракция, а нечто повседневное и
  практичное, как чистить зубы или принимать душ.


  Я думаю, смысл — одна из важнейших, если не самая важная и самая практичная вещь, которую стоит
  понять о своей жизни и развитии — если тебе важно не просто существовать, а как-то состояться.
  Расти даже перед лицом трудностей и страданий — вплоть до трагедий, с которыми ничего нельзя
  сделать.


  Если вынести из этого две мысли, то вот они:


  1. Не существует универсального, надличного «смысла жизни» для всех.


  2. Смысл жизни не нужно «искать».


  И что же тогда будет дальше, если нет универсального смысла и его не надо искать? Я не собираюсь
  говорить, как тебе жить и что «должен» сделать. Надеюсь, этот день станет моментом, когда всё
  начнёт иметь смысл для тебя — из-за тебя, а не из-за моих слов. Моя цель — не указать тебе твой
  смысл, и по ходу станет ясно, почему.


  ## Когда жизнь «не имеет смысла»


  Что ты на самом деле имеешь в виду, когда спрашиваешь: «В чём смысл моей жизни?» Обычно речь о
  положительном смысле — тебе хочется, чтобы было хорошо. Когда ты говоришь: «В моей жизни нет
  смысла, ничего значимого, всё пусто», — это потому, что сейчас ты не видишь позитивного смысла.


  Так бывает в периоды, когда рушится надежда из-за бесконечных препятствий, застойной рутины; когда
  ты несчастлив, растерян, одинок, подавлен или даже равнодушен — и не веришь, что это изменится.
  Потеря смысла возможна в тысячах сценариев — из-за «малой» вещи или чего-то действительно
  большого. Ты можешь работать на ненавистной работе без реальной ценности для кого-то; чувствовать
  себя легко заменяемым винтиком; не использовать и малой доли своих способностей так, чтобы это
  имело значение. Тебе недостаёт глубоких, насыщенных отношений и разговоров; вместо этого — «как
  дела? — хорошо, у тебя? — тоже». В отношениях могла исчезнуть искра — и ты уже не видишь смысла
  продолжать. Ты мог потерпеть громкую неудачу, утратить важное, переживать сильную физическую или
  эмоциональную боль — и спрашивать: «Какой во всём этом смысл?»


  За вопросом о смысле почти всегда стоит страдание — и, как правило, предшествует ему другое:
  «Неужели это всё? Есть ли впереди ещё что-то хорошее?»


  ## Эпидемия бессмысленности


  Мы живём во времена эпидемии утраты смысла и отчаянно пытаемся его найти — где угодно. Пробуем и
  имеем массу вещей, но ни одна не даёт устойчивого, глубокого смысла. Чаще всего это выясняется
  после того, как мы добились желаемого. Как со счастьем: чем быстрее я бегу, тем быстрее оно
  ускользает.


  Мы ищем смысл в удовольствиях, власти, деньгах; стараемся упростить жизнь и избегать боли — и это
  не срабатывает. Без глубинного измерения удовольствия быстро пустеют, а власть и деньги дают лишь
  инструмент влияния, но не ответ на «зачем». Часто за этим нет никакого «высшего блага», к которому
  можно стремиться, и ради которого повседневность наполнилась бы смыслом. Погоня за безопасностью и
  «стабильной нормой» тоже не спасает — неизбежен выбор между безопасностью и ростом. Рост требует
  выйти из равновесия, создать напряжение между «кто я сейчас» и «кем хочу стать». Цели могут
  создать такое напряжение — но ради чего? Это всё ещё не смысл.


  Представь, что у тебя отняли всё, во что ты вкладывал «смысл»: деньги, работу, безопасность,
  возможность ставить цели, свободу, семью, амбиции, голос. Так было у Виктора Франкла — узника
  концлагерей. Он, по сути, из бездны лагеря вынес, на мой взгляд, самые сильные выводы о смысле. Он
  автор логотерапии (терапии смыслом) и книги «Человек в поисках смысла».


  Зачем этот мысленный эксперимент? Чтобы показать: ни одна из перечисленных вещей сама по себе не
  является смыслом жизни. Бывают моменты, когда невозможно уцепиться ни за что, и тогда жизнь
  действительно кажется бессмысленной. А что говорит Франкл? Что у нас всегда остаётся хоть немного
  свободы — даже в безнадёжных обстоятельствах. Это свобода выбора того, кем мы станем в этой
  ситуации. И это зависит меньше от ситуации, чем от нас.


  Чтобы понять смысл жизни, нужно сменить парадигму: перестать считать смысл «вещью, которую надо
  найти». Вместо этого — наделять свою жизнь смыслом. Выбирать свой смысл жизни или смысл конкретной
  ситуации — не искать его в роликах Instagram и YouTube. Перестань спрашивать в пустоту «в чём
  смысл моей жизни?», если не задаёшь этот вопрос себе. Иначе всё переворачивается с ног на голову,
  и любая ситуация становится непреодолимой.


  Даже там, где словно всё создано, чтобы уничтожить смысл, — можно его придать. Не универсально для
  всех, а индивидуально — в масштабе твоей жизни. Отсюда вторая часть: универсального смысла нет. И
  искать ответ у случайного человека в интернете — признак кризиса смысла. Это вопрос к тебе. Свой
  ответ тащит за собой ответственность, поэтому многие не хотят его слышать.


  ## Как придавать смысл


  Придавать смысл — значит находить то, ради чего можно выстоять и нести своё страдание. Это может
  быть что угодно: работа, дело, ребёнок, семья — неважно. Страдают все, и никто не проживёт твою
  боль за тебя. Твой индивидуальный смысл — наделить жизнь смыслом самому. Сделав это, ты перестаёшь
  «просто страдать»: боль становится переносимой, появляется достоинство и взгляд в потенциально
  лучшее будущее.


  Чтобы это стало возможным, нужно встретиться со страданием лицом к лицу, проявить мужество взять
  за него ответственность, и воспользоваться внутренней свободой, чтобы придать ему такой смысл,
  который поможет тебе пережить и превратить его во что-то большее. Так открывается
  самоосуществление. Процесс происходит внутри, но смысл проявляется наружу — через значимые дела, в
  которых ты забываешь о себе.


  Наша свобода — в отношении к собственной жизни. Можно быть пассивным, а можно принять вызов.
  Трудность в том, что большинство спотыкается уже на первом шаге — на встрече со страданием;
  следующий барьер — ответственность (её путают с виной; это разное). Речь просто о том, чтобы
  решать задачу, которую ставит жизнь. У каждого задачи свои; смысл помогает их не только пережить,
  но и перерасти, открывая самореализацию. Выйти за пределы боли и частного «я» трудно, особенно
  когда ты внутри неё, но впереди всегда есть дальше, новые ситуации и задания — и смысл помогает их
  проживать и расти. Франкл называл это самопревосхождением. Он утверждал, что самореализация
  невозможна без самопревосхождения — и я полностью согласна. Человек не закрытая капсула: если он
  не проявляет себя в мире в лучшем своем виде, проигрывают все. А чтобы так проявляться, нужно
  учиться выходить за пределы себя.


  Это не про «пассивно терпеть». Жизнь требует разного: где-то — действовать, где-то — думать и
  планировать, где-то — принять неизбежное. Суть — в адекватной реакции. Самое трудное — ситуации,
  когда ничего нельзя сделать, кроме как пройти через боль и использовать её во благо. В такие
  моменты мы склонны избегать боли: отвлекаться, закрывать глаза. Но это лишает нас ответственности
  и роста, превращая личную трагедию в удобрение для горечи и отчаяния. «Позитивное мышление» как
  побег от боли — контрпродуктивно. Другое дело — позитив, который рождается после придания
  страданию смысла. Это не равнодушная фантазия «всё хорошо», когда внутри кипит лава. Присваивая
  смысл, ты придаёшь значение всему, что с тобой происходит. А когда спрашиваешь: «Где тут смысл и
  как его найти?», — ты дальше всего от него.


  ## Момент забывания о себе: проявление смысла


  Человек реализует смысл снаружи, хотя зарождается он внутри. Тот самый момент, когда ты забываешь
  о себе, будучи занятым значимым делом, служением, — делает страдание тем, что стоит вынести. Это
  настолько важно, что мурашки по коже. Альтернатива — озлобление и нигилизм: жизнь якобы «дешёвая,
  ничтожная». Это опасный взгляд.


  Выбор подхода — за тобой. Если ты не видишь, что «мяч на твоей стороне», теряешь и смысл. Каждый
  может преобразовать «негативное» в «позитивное» — не притворством, а взглядом в упор, без пропуска
  шансов на рост. Нужна лишь воля придать ситуации свой смысл — и тогда он начнёт проявляться.


  Смотри на ситуацию, будь в ней, но видь её и в перспективе будущего: это не конец, а очередной
  шанс. Помогает понимание, что люди — незаменимы: у каждого свой, неповторимый смысл к воплощению.
  Ты сам создаёшь напряжение между «кто я сейчас» и «кем хочу стать», придавая смысл происходящему.
  Это топливо для развития. Так события перестают быть настолько страшными. Если же ты застрянешь в
  них без смысла, упустишь шанс сделать свою жизнь полезной. (Отмечу: из-за индивидуальности смысла
  «полезность» не измеряет ценность жизни.)


  Иногда единственное, что остаётся, — решить, кем ты станешь благодаря этой ситуации. Решение — за
  тобой. Это свобода, которую нельзя отнять. Из неё рождается внутренняя сила: мы способны выносить
  невообразимое с достоинством — и сотворить из этого добро. Сила приходит именно из смысла, из
  видения более высоких ценностей, которые затем реализуются в жизни — по-твоему. Если правильно
  нацелиться на будущее и при этом следить за каждым днём, это сработает: можно держать в уме
  «вектор» и одновременно жить сегодня. Тогда каждый день наполняется смыслом, потому что всё, что
  ты делаешь, повернуто к наивысшей цели, которую ты только можешь себе представить. И это —
  определение смысла.
