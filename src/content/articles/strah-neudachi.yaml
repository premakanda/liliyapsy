author: Лилия Янушкевич
content: >-
  Страх — естественный для нас механизм, он защищает от опасностей; с ним не нужно воевать. Но важно
  понять, как именно этот механизм может останавливать нас от вызовов и решений, которые способны
  сильно изменить нашу жизнь.


  Страх неудачи любопытен тем, что вовсе не означает реальной угрозы, а означает, что м воспринимаем
  ситуацию как опасную. Это разные вещи. Сам страх при этом вполне реален, он настоящий, но
  основания для него часто мало реальны. В результате страх становится необоснованным и отягощающим,
  и способен полностью заблокировать жизнь и развитие.


  Сегодняшние опасности выглядят иначе, чем раньше. Это не львы и не тигры — это непринятие,
  унижение, стыд, чужое негативное мнение. Именно этого мы чаще всего и боимся; это и подпитывает
  страх неудачи. Мы воспринимаем эти вещи почти как льва или тигра. Вся ирония в том, что мы ездим
  на новейших авто, летаем самолётами, пользуемся современной технологией, а мозг работает почти так
  же, как десятки тысяч лет назад.


  ## Худший сценарий


  Реальные угрозы мы подменили мнимыми и в голове прокручиваем сценарии собственной неудачи,
  воспринимая их как угрозу жизни. Но действительно ли так? Простой пример. Допустим, ты хочешь
  работать на себя, открыть своё дело. Возможно, для этого придётся уйти с нынешнего стабильного
  места. Что возникает в голове? Мысль: «А стоит ли отказываться от того, что уже есть — надёжного и
  безопасного — ради чего-то неопределённого, что может не получиться?»


  Размышляя о решении и перебирая все «чёрные сценарии», ты можешь прийти к такой цепочке: останусь
  без работы — по собственной воле; у меня не выйдет; я провалюсь; не будет денег на еду и жильё;
  все решат, что я никто; мне будет стыдно, я почувствую унижение; меня выгонят из квартиры; окажусь
  на улице; скоро зима; замёрзну; умру где-нибудь больным и одиноким.


  Подобные картины — порой до абсурда катастрофические, порой полегче — держат нас на месте,
  парализуют и загоняют во внутренний конфликт: я чего-то хочу, но не могу сделать шаг, потому что
  боюсь потерять нынешнее и получить в итоге что-то хуже того, от чего сам отказался. «По
  собственной глупости доведу себя до катастрофы — и винить будет некого, ведь это мой выбор».
  Отсюда — вопрос смелости взять ответственность за свою жизнь. Такая мыслительная цепочка это
  осложняет: она как ветер, который раздувает костёр страха и паралича — и за это, как ни
  парадоксально, тоже стоило бы взять ответственность, чтобы свободнее действовать.


  ## Новый «лев» и «тигр»


  Страх неудачи — не тот молниеносный страх, что издревле возникал при внезапной атаке зверя. Это
  страх, который мы зачастую взращиваем сами. И наши выдуманные сценарии нередко приводят к тому же
  финалу, что и нападение льва, — к смерти. Удивительно, как быстро мозг умеет перейти от мысли
  «потеряю работу» к «умру». Функция у этого есть: сохранить нам жизнь — «лучше живой, чем
  счастливый и реализованный».


  Если же трезво посмотреть на реальность и современные условия: как бы выглядели наши улицы, если
  бы каждый, кто потерял работу или рискнул ради собственного дела, потом умирал на улице больным,
  одиноким и отвергнутым? Жили бы мы в стране, устланной трупами. Но этого нет. Какова реальная
  вероятность такого исхода? Невелика. Просто страх неудачи особенно удобен для катастрофических
  фантазий и сам отбрасывает на стену огромную тень от «маленького льва».


  Унижение и стыд, которые заменили львов и тигров, действительно трудно переживать — они бьют
  напрямую по самооценке. Но от этого не умирают, хоть нам и кажется иначе. Это не значит, что страх
  надо игнорировать, слепо рисковать и бросать всё, как есть. Речь о другом: понять, что страх —
  часть жизни, он никуда не денется. И страх неудачи тоже — когда берёшься за серьёзные вещи.


  Наша задача — лишь не дать ему парализовать действия. Пусть он станет чем-то естественным и
  нормальным (а так оно и есть). Полностью избавиться от страха нельзя: это природный охранник,
  который то перегибает палку, то вовремя предупреждает. Наша роль — понять, насколько в этой
  ситуации он прав, снижать риски, действовать разумно и учиться на опыте. На пути к цели приходит
  момент — «маленькая пропасть», которую нельзя перейти шагом — её надо перепрыгнуть. Это переломные
  решения: «Я подготовился, чтобы мой бизнес заработал, страшно, но дальше — только уволиться». Если
  страх неудачи удержит тебя от прыжка — цена может быть высокой.


  ## Чего мы лишаемся из-за страха неудачи?


  1. Главная потеря — паралич на пути к мечтам и целям, застой в развитии и переменах, о которых


  тоскуем. Мы боимся обменять «хоть и слабую, но определённость» на «лучшее, но неопределённое» —
  даже если это исполнение всех мечтаний.


  2. Страх убивает креативность. Допустим, ты ведёшь проект в компании. Если тебя постоянно
  сковывает


  мысль «я всё запорю», — как рискнёшь придумать нестандартное решение для клиента? Не попробуешь
  нового. Исчезают лёгкость и полёт, без которых творчество не работает. Под давлением в голову
  лезут безопасные, шаблонные, вторичные ходы. Всё получается вымученным. Это как бег с барьерами в
  гипсе с головы до ног. Такой подход сам подводит к провалу — и подтверждает худшие опасения, ещё
  сильнее подкармливая страх.


  3. Автосаботаж. Если страшно, что «не вывезу» большой проект, ты можешь вообще не браться за него,


  бесконечно откладывать — и тем самым сам себе ставить палки в колёса. Плюс страх жрёт массу
  энергии. На действия остаётся меньше сил — падает качество, и это бьёт по результату. Ты боишься
  ошибки — приходит перфекционизм, перекладывание ответственности, мысли «не справлюсь, не умею, не
  научусь, не знаю как». А что будет, если и правда не получится?


  Да, что будет — без апокалипсиса «умру на улице». Чаще всего — ничего рокового. Могут уволить —
  неприятно, но это не единственная компания. Можешь не получить премию. Руководитель подумает о
  тебе что-то нелестное. Клиент не купит продукт. Это не вещи, угрожающие жизни. Это вещи, которые
  ты воспринимаешь как угрозу — но они тебя не убьют. Важно вернуть правильную перспективу.


  ## Как справляться со страхом неудачи?


  1. Определи для себя, что такое «неудача». Чего ты на самом деле боишься? Каково твоё толкование


  провала? Каковы критерии? Ван Гог — провалился или преуспел? Битва при Фермопилах (из фильма «300
  спартанцев») — чья это неудача: спартанцев или персов? Эти вопросы двигают перспективу: реальность
  редко чёрно-белая, многое — вопрос точки зрения.


  2. Заметь: твои фантазии о последствиях часто гипертрофированы. Мозг цепляется за сценарии


  выживания: его задача — сохранить жизнь. Ему неинтересны твой потенциал, мечты и цели — важно
  выжить. Но у нас есть и высшие потребности — именно потребности, а не прихоти. Чтобы идти к ним,
  нужно примириться с нижними этажами пирамиды Маслоу и сознательно подниматься выше благодаря
  мотивации верхних уровней.


  3. Прими: страх не исчезнет. Чем дольше тянешь и колеблешься, тем он сильнее: бездействие
  раздувает


  сомнения, действие показывает, что двигаться можно несмотря на опасения — и добавляет смелости.
  Логика «с одной стороны могу всё потерять, с другой — не уверен, что получу лучшее, значит
  останусь при своём» навсегда оставит тебя на текущем уровне. Риск — малый или большой — на
  каком-то этапе своего пути неизбежен.


  4. Никто не даст гарантии от провала, но страх можно приручить. Что самое худшее случится, если ты


  проиграешь? Посмотри трезво. Когда обозначишь реальные риски, станет легче: ты знаешь врага. Можно
  пойти дальше — продумать планы на «если что»: что я сделаю, если не выйдет? Это создаёт ощущение
  опоры: ты знаешь, что делать даже при плохом исходе.


  5. Если провал случился — не растрать его впустую. Не сдавайся (это и будет растратой всех
  усилий), а


  извлеки урок и пробуй снова.


  Задай себе четыре вопроса:


  1. Чего я хотел?


  2. Что получилось?


  3. Чему я научился?


  4. Что в следующий раз сделаю иначе?


  Поражение — часть обучения. Справишься со страхом — и уйдут многие ограничения, удерживавшие тебя
  на месте.


  Хочу завершить вопросом, который многих подтолкнёт к размышлению: Что бы ты сделал со своей жизнью
  уже сегодня, если бы держал страх неудачи под контролем? Что бы изменил? Как выглядела бы твоя
  жизнь?
