content: >-
  Расскажу о менее очевидных способах, которыми мы сами ограничиваем свой потенциал. Речь о таких
  способах мышления, которые кажутся полезными для раскрытия потенциала, но на деле уводят нас от
  него. Ничто так не доводит нас до злости и неприязни к себе, как осознание, что мы сами усложняем
  путь к тому, чего хотим. Делается это из-за «фокусов» нашего ума и большого мозга, который
  позволяет нам очень убедительно обманывать самих себя. Итак, что вообще значит потенциал и его
  «актуализация»?


  Использовать потенциал — значит быть в своём лучшем проявлении. На практике — максимально
  использовать свои способности и ресурсы. У каждого они разные, поэтому реализация потенциала для
  каждого означает своё. Но принцип один: писатель должен писать, музыкант — играть, бегун — бегать,
  математик — считать, актёр — играть. Ты должен быть тем, кем можешь быть. Это не роскошь, как себе
  объясняют некоторые; это наш базовый режим, «заводская настройка». От того, считаем ли мы это
  нормой или привилегией, зависит, как будет выглядеть наша жизнь.


  Мы удивительно умело усложняем всё, что связано с осуществлением мечт и раскрытием потенциала.
  Создаём препятствия, правила и условия, при которых «можно будет» вступить на путь мастерства. Мы
  так хороши в этом, что сами блокируем реализацию — из-за того, как думаем.


  Начну с мысли, которую в последнее время слышу очень часто. Думаю, причина №1, по которой ты не
  реализуешь свой потенциал, — убеждение, что…


  ## «Со мной что-то не так»


  С тобой «что-то не так», ты «сломан», «дефектный», и прежде, чем работать над мечтами и целями,
  это нужно как-то исправить. Кажется логичным: у каждого есть сфера для улучшений; «вот подлатаю —
  и тогда буду готов к большим делам». Не удивляет, что мы так думаем: популярный, поверхностный
  «саморазвитие-лайф» делает ставку на быстрый эффект, одинаково для всех и по одной и той же
  формуле успеха.


  Что не так? С одной стороны, нам твердят о безграничном потенциале: «Ты можешь всё, возможности
  повсюду». С другой — почти каждый живёт с проблемой самооценки, или хотя бы так думает. Соедини
  эти два пазла — и получишь человека, застрявшего между убеждением «всё возможно» и чувством «всё
  возможно — но не для меня». Этот разрыв между ожиданиями и образом себя («я не достигаю того, что
  якобы мог бы») подпитывает идею, что с тобой «по природе что-то не так». Для твоего потенциала это
  похоронный марш.


  Выход?


  Что если сменить фокус с «я сломан — надо починить» на «я буду раскрывать и оптимизировать то, что
  уже есть, по ходу дела»? Правда в том, что тут нечего чинить «всухую». Потенциал есть у каждого, и
  его реализация — не про избавление от всех недостатков «до старта». Это не про перфекционизм и не
  про «ремонт». Решение — найти, в чём будет выражаться твой потенциал, поставить цели и понять, что
  оптимизация будет происходить по дороге к ним. Так исчезает шизофреническая связка «безграничный
  потенциал ↔ низкая самооценка». Самоуважение, опора на себя, доверие к себе начнут расти попутно —
  как необходимое условие достижения целей. Это процесс. По пути может понадобиться помощь — в этом
  нет ничего странного или плохого. Конечной точки «реализации потенциала» нет — у него
  действительно нет предела. Но начинать всё равно надо. Значит: ставь цель, дроби её на подцели,
  делай план и шаг за шагом иди — и получишь желаемое без «починки», потому что изначально ничего не
  было сломано. Притягательная для тебя цель сама вынудит тебя оптимизироваться и естественно
  подтянет к нужным вещам в процессе — иначе ты её не достигнешь. С каждым шагом ты будешь
  чувствовать себя лучше; проблема самооценки растворится; ты поверишь, что желаемое реально, и
  увидишь результаты. Просто — но есть условие: это должен быть твой потенциал и твои цели —
  по-настоящему важные и манящие.


  Следующий способ, как ты себя ограничиваешь, логично вытекает отсюда.


  ## Малые цели


  Речь о постановке слишком маленьких целей. Когда страшно замахнуться на большое, тянет для начала
  выбрать «скромную» цель, чтобы унять буйные мечты. Но задумайся: что тебя сильнее зажжёт при
  лишнем весе — минус 30 кг или минус 2 кг? Скорее всего — 30. Да, цель «минус 30» пугает, но именно
  она даёт самые сильные эмоции и, значит, энергию. Минус 30 реально меняет жизнь: возможное
  прощание с диабетом, вечной усталостью, приступами голода; новая одежда; сможешь бегать; встретишь
  подходящего партнёра — что бы там ни было важно конкретно тебе. А минус 2 — ты можешь даже не
  заметить. Это не цель, которая будит страсть.


  Многие делают ошибку — ставят маленькие цели «на разогрев», думая, что так безопаснее. Но из-за
  этой осторожности не хватает мотивации и тяги. Настоящий драйв даёт большая привлекательная цель.
  Маленькая — уместна как подцель: например, минус 2 кг на этой неделе ради главной цели «минус 30
  за год». Это работает и не обесточивает.


  ## Следующее - вера своим мыслям


  Безусловная вера тому, что твой мозг «шепчет» о твоём потенциале, идеях и возможностях. Нас учат
  верить своим мыслям, но мозг — самый большой лжец, какого ты встретишь. Не потому, что «злой», а
  потому что так управляет рисками: хочет отговорить от риска ради выживания. Поэтому амбиции
  разбиваются о «несильно поддерживающие» мысли. Если ты хочешь попасть из точки А в точку Б, нельзя
  безоговорочно верить каждому своему выводу о себе. Нужен «пролом» в текущем самообразе. Сейчас ты
  видишь себя с определёнными способностями, плюсами/минусами, убеждениями о том, что «могу/не
  могу». Если вцепиться в этот набор, на новый уровень не выйти. По дороге придётся перерасти эти
  убеждения.


  Учти: когда начнёшь реализовывать потенциал, они изменятся — и изменится твоё представление о
  себе. Старые убеждения вросли в старый образ «я»; ключ — сделать их менее «реальными» через
  осознанное сомнение, потому что чаще всего они и не были истинными. Установки вроде «мечты — это
  мечты, мне не стать успешным писателем/предпринимателем/гонщиком» не всегда и не на 100% верны — а
  этого достаточно, чтобы их подорвать. Взгляни вокруг: разве нет людей, которые пишут и
  преуспевают, строят бизнесы и преуспевают? Конечно, есть. Чтобы реализовать свой потенциал,
  перестань убеждать себя, что твои убеждения — истина, а эти люди — «исключения». Тогда ты станешь
  открытее к экспериментам, планированию и действиям; маленькие победы начнут складываться в большие
  и перепишут твоё представление о собственных возможностях — готовя тебя к ещё большему.


  ## Конформизм


  Твой потенциал душит конформизм. Когда ты «вписываешься» в окружение ради выгоды, безопасности или
  надежды, что это поможет, — ты ведёшь себя как овца. Может, это и защитит от волка, но
  единственное, что ты увидишь, — это зад другой овцы впереди. В реализации потенциала заложены
  самостоятельность и индивидуальность: у каждого — свой способ выражения. Это не значит, что помощь
  невозможна; это значит, что ожидание «тепличных условий» и дружного хора поддержки —
  нереалистично. Путь во многом одиночный; возможно, ты уже чувствуешь это: растёшь — и «старые»
  знакомые сами собой растворяются. Чужие нормы, ценности, стереотипы, мнение семьи и друзей о том,
  «кем тебе быть», когда ты уже знаешь, кем хочешь быть, — не должны менять твоё понимание
  реализации потенциала. Нельзя жить для других, не потеряв себя — и даже не стоит пытаться. Мы —
  отдельные единицы, связанные множеством нитей, и это классно; но нам нужна свобода для
  индивидуальности, чтобы делиться уникальным — от этого выигрывают все.


  ## Твои ценности


  Мешает и незнание или непонимание важности собственных ценностей — того, что для тебя
  действительно важно. Без этого сложно отличить свои решения от решений «для вписывания». Ценности
  — твой позвоночник и компас. Когда ясно, что важно, становится ясно и что не важно — отличная база
  для самостоятельных выборов. Реализовывать потенциал, поступая вразрез со своими ценностями,
  невозможно.


  Многие делают это регулярно, но, если хочешь воплощать потенциал, выстраивай жизнь под ценности, а
  не наоборот.


  Допустим, тебя гложет вопрос: «Почему мне так плохо в работе, где шеф требует врать клиентам о
  продукте?» Ответ — в ценностях. Если для тебя важны честность и качество, такая среда будет
  высасывать энергию, оставляя ощущение, будто каждый день возишься в грязи. Итог — и самочувствие,
  и результаты будут посредственными. Решение — не убеждать себя, что «всё нормально», а принимать
  решения в согласии с собой: менять работу, запускать своё дело или говорить с начальником. Ходить
  против ценностей = собирать негативные последствия. Реализация потенциала не должна требовать
  предательства ценностей; смелость — да, но не ломку.


  ## Эгоцентричные цели


  Ты обрезаешь потенциал, когда мыслишь только эгоцентрично. Кажется странным: это же твой
  потенциал, ты же «для себя». И да, и нет. Смысл потенциала — в отдаче. Мы привыкли думать, что
  достижение целей — это «получить снаружи то, что хочу», и точка. Правда иная: сначала ты
  проясняешь, через что реализуешь потенциал, затем растёшь, создаёшь, делишься — и через это
  достигаешь внешних целей. Обычно мы думаем наоборот: «Сначала добуду X/Y/Z — и тогда смогу
  раскрывать потенциал». Если ты хочешь только получать, потенциал не реализуешь: цикл неполон. Это
  как пытаться бесконечно снимать деньги с банкомата, никогда ничего не внося. Нужен баланс:
  отдавать — чтобы появлялось место для получения. Это не наивность: это работает и в бизнесе, и на
  уровне духовности. Лучшие лидеры прежде всего дают. Ты — «шеф» своей жизни, поставщик миру плодов
  своего потенциала; важно, чтобы это приносило дивиденды на обоих уровнях — отдачи и получения. Это
  не значит «отдать всё и остаться ни с чем»; речь о отдаче в здоровых границах, без чувства
  использования.


  ## Глубокая работа


  Мешает и отсутствие навыка глубокой работы. Длинные отрезки времени, когда ты полностью погружён в
  задачу, — необходимы для роста мастерства в любой области: рисование, бизнес, семья, блог. Это
  требует времени и обучения, а значит — долгого фокуса, не 10 минут. Лучше всего работают
  длительные блоки интенсивной, беспрерывной, неразвлекаемой работы. Большинство людей и организаций
  живут неэффективным «многозадачьем» и считают, что 3 часа подряд над одним — «расточительство»,
  ведь можно параллельно ответить на письма, накидать твитов… Так глубокая работа превращается в
  поверхностную. Сложные навыки не терпят «многозадачность». Нельзя получить выдающееся качество из
  поверхностной работы: она не даёт ни результатов, ни удовлетворения, ни состояния потока. Зато
  даёт ощущение «я плохо подготовлен», тревогу и сомнения — из-за слабых итогов. Часто дело не в
  способностях, а в подходе. Делать дольше и «больше всего понемногу» ≠ эффективнее. Потенциал
  нуждается в инсайтах, которые часто рождаются на стыке периодов интенсивного фокуса и полного
  отдыха.


  ## Недостаток самоконтроля


  Ещё одна преграда — слабый самоконтроль. Ты знаешь, что надо делать для реализации потенциала, но
  не выдерживаешь дисциплину, темп, страх и эмоции, приходящие вместе с препятствиями и неудачами;
  не выносиш уроки из опыта и бросаешь. Ты позволяешь мыслям и чувствам убедить тебя, что «не
  выйдет». Самоконтроль — ключ к созданию большего, к доверию себе: «я делаю для себя правильное» —
  и это снова связано с ценностями.


  Здесь может показаться парадокс: раньше я сказала «не верь каждой мысли», а теперь — «доверься
  себе и выбранному пути». Как так? Поможет различие между интуицией и логическим умом. Интуитивно
  ты знаешь, что тебе подходит — и этому хорошо бы доверять, проверяя по дороге. А разум может
  тормозить из-за старых мыслительных привычек и установок. Вот где нужен скепсис и самоконтроль:
  чтобы переламывать ограничивающие убеждения, следуя интуиции и удерживаясь на пути. Сделаешь —
  освободишься для реализации потенциала.


  ## Особое убеждение


  Есть одно особенно коварное убеждение, режущее твой потенциал. Не «я не умею/не справлюсь», оно
  тоньше: работа обязана быть тяжёлой, иначе это не работа. Если что-то даётся легко, в
  удовольствии, естественно — мы убеждаем себя, что это «не может быть профессией», максимум —
  хобби. «Слишком просто, чтобы быть делом жизни». Общество обожествляет «тяжёлый труд», а работу с
  удовольствием, через которую ты реализуешь потенциал, считает прихотью или почти ленью. На деле
  это лучший способ реализации — со здоровой динамикой отдачи и получения. Мысль «работа, которая
  мне нравится, не может быть моей профессией» будет держать тебя далеко от профессионального
  удовлетворения. Можно выбрать «настоящую, тяжёлую работу», которую ты вынужден заставлять себя
  делать. В итоге придут мысли: «Что со мной не так, что я не могу нормально выполнять простые
  вещи?» Проблема не в «трудности» работы — ты просто её не любишь, поэтому она и тяжела.


  Закончу главу простым выводом: большинство твоих ограничений — дело твоих рук; психика бодро им
  способствует. Но перестав это делать, выиграешь не только ты — выиграют все вокруг. Реализация
  потенциала напоминает «путешествие героя», и пусть это будет твоим призывом к приключению.
