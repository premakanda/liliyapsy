content: >-
  ## Разрушает и строит


  Люди ищут секрет счастья, успеха, хорошей жизни, спокойствия, удовлетворения и самореализации. Они
  пытаются прийти к этому через постановку целей и используют тяжёлую работу, настойчивость,
  дисциплину, фокус, мотивацию, действие. Но большинство не осознаёт одного: их «масштаб» счастья и
  успеха, цели и способ идти к ним — всего лишь побочный продукт их убеждений, того, что они считают
  для себя возможным или невозможным. Если ты уверен, что недостаточно хорош, чтобы получить
  повышение и зарабатывать больше, зачем стараться? Если не веришь, что кто-то захочет издать твою
  книгу — о которой ты мечтаешь, — какой смысл садиться и писать каждый день? Если веришь, что
  никогда не выучишь математику/английский, зачем уделять им внимание? И даже если вопреки этим
  убеждениям ты начнёшь «продавливать» себя усилием воли — работать на повышение, писать ежедневно,
  корпеть над алгеброй — очень быстро вернёшься на старые позиции, и ничего по-настоящему не
  изменится. Хотя личностный рост всё популярнее и повсюду говорят о том, какое огромное значение
  имеет то, как мы думаем и во что верим, многие до сих пор не видят, насколько их мысли и убеждения
  формируют их реальность.


  За каждым нашим помыслом стоят наши верования — и именно они определяют, что мы делаем. Можно
  спорить, но большинство согласится: мысли влияют на решения, а решения уж точно лепят нашу
  действительность. Это многоэтажный механизм взаимосвязей. Отсюда и смысл: стоит вынести
  бессознательное на свет — понять, что там на самом деле, — чтобы объяснить, почему одни вещи в
  нашей жизни получаются, а другие нет. Можно всё это игнорировать — убеждения всё равно будут
  работать «на фоне» и либо мешать в пути к целям, либо помогать. Они мешают, когда расходятся с
  желаемым, и помогают, когда совпадают. Потому что мы всегда действуем в согласии с тем, во что
  верим. Сила убеждений буквально может и разрушать, и строить — в зависимости от того, в чём ты
  убеждён.


  ## Что такое убеждения и как они формируются


  Твоя система убеждений — конструкция ума, построенная в основном на предположениях и
  интерпретациях реальности, которые ты принимаешь за факты. Чаще всего это подсознательные
  мыслительные процессы, работающие в фоновом режиме: мы их не осознаём, а они «с заднего сиденья»
  рулят нашей жизнью. Это как бы окончательные, не подлежащие сомнению суждения о реальности,
  сложившиеся из обобщений, пропусков и искажений — мы держим их за очевидные истины и верим в них
  так сильно, что они становятся нашей реальностью, даже если объективно можно найти массу примеров
  обратного.


  Как так выходит, что мы верим в то, что с реальностью не совпадает? Грубо говоря, у нас две
  «правды»: наша и объективная. Проблема в том, что свою мы принимаем за объективную. Ты, вероятно,
  уверен, что воспринимаешь мир «как есть», но удивился бы, сколько из того, что ты держишь за
  действительность, — часть твоей системы убеждений, которую ты сам создал и продолжаешь
  подпитывать. Это не набор разрозненных мыслей — это организм убеждений, живущий своей жизнью,
  часто независимо от фактов, и диктующий, что «истинно», а что «ложно». Он состоит из отдельных
  убеждений, нередко принятых на веру или после фильтрации через другие убеждения и нашу готовность
  их принять. На часть из них у нас нет никаких личных доказательств — мы просто усвоили их: из
  культуры, медиа, школы, науки (например, Земля вращается вокруг Солнца). Есть убеждения, которые
  без подпорок из других убеждений «висели бы в воздухе» — и это показывает, насколько весь этот
  конструкт искусственен.


  У тебя есть убеждения о множестве вещей: о себе (это «мать» всех убеждений — источник радости или
  боли), о политике, религии, бизнесе, других людях, деньгах, мужчинах и женщинах, странах, народах…
  Но важнейшие — ключевые убеждения. Это самые сильные, глубоко вкоренённые: они формируются тогда,
  когда у нас не было инструментов отличать правду от неправды, чаще всего касаются нашей
  идентичности. Они могут быть и позитивными, и негативными. Возникают из детских интерпретаций
  значимых, часто повторяющихся, событий, взаимно подкрепляются и становятся частью «я». Их ещё
  называют когнитивными схемами: через них мы фильтруем реальность и решаем, во что верить. На их
  основе мы понимаем жизненный опыт. Например, не достигнув цели, можно воспринять это как сигнал
  «действовать дальше», а можно — как «сдаться», опираясь уже имеющееся убеждение «я ни на что не
  гожусь».


  И это, пожалуй, самое пугающее: ты до сих пор действуешь, опираясь на убеждения, у истоков которых
  — твоё детство, когда ты не мог выбирать, что истинно. Ребёнок всё впитывает — и влияние того
  времени до сих пор огромно. Ты продолжаешь верить в то, что принял тогда без выбора, и держишь это
  за правду — хотя совсем не обязательно, что это правда.


  Примеры негативных ключевых убеждений: «я недостаточно хорош», «я ничто», «я плохой», «я глупый»,
  «я без ценности», «я слабый», «я не важен», «я скучный», «меня не видно», «меня никто не любит»,
  «я некрасивый». Есть и позитивные: «я ценен», «я умный», «я важен(важна)», «я сильный», «я
  интересный», «я любим», «я красивый». Верить можно одинаково крепко и в те, и в другие — но жизнь
  при этом получится совсем разной.


  Пример. В детстве ты что-то пытаешься сделать — построить замок из песка, одеться сам, сделать
  домашнее задание — а родители всё проверяют и исправляют. Им кажется, что они помогают, а ты из
  повторяющихся ситуаций выводишь: «у меня ничего не получается», «я ни с чем не справляюсь». Со
  временем это цементируется в «я ни на что не гожусь, ничего не умею». Ребёнок не станет возражать:
  «мам, пап, я всё сделал нормально, отстаньте!» Ребёнок — заложник, он нуждается в родителях и
  боится отвержения. Это как надеть зелёные очки: дальше всё видится с зеленоватым оттенком, а новые
  «слои» опыта накладываются на базовый зелёный фильтр. Страшно, насколько разрушительно работает
  такой негативный фильтр спустя годы.


  ## Характерные черты убеждений


  • Первое и главное: убеждения никогда не являются истиной — ни «хорошие», ни «плохие». Они просто
  создают твою субъективную реальность, вне зависимости от объективной.


  • Второе: ты считаешь их истинными. Приняв что-то (в детстве или позже), ты делаешь это
  «непоколебимой правдой» и даже не пытаешься сомневаться. Убеждения могут быть ближе или дальше от
  фактов, но они — не факты.


  • Третье: убеждения обычно невидимы — работают в фоне, поэтому так трудно поймать их «с поличным»
  и проверить, служат ли они нам.


  • Четвёртое: большинство убеждений, особенно ключевых, жёсткие и стабильные — вмурованы так
  глубоко, что их и не видно.


  • Пятое: мы не только действуем в согласии с убеждениями, но и ищем подтверждения тому, во что уже
  верим (а не истину как таковую). Это рождает самосбывающиеся пророчества: верю, что «не заслуживаю
  больших денег» — и делаю всё, чтобы их не зарабатывать. Здесь важнее не «чего я хочу», а во что я
  верю, что могу.


  Отсюда вывод: мы поступаем в соответствии с убеждениями; действовать вопреки им крайне трудно.
  Короткие вылазки из зоны комфорта обычно недолговечны и сами убеждения не меняют. Нам кажется, что
  это у нас есть убеждения, но часто это убеждения владеют нами.


  ## Как убеждения влияют на цели и перемены


  Убеждения влияют на всю жизнь. Чтобы чего-то добиться или реально измениться, нужно посмотреть на
  свои убеждения. Сейчас у тебя в голове есть их набор; они — часть большого системного организма.
  Система рождает определённые поведения, согласные с тем, во что ты веришь. Поведения создают
  результаты — хорошие или не очень. Результаты вызывают мысли («снова не вышло», «почему у других
  получается, а у меня нет», «круто, у меня получилось!»), которые, в свою очередь, подпитывают
  исходные убеждения. Круг замкнулся.


  Представь: ты продавец и веришь, что не умеешь продавать. Терпишь неудачу за неудачей и думаешь:
  «ну да, снова не вышло» — подтвердил убеждение — повёл себя соответственно — получил новую неудачу
  — ещё раз подтвердил. Единственный «успех» в таком сценарии — укрепление ложной «правды», которая
  и превращает карьеру в провал. Мы всегда действуем в согласии с тем, во что верим, даже если хотим
  другого. В этой логике наш основной рычаг — интерпретация результата и понимание, из какого
  убеждения она исходит.


  Есть выражение - саботаж целей. Например, хочешь зарабатывать больше, но из семьи вынес убеждение
  «богатые — плохие»? Неудивительно, что доход не растёт: ты же не хочешь быть плохим человеком.
  Сознательно ты можешь этого не понимать и вроде как стремишься к деньгам, но странным образом всё
  срывается: пропадает мотивация, сыплются ошибки, ломаются дедлайны. Одна часть хочет перемен,
  другая — нет. Хочешь похудеть, но держишься за «я толстый»? Такое убеждение — как гигантский якорь
  на дне: как ни греби, лодку тянет назад. Система убеждений — огромная рамка вокруг любой попытки
  измениться. Если убеждения противоречат желаниям, никакие техники и стратегии не сработают: часть
  тебя будет в постоянной оппозиции к другой. Часто именно этот внутренний конфликт и мешает.


  Некоторые сравнивают убеждения со столом: столешница — «правдивость» убеждения, ножки — опыт и
  интерпретации, его подтверждающие, а к полу всё это «приклеено» эмоциональными выгодами. К
  примеру, ты хочешь бросить курить, но веришь, что курение помогает заводить знакомства — и у тебя
  «есть доказательства»: вы с коллегами выходите «на перекур», отношения «теплеют». Выгода —
  ощущение, что именно благодаря курению у тебя хорошие связи. Конфликт: здоровье или отношения.
  Если присмотреться, станет видно, насколько убеждение ложное: вместо сигарет можно просто зайти в
  соседние отделы, поболтать; предложить общие обеды. Но это даже не приходит в голову — потому что
  ты не видишь ни скрытой выгоды, ни самого убеждения, ни альтернатив.


  ## Как обнаружить свои убеждения


  Начать вытаскивать убеждения на свет — отличный шаг. Но это бывает некомфортно: сложно признаться
  себе, что глубоко внутри ты веришь во что-то вроде «я плохой человек», «меня можно любить только,
  если я идеален», «я не имею права на ошибку», «я неценен». Я не стала бы делить убеждения на
  истинные/ложные — это мало помогает. Лучше — на полезные и мешающие. И уже среди мешающих выбирать
  те, которым стоит уделить внимание. Многие хотят избавиться от негативных убеждений, но удалить их
  нельзя — это часть нас. Можно их переформулировать, сделать более поддерживающими цели и перемены.


  Как увидеть убеждения в действии? Обращай внимание на ситуации, где у тебя возникает эмоциональная
  реакция — раздражение, злость, тревога. Часто за ней прячется убеждение. Отслеживая реакцию, можно
  вытянуть его из подсознания и проследить цепочку. Пример: ты пришёл домой — покупки не сделаны.
  Дальше работает такой автопроцесс: «Что это для меня значит?» — «Всем, кроме меня, всё равно, что
  дома нечего есть». «Что это значит?» — «Всё ложится на меня одну/одного». «Что это значит?» — «Я
  один(одна)». «Что это значит?» — «Меня никто не любит». «Что это значит?» — «Я недостоин любви».


  В реальности: «нет покупок» превращается в «я не заслуживаю любви». Лишь пройдя путь до конца,
  можно увидеть, что стоит за нервозностью, и добраться до глубинного убеждения. В обычной жизни ты
  бы никогда не связал отсутствие продуктов с темой любви.


  Ещё один способ — упражнение с дополнением фраз: «Я — …» (добрый, талантливый, глупый, честный,
  лживый и т. п.); «Другие — …» (фальшивые, искренние, дружелюбные, враждебные…); «Мир — …»
  (жестокий, прекрасный, безопасный, опасный…). Уже одно видение этих установок ослабляет их хватку:
  действовать бессознательно и смотреть на них как наблюдатель — не одно и то же. Посмотри на
  написанное и хладнокровно спроси: насколько это правда? Есть ли исключения? Гарантирую — увидишь.
  Подумай, как эти убеждения влияют на твои мысли, действия, результаты. Замечай, как часто звучит
  «всегда», «все», «каждый», «это сложно», «это невозможно», «я могу/не могу», «я — …». Слушай свои
  убеждения в том, что говоришь и думаешь, и осознанно спрашивай: «А правда ли это? Действительно ли
  всегда?» — и ставь свои убеждения под сомнение.
