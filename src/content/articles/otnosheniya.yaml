author: Лилия Янушкевич
content: >-
  Обычно мы рассчитываем на поддержку от близких, а когда не получаем её, принимаем радикальные
  решения. У многих людей складывается чёрно-белое восприятие отношений: «либо ты со мной, либо
  против меня», и не оставляется места для чего-то промежуточного. Я бы хотела смягчить этот подход.


  Говорят, что если отношения не приносят пользы или не поддерживают тебя во всём, то их нужно
  прекратить. Неважно, кто это — родители или друзья. Параллельно с этим мы наблюдаем рост
  депрессии, одиночества и утрату смысла жизни из-за отсутствия глубоких и близких связей с людьми.
  Это не только последствие пандемии, хотя она тоже сыграла свою роль, но и результат современного
  цифрового общества, где большая часть наших контактов переместилась в виртуальное пространство. В
  итоге наши отношения с людьми стали поверхностными и менее значимыми. Поэтому стоит ещё раз
  обдумать наше отношение к связям и понять, что жёсткие разделения иногда приносят больше вреда,
  чем пользы.


  Последствия таких крайностей в том, что мы становимся всё более одинокими. Круг общения сужается,
  становясь всё более закрытым, и сосредоточен только на том, чтобы поддерживать наши планы и цели.
  И хотя в этом нет ничего плохого, вопрос в том, действительно ли это настолько полезно, как
  кажется? Лично я пришла к выводу, что это не всегда так. Я не хочу быть окружена только теми, кто
  соглашается со мной во всём. Я хочу обсуждать разные темы с людьми, которые имеют своё мнение,
  которые могут обогатить беседу, даже если их взгляд отличается от моего. То, что человек не
  поддерживает все твои идеи безоговорочно, не значит, что он против тебя. И ещё одно — отношения
  нужны не только для поддержки в развитии. Важно иметь разнообразные связи, с которыми можно просто
  сходить в кино или на пикник, пошутить и посмеяться. Не стоит всё время говорить только о целях и
  развитии. Это значит, что, возможно, пора перестать смотреть на отношения так однобоко и резко.
  Хорошо бы подумать о том, как найти баланс, чтобы не страдали ни твои цели, ни твоё психическое
  здоровье.


  Конечно, ради своих целей и здоровья стоит избавиться от действительно токсичных людей, если это
  возможно. Ограничить с ними общение — это разумно. Но есть разница между теми, кто не поддерживает
  тебя во всём, и теми, кто действительно разрушает твою жизнь. Мне кажется, что мы потеряли это
  различие, и пришло время его вернуть. Так что, подводя итог: токсичных людей мы исключаем,
  поддерживающих оставляем, а как быть с остальными?


  Думаю, нам понадобится простая стратегия — понятный шаблон, который поможет лучше ориентироваться
  в отношениях и избегать крайностей.


  Начну с того, что не обязательно подходить к отношениям радикально, разделяя людей на тех, кто
  безусловно тебя поддерживает, и тех, от кого надо немедленно избавиться. С правильным подходом
  можно сохранить отношения с разными людьми — как с теми, кто полностью на твоей стороне, так и с
  теми, кто немного скептичен, любит пожаловаться, или даже ведет себя эгоистично и иногда
  негативно.


  Вопрос в том, как это сделать безопасно для себя и при этом не потерять выгоду, которую
  разнообразные связи могут принести в твою жизнь?


  Важно понять, что не каждый должен стать твоим другом или партнёром. Вместо того чтобы стремиться
  к такому исходу, я предлагаю создать несколько категорий для того, чтобы «хранить» свои отношения.
  То есть не делить их на «у меня с тобой отличные отношения» или «их вообще нет», а предусмотреть
  что-то среднее. Помимо категорий, нам также понадобятся критерии для распределения людей по этим
  категориям. Эти критерии должны быть как внешними, так и внутренними. Кроме того, нам понадобится
  хорошая отправная точка для всех твоих отношений. Это ключевой момент, и скоро я объясню почему.
  Пока это может звучать запутанно, но сейчас мы всё разложим по полочкам.


  Когда ты определишь наиболее токсичные отношения и избавишься от них, у тебя останется целый
  спектр более или менее здоровых связей, которые можно будет разделить на категории. Предположим,
  таких категорий будет пять — не слишком много, но и не слишком мало.


  Например, в первую категорию могут попасть люди, на которых ты всегда можешь положиться, с
  которыми чувствуешь себя комфортно и которым доверяешь. Ты можешь рассказывать этим людям всё о
  себе, и при этом чувствовать себя в безопасности. Эти люди поддержат тебя в трудные моменты и,
  если нужно, дадут конструктивную критику твоих планов и целей. Это очень ценно.


  Во вторую категорию можно отнести близких знакомых. Это люди, которым ты не рассказываешь все свои
  секреты, но тебе с ними приятно проводить время, общаться, и в трудной ситуации они могут тебе
  помочь. Но ты не просишь у них того же, что просишь у друзей.


  Третья категория — это люди, которые к тебе доброжелательны, но вы редко видитесь. Это могут быть
  знакомые на расстоянии или интернет-друзья. Вы не настолько близки, и они, возможно, не будут
  особо радоваться твоим успехам.


  Четвертая категория — это люди, с которыми ты общаешься эпизодически. Ваши разговоры поверхностны,
  и мало что вас связывает.


  Пятая категория — это практически чужие люди. Они не вносят ничего значительного в твою жизнь и
  ничего не забирают. Разве что поздравляют с праздниками раз в год, если Facebook напомнит.


  Конечно, это всего лишь примерные категории. Ты можешь создать свои, и надеюсь, мой пример тебе в
  этом поможет.


  ## Но зачем нужны эти категории?


  Они помогут тебе адекватно распределять своё внимание и участие в разных отношениях. Оно должно
  быть разным в зависимости от категории. Например, если человек из четвёртой категории напишет тебе
  сообщение, быстрая реакция не будет твоим приоритетом. Ты не бросишь всё, чтобы ответить ему.
  Важнее будет то, чем ты занят в данный момент. Но если человек из первой категории напишет тебе
  что-то важное, твой уровень участия будет намного выше. Ты, скорее всего, бросишь всё, если только
  не лежишь в больнице. Думаю, этот пример поясняет разницу в уровне вовлечённости.


  Как же распределять отношения по категориям? В основе должны лежать внешние и внутренние критерии.
  Внешние — это, например, твоя терпимость к опозданиям; наблюдение за тем, как человек проявляет
  интерес в ответ на твой; задаёт ли он вопросы и слушает ли ответы; перебивает ли тебя; проявляет
  ли инициативу в организации встреч; как он относится к другим людям, например, к официантам или
  уборщикам. Внутренние критерии — это, например, как ты чувствуешь себя во время и после встречи с
  этим человеком: чувствуешь ли ты себя лучше или хуже после общения; насколько комфортно тебе во
  время встречи или приходится постоянно следить за своими словами; есть ли внутреннее чувство, что
  не стоит делиться с ним чем-то важным, или всё в порядке.


  Важно уметь замечать такие моменты и оценивать их, что может быть трудно, ведь у нас у всех есть
  привычные шаблоны, ожидания и надежды, связанные с отношениями, которые могут искажать реальность.
  Кроме того, у нас есть и определённые модели поведения, по которым мы строим и поддерживаем
  отношения. Именно поэтому так важно хорошо знать себя в этом плане, понимать свои слабые места и
  шаблоны, чтобы не попасть в ловушку. Осознание этих моментов помогает избежать проблем, увидеть
  реальность и трезво оценить свои связи, начиная их с чистого листа. И это ключевой момент. Ноль
  должен быть отправной точкой для любых отношений. Ты сможешь придерживаться этого нуля, только
  если хорошо осознаёшь свои шаблоны в отношениях и достаточно знаешь себя, чтобы возвращаться к
  этому нулю, когда возникают сложности.


  Итак, ты начинаешь с нуля, используя свои критерии и наблюдая за поведением людей и своими
  ощущениями, чтобы распределить людей по категориям. За этим следует осознанность того, сколько
  времени и энергии ты готов вложить в отношения с человеком в зависимости от категории. Конечно,
  отношения со временем могут меняться, и человек может переходить из одной категории в другую, в
  зависимости от того, как развивается ваша связь. Это динамичный процесс. Если кто-то постоянно
  опаздывает, он, скорее всего, не окажется в первой категории. Если кто-то постоянно жалуется, тоже
  не попадёт в неё. Он будет ниже, но это не значит, что связь должна полностью исчезнуть, потому
  что в этом может не быть необходимости. Эти отношения всё равно останутся доступными для тебя.


  Важно помнить, что это всего лишь модель. Не нужно следовать ей строго, это скорее ориентир,
  особенно для тех, кто теряется в отношениях. Этот подход может помочь наладить связи, преодолеть
  одиночество и избежать крайностей. И если использовать эту модель осознанно, без излишней
  строгости, она может помочь создать больше разнообразных и безопасных связей. А кроме того,
  общаясь с разными людьми, ты даёшь себе больше возможностей для роста. Прерывая отношения, ты
  лишаешь себя этих шансов. Разнообразие способствует развитию. Мало что, как отношения, может так
  ясно показать тебе, где тебе нужно расти.
