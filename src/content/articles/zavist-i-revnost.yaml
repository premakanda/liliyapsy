author: Лилия Янушкевич
content: >-
  Мы нередко смешиваем два чувства — зависть и ревность, хотя это разные эмоции. В повседневной речи
  большинство людей всё это называет просто завистью. Не буду углубляться в тонкие различия, в жизни
  границы часто размыты, скажу лишь о базовом: зависть сильнее, чем ревность. Зависть появляется,
  когда очень хочется того, что есть у другого (успех, статус, внешность, достижения, черты
  характера и т. п.), и одновременно считаем, что сами этого не сможем добиться — отсюда сильная
  неприязнь к обладателю желаемого, вплоть до желания лишить его этого. Ревность возникает, когда
  уже есть что-то ценное (или кто- то), и мы боимся это потерять.


  Коротко: зависть — когда хочешь то, чего нет, и думаешь, что это недоступно; ревность — когда
  хочешь удержать то, что имеешь, боясь утраты. Их путают, потому что у обоих один корень — чувство
  недостатка и страх утраты. Для простоты дальше я буду писать зависть — именно так чаще всего
  называют оба этих переживания, да и в реальности они часто переплетены.


  Зависть может касаться чего угодно: чьей-то внешности, лёгкости успехов, знаний, привлекательного
  партнёра, статуса, денег, дома, машины, харизмы, уверенности в себе — список бесконечен. И если ты
  думаешь, что это лишь невинные мысли/слова, — ошибаешься. Эти эмоции действуют особенным образом:
  они влияют сильно, но при этом часто остаются неосознанными. Зависть маскируется, например, под
  антипатию к человеку, под резкую критику его в твой адрес, под вдруг накатившую грусть, когда
  видишь чей-то шикарный автомобиль, а сам садишься в свой 20-летний Гольф. Ты можешь и не
  осознавать, что завидуешь, — просто «не любишь» человека и критикуешь его. Тогда зависть незримо
  рулит твоим поведением «с заднего сиденья».


  Многие говорят о само саботаже на пути к целям — и не замечают, что завидуют тем, у кого есть то,
  чего они сами хотят. Это серьёзный барьер: так мы сами отдаляем себя от желаемого. Зависть именно
  поэтому — из-за своей скрытности — годами может лишать нас того, что стоит за ней: нашего
  подлинного желания.


  ## Две перспективы


  На зависть можно смотреть с двух сторон. Первая — ты завидуешь тому, у кого есть то, чего хочешь.
  Вторая — ты тот, у кого «всё есть»: работа мечты, партнёр, дети, деньги, слава — и ты
  сталкиваешься с неприязнью, критикой и даже ненавистью, подпитанной чужой неосознанной завистью. Я
  разберу первую перспективу — так мы лучше поможем и тем, кто завидует, и тем, кому завидуют. К
  тому же завистников, увы, обычно больше, чем объектов зависти. Хочется, чтобы как можно больше
  людей двигались к своему успеху — а направление туда эти эмоции как раз подсвечивают, если
  научиться ими пользоваться.


  ## «Плохие» эмоции?


  Первый важный шаг — признать зависть и считать её нормальной. Это не призыв развивать зависть, а
  приглашение не подавлять её. Мы привыкли делить эмоции на хорошие и плохие, но любая эмоция — это
  информация. Если мысли — язык мозга, то эмоции — язык тела. Зависть сообщает о дефиците: мне
  чего-то не хватает. Это может быть указателем направления: завидуешь чьим-то навыкам — у тебя два
  пути: воевать с человеком или помочь себе эти навыки получить. Ревнуешь в отношениях — можно
  «бороться с третьим», а можно укреплять связь с партнёром и собой.


  Самое вредное — говорить себе: «Мне не следует так чувствовать, надо это уничтожить». Подавление
  лишь уводит зависть в тень, где она продолжит влиять. Мы сильнее всего, когда живём в согласии с
  реальностью: видим то, что есть. Зависть прорастает из эго, связана с самооценкой и убеждениями —
  и это важно понимать.


  ## Это про тебя


  Твоя зависть — твоя внутренняя история. Она не про того человека и не про его вещи. Это результат
  сравнения: ты проверяешь, насколько соответствуешь собственным представлениям о себе. Это продукт
  эго — образа «я», ложной идентичности. В сравнениях ты то выигрываешь, то проигрываешь. При
  «проигрыше» эго чувствует угрозу, и ты спешишь защитить его: обесценить чужие достижения или
  самого человека. Так ты защищаешь иллюзию, будто есть некая иерархия, где твоё эго должно быть на
  вершине.


  Удерживать нереалистичный образ себя тяжело — особенно когда у других получается то, чего хочешь
  ты, а у тебя нет. Это сигнал, что тебе нехорошо с самим собой, что опоры (самоуважения и любви к
  себе) не хватает. Плюс — стыд за самого себя. Ты мысленно критикуешь владельца дома/машины мечты…
  Но как ты себя при этом чувствуешь? Скорее всего, так себе — трудно гордиться человеком, который
  гнобит других из-за собственных провалов и неверия в себя. Итог: чувство недостатка + бессилие.


  Стратегия эго при зависти — отдалиться: «не видеть — не болит». Но это только усиливает проблему.
  Строя защитную стену, ты одновременно отгораживаешься и от желаемого. Чем дальше ты от объекта
  зависти, тем легче поверить, что он «другого вида», с «магическими» качествами, а ты — нет. Это
  напрямую связано с самооценкой и убеждениями, особенно если зависть у тебя хроническая.


  Напомню: самооценка состоит из двух частей. 1) Вера в собственную эффективность — что ты
  справишься с задачами и добудешь желаемое; доверие своему уму. 2) Самоуважение — убеждённость, что
  ты заслуживаешь желаемого. Зависть говорит: «Я не верю, что смогу» и «Я не верю, что достоин».
  Значит, работать нужно с собой — зависть не про внешний мир. Чем дальше ты мысленно отодвигаешь
  «того успешного», тем крепче вера, что его результат тебе недоступен.


  ## Топливо зависти


  Лучшее топливо зависти — наши убеждения. В глубине зависти всегда лежит некое «не могу» или «мне
  не положено». (Оставим в стороне очевидное вроде «он/она красивее от природы» — на всё влиять
  нельзя.) Важно увидеть какие убеждения подпитывают твою зависть. Но до этого — два шага:


  1. Заметь и признай: Да, я завидую. Можно и вслух, и честно перед собой.


  2. Пойми, чего тебе не хватает на самом деле. Спроси себя в момент зависти: «Чего я хочу? Что


  именно у этого человека вызывает во мне укол?» Отслеживай, кого/что ты критикуешь — часто за этим
  стоит зависть.


  Затем — к убеждениям. Что ты думаешь о себе в контексте желаемого? Во что веришь о себе, о людях и
  мире? Какие мысли удерживают тебя в «не получится/не достоин»: «я глупый», «я недостаточно хорош»,
  «я неуклюжий», «не справлюсь», «другие лучше», «мир несправедлив»? Когда увидишь это, следующий
  шаг может удивить: приблизься к тем, кому завидуешь.


  ## Подойди к огню


  Это противоестественно для эго, оно хочет дистанции, но полезно для тебя. Проводя время рядом, ты
  увидишь, что эти люди не так уж отличаются от тебя. Их жизнь издали кажется идеальной, но вблизи у
  них тоже есть проблемы, слабости, вызовы. Они — обычные люди. Тогда та самая стена отделённости
  начинает таять. Результаты, которых они добились, перестают казаться инопланетными — они
  становятся ближе и возможными.


  Следующий шаг — восхищение. Признай их успех — вслух или про себя. Теперь ты видишь, что это не
  «упало с неба», а выращено трудом, шаг за шагом. Если трудно — попробуй «чуть насильно»: «Это
  здорово, что у них такой дом — я тоже хочу подобный». Их пример доказывает, что это в принципе
  возможно и для меня. Но тебе нужно поверить — и тут важна работа с убеждениями и самооценкой.
  Произнося слова признания, ты лучше себя чувствуешь. Более того, этих людей твоя поддержка может
  искренне удивить — возможно, ты первый, кто вместо завистливой критики отметил их труд.


  Дальше — учись и адаптируй под себя. Когда уходит завистливый забор, открывается окно для
  обучения: ты впитываешь ощущение «это возможно», перенимаешь принципы, а делаешь — по-своему. Так
  ты приближаешься к желаемому без отрицания своих живых эмоций и без бегства от них. Это и уважение
  к себе/другим, и реальный вклад — и в свою жизнь, и в жизни окружающих.
