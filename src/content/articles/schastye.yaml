  ## Одержимость счастьем


  Каждый хочет быть счастливым. Счастье стало целью жизни и одновременно мерилом её качества: если
  ты счастлив — всё в порядке, если нет — значит, у тебя плохая жизнь. Многие говорят, что счастье —
  это просто, что счастливым быть легко: достаточно решить, что ты счастлив — и всё. Дальше —
  накатом, всё ясно и просто. Но работает ли такой подход жизни? Это не так просто, хотя и не
  обязано быть настолько трудным.


  Мы вроде бы сознательно стремимся к счастью, но на самом деле не так уж заинтересованы в том,
  чтобы его достичь — чтобы его достичь. Может, это не главное? И, может, мы сами участвуем в
  создании барьеров для собственного счастья?


  Люди утверждают, что хотят быть счастливыми, но что именно они имеют в виду? Отсутствие проблем,
  новую машину, девушку/парня, много денег, отсутствие страданий и побольше удовольствий — или
  что-то ещё? Я бы сказала, есть два вида счастья: условное счастье, по сути ложное обещание
  счастья, и безусловное счастье, то есть настоящее.


  Когда ты говоришь: «Я буду счастлив, когда что-то получу или у меня что-то выйдет: куплю
  машину/дом, встречу того/ту самую, заработаю столько-то, стану стройной и красивой и буду купаться
  в комплиментах» — это условное счастье. И мы знаем, что ты быстро вернёшься к исходному уровню. Но
  это лишь один способ думать о счастье. Есть и другой — безусловное счастье: ты счастлив вне
  зависимости от всего, от того, что происходит в твоей жизни. Всё валится и горит — а ты счастлив.
  Для условного счастья это немыслимо — и именно этим они различаются. Когда прекрасно — ты
  счастлив; когда трудно — ты тоже счастлив. На твоё счастье не влияет, получишь ли ты работу,
  будешь ли с человеком, который тебе дорог. Звучит безумно, но, кажется, именно об этом счастье мы
  мечтаем, когда говорим о настоящем. Нет привязки к тому, чтобы жизнь шла по-моему, нет ожиданий и
  фрустрации — просто хорошо.


  Размышляя, почему трудно быть счастливым, я думала именно о безусловном счастье. Понимаю: сама
  идея кажется многим абсурдной — как можно быть счастливым, ничего не желая и не получив желаемого?
  У такого счастья есть магнит: оно манит как что-то прекрасное, и одновременно отталкивает —
  вызывает дискомфорт. Почему так? Почему быть счастливым трудно?


  ## Эго


  Первая преграда — эго. Что это такое?


  Эго — аспект тебя, с которым ты себя отождествляешь. Это твоё имя: когда я говорю «я — Лилия», я
  говорю не о себе, а об эго, идентифицируюсь с именем, которое вообще-то придумано — даже не мной.
  Эго — это набор мыслей, эмоций, убеждений, с которыми ты себя отождествляешь; они определяют, как
  ты смотришь на мир, себя и других. Это твой образ себя, который ты принимаешь за «я», твоя ложная
  идентичность. На сознательном уровне это вроде бы понятно — я не моё имя — но эго действует и
  сознательно, и бессознательно, поэтому мы часто не замечаем, как и когда оно работает и к чему
  приводит.


  Два главных способа, которыми эго отдаляет от безусловного счастья: 1. оно отделяет тебя от людей
  и вещей; 2. оно создаёт проблемы и питается драмой. Эго разделяет: есть «я» и «они», «я» и
  «объекты» (стол, компьютер, стул…). Такой раскол полезен для выживания тела. Но когда разделение
  слишком сильное, ты остро переживаешь своё «я» — именно эго. А чувство отдельности рождает
  ощущение, что ты один против мира: раз мир не ты, он против тебя, и надо защищаться. Это
  субъективное впечатление. Но если ты в него веришь, ты будешь вести себя так, что получишь
  ожидаемый результат — врагов будет больше. Так эго отделяет тебя от счастья, разрезая связь с
  миром и создавая мнимые проблемы.


  Эго — самоподдерживающаяся конструкция. Хотя это фикция, оно прекрасно выживает, создавая проблемы
  и драмы. Эго может существовать, пока находится в центре твоего мира, но остаётся незаметным. Под
  пристальным взглядом осознанности оно теряет власть. Как оно маскируется? Приём «отвлекающего
  манёвра»: важное скрывается менее важным, но скандальным. Эго раздувает проблемы, а мы клюём и всё
  больше верим, что они важны и «наши», что надо срочно их решить, — а эго в это время остаётся
  невидимым. В итоге ты начинаешь крутиться вокруг себя (эго), своих обид и страданий, раз за разом
  прожёвываешь старые раны, смакуешь эмоции, принимаешь позу мученика — и ощущение отделённости
  усиливается. Эго довольно: чем больше драм, тем оно крупнее. Ты не видишь корней — ты
  отождествляешься с проблемами. Цикл замыкается: страдание создаётся и тут же становится топливом
  для эго.


  И как это связано с безусловным счастьем? Спроси себя: кем я буду, если стану безусловно
  счастливым? Кем я буду без всех своих проблем? Прислушайся к реакции. У многих — облегчение,
  смешанное с паникой и пустотой: «И что теперь? Чем я буду заниматься?» Вопросы провокационные: они
  намекают, что не только эго создаёт проблемы — ты сам их поддерживаешь. Загляни внутрь. Возможно,
  ты увидишь: твои страдания живут, потому что ты их питаешь. Без твоей энергии их бы не было.


  У кого-то это вызовет злость, задетость — так эго реагирует на угрозу. А раз эго поддерживается
  страданием и драмой, сама идея безусловного счастья угрожает твоей идентичности. Вот и весь
  механизм, у которого есть и мотив создавать страдание, и мотив поддерживать его — это пища для
  ложного «я». Хитро.


  Если хватит честности и дистанции, увидишь: всё это не так уж безумно. Что ты делаешь изо дня в
  день? Пережёвываешь промахи и проблемы, придумываешь чёрные сценарии, тревожишься о том, чего нет,
  снова и снова бередишь старые раны — вместо того чтобы прожить их, проработать (терапией, честным
  разбором), — рассказываешь друзьям одно и то же со своеобразным наслаждением. Говоришь: «нет
  условий, нет машины, нет партнёра — и никогда не будет», «я несчастлив». Счастье на таком фоне —
  абстракция. Но всё это — следствие тотального отождествления с эго: ты пытаешься разрулить
  проблемы, которые принимаешь за себя, чтобы стать счастливым. Проблема в том, что проблемы никогда
  не закончатся. Нужно идти к корням: иметь смелость признать, что не ты, а твоё эго создаёт и
  поддерживает твоё несчастье — как будто от этого зависит твоя жизнь. И, что поразительно, в твоих
  глазах так и есть: ты = эго. Но на самом деле от этих страданий зависит не твоя жизнь, а жизнь
  эго.


  Есть ещё стратегия «счастья через эго»: улучшать эго. Ты видишь дефекты и бросаешься
  «развиваться», «становиться идеальным», «полировать личность», «достигать успеха». На практике —
  это полировка эго. Из роли мученика ты переходишь в роль «великого и успешного» — это тоже пища
  для эго. Видишь ловушку? Эго хочет быть большим — неважно как: как «самый могущественный» или как
  «самый несчастный». Любой способ подойдёт. Но ни то, ни другое не сделает тебя счастливым.


  Эго раздувает и так становится крупнее: гнев, страдание, вожделение, амбиции — всё увеличено. Оно
  даёт тебе боль и питается ею. В таких условиях безусловное счастье невозможно. Плюс возникает
  ключевой вопрос — пугающий и освобождающий: «Если я избавлюсь от страданий (части эго), а может, и
  от самого эго, и стану счастливым, то кто я?» Неизвестность пугает — эго кажется надёжнее, хотя
  оно иллюзия. Иллюзия возникает там, где мы выделяемся — через боль или через успех — без разницы.
  Нужда выделяться делает безусловное счастье недостижимым: условие — выделяться. Эго хочет
  подсовывать тебе проблему и занимать ею твоё внимание. Будь хитрее: фокусируйся не на проблемах
  (они бесконечны), а на себе — не полируя эго, а выводя его на свет осознанности: наблюдай мысли,
  чувства, реакции. Под наблюдением проблемы будут отлипать.


  ## Условное счастье


  Вторая преграда — застревание в убеждении, что счастье условно. Условия разные: удовольствие,
  достижения, вещи, особые переживания и эмоции, люди. Многие фактически понимают счастье как набор
  удовольствий и отсутствие боли — гедонизм. Ещё один вариант — счастье в будущем: вот достигну —
  тогда и буду счастлив. Мы постоянно жертвуем настоящим ради «лучшего завтра».


  Но цель достигнута — и её значимость блекнет; появляется новая цель — снова всплеск и спад. Задай
  себе серьёзно один вопрос: почему я всё ещё не счастлив?


  Убери из ответа ожидания будущего, обвинение людей и обстоятельств. Что останется? Возможно, ты
  скажешь: «Постой, моё счастье связано с людьми и обстоятельствами». Если так — ты застрял в
  условном счастье: зависишь от других, от внешнего, от наличия/отсутствия вещей. Ты в погоне за
  счастьем, которое ускользает. Каждый раз, когда ты ждёшь, что цель принесёт счастье, а оно не
  держится, — ты становишься всё более разочарованным и несчастным. Условное счастье капризно и не
  удерживается. Что бы ты ни получил, будет мало — аппетит не насыщается, только изматывает. Это
  ловушка.


  Спроси себя снова: «Почему я всё ещё не счастлив?», — и исключи цели, вещи и людей. Что останется?
  Ты. Но при чём тут ты? Люди думают, что не при чём: мол, всё перепробовали, но пустоту ничем не
  заполнить. Так и будет, пока счастье для тебя напрямую связано с результатами, то есть с условиями
  — а счастье так не работает. Какова твоя роль в том, что ты несчастлив? Духовные учителя говорят:
  «Не нужно иметь всё это, чтобы быть счастливым», а тебе трудно поверить — «как я могу быть
  счастлив без желаемого? Глупость». Мы знаем, что это тупик — и всё равно выбираем условный путь,
  потому что не верим, что другие сработают. Кажутся нелогичными, нематериальными, расплывчатыми,
  ненадёжными. Это ведёт к следующей преграде.


  ## Ты точно хочешь быть счастливым…?


  То есть к неспособности представить, что значит быть безусловно счастливым на практике. Многим
  трудно даже вообразить это — и это пугает: «Что это будет означать? Что я не получу желаемого и
  перестану его хотеть? Стану ленивым? Потеряю амбиции? Ведь всё, что я делаю, я делаю ради счастья.
  Откуда возьмётся мотивация? Если я счастлив — зачем что-то делать?» Как ты представляешь себе
  безусловное счастье? Правда ли ты хочешь быть безусловно счастливым, если, например, это значит не
  получить то, от чего ты сейчас зависишь? Готов ли ты пожертвовать этим ради безусловного счастья?


  Если посмотреть глубже, не всё так очевидно. В этом смысле безусловное счастье может
  восприниматься как угроза. Мы вроде бы все к нему стремимся — но готовы ли мы? Думаю, в общем —
  нет. Возможность быть безусловно счастливым кажется непривычной, даже пугающей: нас к этому не
  готовили, хотя мы вроде бы этого хотим. Мы боимся «полного счастья», «отсутствия проблем и
  вызовов». Но безусловное счастье не означает, что не будет боли и задач. На практике это значит,
  что эти вещи не выбивают нас из колеи, потому что мы принимаем всё, что приходит. Когда мы
  откапываем осознанность из- под слоёв эго, привычные категории — «добро/зло», «счастье/несчастье»
  — начинают таять. Мы меньше чувствуем угрозу миру, потому что видим: мы — часть целого, не
  отделены. Это открывает нас миру, делает готовыми принимать то, что он приносит. Тогда нет
  «хорошего и плохого» — просто есть то, что есть, и это в порядке вещей. Это путь к безусловному
  счастью.


  ## Дело не в счастье


  Возможно, мы фокусируемся не на том. Сосредоточенность на счастье ради счастья кажется логичной.
  Но что, если дело не в счастье, и оно — не конечная цель? Что могло бы быть важнее? Думаю, это
  смысл и значимость жизни.


  Что бы изменилось, если бы кроме личного счастья мы сосредоточились на том, чтобы наполнить жизнь
  смыслом? Что если счастье — не смысл? Что если мы живём не ради счастья? И действительно ли вечная
  погоня за счастьем — путь к счастливой жизни? В жизни есть нечто большее, чем просто «быть
  счастливым». Что если то, что я делаю, порой делает меня несчастной: я злюсь, тревожусь, страдаю
  от напряжения — но за этим стоит нечто такое, ради чего стоит страдать? И я готова это принять —
  как часть процесса жизни со смыслом и целью. Это мой опыт тоже.


  Есть вещи важнее и насыщеннее, чем гонка за счастьем — даже чем само счастье. А страдание
  неизбежно. Избегая его любой ценой, мы не придём к реализации смысла: путь к смыслу связан с
  болью. Не всякая боль и не всякое напряжение — зло. Смысл даёт нам силу и выносливость — чего не
  даёт счастье. Юнг писал примерно так: Смысл делает многое выносимым — а может, и всё. Пример —
  Виктор


  Франкл**. (**Виктор Франкл - австрийский психиатр, переживший нацистские концлагеря, создатель
  логотерапии — направления психотерапии, в центре которого смысл как главный двигатель жизни.
  Франкл показал на собственном опыте, что счастье и удовольствие могут исчезнуть полностью (голод,
  пытки, смерть близких), но смысл остаётся возможным. В лагере он наблюдал: те, кто находил смысл
  (дождаться близких, закончить работу, свидетельствовать миру), чаще выживали физически и
  психически. Он писал: «Тот, кто знает, ради чего жить, выдержит почти любое как». Франкл считал,
  что страдание не обязательно разрушает. Если человек способен перевести боль в ценность -
  например, жертву ради любви, служения или свидетельства - она перестаёт быть чистым злом и
  становится источником силы. Юнг говорил, что «смысл делает многое выносимым». Франкл это доказал
  на практике: он не мог избежать страдания, но нашёл и показал способ проживать его без утраты
  человеческого достоинства.**)


  Наш потенциал и самореализация в каком-то смысле раскрываются через дисциплину, борьбу и усилие —
  не пустые, а осмысленные. Чтобы балансировать между неконтролируемостью жизни и реализацией
  смысла, нам нужно научиться плыть по течению жизни — и одновременно бороться за ценные для нас
  цели. И дело тут не в «галочке» результата: важен сам акт усилия — так мы культивируем смысл. По
  сути, суть не в стремлении «стать психологом/писателем/переводчиком/бизнесменом», а в стремлении
  быть собой, проявляясь через писательство, перевод, бизнес. Цели — вторичны. Ирония погони за
  счастьем в том, что, не гоняясь за ним, а живя смыслом и значением, мы оказываемся счастливее, чем
  когда-либо, пытаясь поймать само счастье.
