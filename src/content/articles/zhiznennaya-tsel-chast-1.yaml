content: >-
  ## Живи своей жизнью


  Задам тебе два на вид простых и на первый взгляд даже немного абсурдных вопроса. Во-первых: живёшь
  ли ты своей жизнью? И есть ли в твоей жизни чувство согласия между тем, что внутри, и тем, что
  снаружи?


  Вопросы могут показаться глупыми: чьей же жизнью ещё жить, если не своей? Но всё же задумайся. Не
  бывает ли у тебя ощущения раздвоения? С одной стороны, у тебя есть нынешний уклад — вроде всё
  понятно. С другой — как будто в тебе течёт совсем другая жизнь. Будто у тебя две жизни,
  существующие параллельно и почти не соприкасающиеся. Снаружи ты делаешь «как все», как
  «полагается» обществом. Но есть и то, что ты чувствуешь, что было бы хорошо делать — и ты этого не
  делаешь. Возможно, нет ощущения согласованности между тем, что для тебя по-настоящему важно, и
  тем, как ты живёшь изо дня в день. У большинства здесь разлад. Может, ты даже хотел бы, чтобы эти
  два мира соединились, но сам себя убеждаешь, что это невозможно: что невозможно перенести вторую,
  внутреннюю жизнь — со своей линией течения — в «первую» реальность, полную ограничений, правил и
  норм, которым ты следуешь, чтобы не выбиваться из стандарта. А даже если бы смог — что делать с
  нынешней жизнью?


  Мы разными способами отговариваем себя и заглушаем в себе ту вторую жизнь: внешний мир настолько
  нас поглощает, что кажется, будто там и таятся все решения и что в этой жизни нет места «мечтам,
  грёзам, интуиции», ведь кругом «жёсткая реальность».


  Есть два жизненных «узла», от состояния которых зависит больше всего — или счастья и
  удовлетворения, или драм и несбывшихся надежд. Первый — отношения (с ними мы кое-как справляемся —
  то лучше, то хуже). Второй — как раз жизненная цель. Этот второй, на мой взгляд, гораздо более
  запущен, чем отношения: он не так явно «болит» каждый день, как это бывает с отношениями или с
  одиночеством. Но сейчас не об отношениях, не о «смысле жизни» вообще. Сейчас — о твоей
  индивидуальной цели, призвании, которое каждый может открыть в себе. Именно открыть, а не найти.


  И хотя отсутствие жизненной цели не бросается в глаза ежедневно, есть признак, по которому можно
  понять, что на самом деле «что-то не так» — несмотря на все наши попытки убедить себя, что всё
  нормально.


  Как это распознать? Если сейчас ты недоволен своей жизнью, хотя объективно поводов «обижается на
  мир» вроде нет — семья, дети, классная работа, хорошая машина, дом, деньги, пёс, кот и рыбки, —
  значит, что-то происходит. Снаружи всё в порядке, а внутри чего-то не хватает. Скорее всего, это
  сигнал: ты сейчас далеко от своей жизненной цели. Ты живёшь не по-правдивому для себя —
  поверхностно — и где-то внутри страдаешь, не вполне понимая почему. Парадоксально, но это
  страдание здесь — хороший знак: оно может помочь открыть простой, хоть и неочевидный, факт: «Я
  недоволен, хотя у меня всё есть, потому что я не живу своей жизнью».


  На это нелегко «напроситься»: сигнал тонкий, скрыт под поверхностью, а мы чаще всего ищем причины
  на поверхности. И так проходят годы: ты снова и снова «перевязываешь бинтом искусственную ногу» —
  новые должности, деньги, смена партнёров, погоня за ощущениями — а толку мало, и ты всё усталей,
  недовольней, циничней. Ощущение отсутствия смысла и цели сопровождает тебя независимо от того, что
  ты делаешь — оно звучит фоном. Не у всех — но у многих.


  Что не так? В нашем мире легче быть президентом, чем быть собой. Мы — все, только не «сами», и
  парадокс в том, что так действительно проще — поэтому почти никто собой не является. А
  сопровождающее тебя страдание — сигнал: твоя подлинная, внутренняя жизнь, которую ты упорно
  игнорируешь, требует тебя обратно.


  Так что же такое — жизненная цель?


  ## Что такое жизненная цель


  Жизненная цель — это общая область пересечения твоих естественных способностей, талантов,
  склонностей, интересов — всего того, что, будучи выражено, приносит тебе радость и ощущение смысла
  — со служением другим, иначе говоря — с потребностью мира. Короче: твоя жизненная цель там, где
  твоя наибольшая радость встречается с пользой для других и нуждой мира.


  В основе жизненная цель — это быть собой, выражать свою правду и из этого места служить людям.
  Возможно, ты пока этого не замечаешь, но у тебя есть естественные таланты: тебя тянет к чему-то,
  что-то у тебя получается легко. С этим труднее всего — потому что самое естественное для нас
  становится невидимым: уж слишком «само собой». Но, возможно, ты иногда слышишь от близких, друзей,
  семьи: «У тебя это отлично получается», «Ты в этом реально хороша». Это часто видно ещё с детства
  — и то, будут ли эти таланты замечены и поддержаны, сильно зависит от того, как тебя воспитывали.


  Увы, родители нередко вместо того, чтобы уважать и поддерживать естественные склонности ребёнка,
  смотреть, к чему его тянет, относятся к нему как к «сырью, которое надо сформовать». И довольно
  часто в этом формовании «выбивают» у ребёнка из головы как раз то, что для него просто,
  естественно, — его способ самовыражения. По моим наблюдениям, немногие родители испытывают
  уважение к тому, что уже есть в ребёнке.


  С другой стороны, если родители поддерживали твои естественные таланты и давали пространство для
  проб и экспериментов, сегодня у тебя, вероятно, либо уже есть жизненная цель, либо ты близок к её
  открытию. Но если ты из семьи, где важно было «сформировать тебя от и до», где ценились «только
  хорошая работа, карьера, деньги и престиж», ты можешь чувствовать, что совсем не понимаешь, что
  тебе действительно близко. Родители делают это чаще всего из лучших побуждений. Но не всё
  потеряно: цель можно открыть вопреки. Это не конец, если тебе «не повезло» с детством. Надежда
  есть. А раз есть надежда — как же открыть свою жизненную цель?


  ## Как открыть свою жизненную цель


  Главное недоразумение вокруг жизненной цели, на мой взгляд, в том, что мы… ищем её. А именно это
  мы обычно и делаем: не зная, в чём наша цель, мы ищем её снаружи. Хватаемся за что угодно. Хотим,
  наконец, определиться, потому что годы идут, время утекает, а ничего не меняется. Рационально
  перебираем варианты — может, это, а может, то — но так это не работает. Потому что жизненная цель
  — не цель, которую нужно «достичь», а дар, который нужно открыть. Ещё раз: жизненная цель — не
  достигаторская цель, а дар к открытию.


  И, да, кто-то надеется, что я открою за него его дар и скажу, в чём его предназначение. Увы: никто
  не скажет тебе, какова твоя жизненная цель. Это путь каждого. Но я могу помочь, перевернув
  привычный вопрос. Обычно мы спрашиваем себя: «Что мне сделать со своей жизнью? Как построить свою
  жизнь?» Если ты действительно хочешь ответа, перестань задавать вопрос в такой форме. Вместо этого
  спроси: что жизнь хочет сделать со мной? Чего жизнь от меня требует и куда направляет?


  До того, как навязывать своей жизни форму, цель; до того, как целиком положиться на искусственную
  структуру убеждений и принятых ценностей, которую ты построил, чтобы хоть как-то задать жизни
  форму и направление — послушай, что на это говорит жизнь. Перефразирую: не спрашивай, что жизнь
  может сделать для тебя — спроси, что ты можешь сделать для жизни. Она посылает тебе подсказки. Их
  трудно уловить из-за тумана эго и тумана рационального ума: мы верим в практический разум и ставим
  его первым — и тем самым отдаляемся от открытия своей цели.


  Интуиция, сердце, дух — как ни назови — либо вообще невидимы, либо отодвинуты на обочину. Между
  тем первым шагом к открытию жизненной цели должна быть смена приоритета: ум — слуга сердца. У
  каждого из них своя интеллектуальность, но они должны быть в гармонии, где ведущим является
  сердце/дух, а за ним идёт всё остальное. Структура, благоприятная для открытия цели, выглядит так:
  сердце/интуиция идёт первым — оно знает правду; ум помогает — планирует действия, чтобы выполнить
  веления интуиции; тело выражает это в материальном мире.


  Выходит, что открытие жизненной цели/призвания — это вовсе не решение, не выбор волей, не
  навязывание себе чего-то. Это — слушание и движение за услышанным, доверие этому. Звучит
  отлетевше? Ничего — сейчас будет практичнее.


  Во-первых, как я и сказала: переключись с умствования и конструирования цели на настройку приёма —
  слушание сердца/интуиции. Если это есть — возьми блокнот и запиши пару вещей.


  Сначала подумай, что тебе интересно, что у тебя получается легко, что для тебя просто. Если трудно
  увидеть самому — спроси близких: они часто видят больше. Спроси себя: в чём ты видишь смысл? К
  чему у тебя талант? Что интересовало тебя с детства и дожило до сегодня (пусть и в изменённой
  форме)? В каких обстоятельствах ты видишь смысл в том, что делаешь? Когда в последний раз ты был
  счастлив, доволен, был в состоянии потока? Когда ты чувствуешь радость, когда ощущаешь, что
  живёшь?


  **Небольшая ремарка: я исхожу из того, что то, что приносит тебе радость, не является вредным или
  разрушительным ни для тебя, ни для других. Если кого-то радует, скажем, издеваться над животными,
  это не подсказка к жизненной цели, а повод для терапии — думаю, мысль понятна.**


  Дальше — есть ли что-то, что ты делал бы всё равно: заметят/не заметят, оценят/нет, заплатят/нет?
  То, что ты делаешь ради самого делания: копаешься в огороде, делаешь мебель из дерева, играешь на
  гитаре — что угодно. Иди за интересами и смотри на внутренний отклик: если встречаешь радость —
  отметь это. Ищи подсказки в прошлом: что всегда легко давалось, а что — труднее? Важно всё: и
  талант/потенциал, и то, где ты «мучился»; неудачи тоже значимы. Уважай и возможности, и
  ограничения — у всего есть смысл.


  И, наконец, подумай, что ты закопал под «практичной и реальной» жизнью. Какие мечты ты
  зарационализировал. Всё, что ты выпишешь, не должно подвергаться никакой цензуре — ни внутренней,
  ни внешней. Пиши правду — как оно есть. Если ты не радуешься мысли о понедельнике, хотя ты уже 40
  лет «президент своей компании», и тебя всё ещё мучает эта роль (потому что «столько вложено»), но
  ты радуешься мысли, что в пятницу поедешь верхом и проведёшь занятия для детей — запиши это.
  Наблюдай, что обессиливает, что обкрадывает тебя на радость, а что ею наполняет — независимо от
  выгод, статуса и прочего. Если раньше ты себе в этом не признавался — сегодня, хотя бы раз, будь с
  собой честен.


  Допустим, ты честно всё выписал. Может оказаться, что пункты вообще никак не связаны. Такое часто
  бывает. Ты можешь ощутить себя ещё более потерянным — и это нормально. Даже если не видно
  очевидных общих точек, подумай, что их связывает в фоне. Ищи узор, просвечивающий через
  написанное. Возможно, это будет обучение других, написание текстов, рисование, ручной труд — что
  бы ни всплыло, прими это.


  Когда это прояснится, подумай: как конструктивно выразить свой дар в реальности на благо мира и
  людей? Допустим, нашёлся такой способ: ты будешь делать красивые деревянные вещи. Теперь реши,
  исходя из того, что уже знаешь о себе: будешь ли ты делать их сам для себя, в своей мастерской,
  или, может, в компании? Вспомни, как тебе работалось в коллективе и как — в одиночку: это повлияет
  на решение.


  Ты можешь превратить это в работу — но не обязательно. Хотя, честно говоря, когда человек
  открывает свою жизненную цель, очень сложно игнорировать её по несколько часов в день, занимаясь
  чем-то совсем чужим. Поэтому те, кто её открывают, не хотят заниматься делом, далёким от их цели.
  Грубо говоря: «увиденное — не развидеть». Вот почему многие выбирают труд, который реализует их
  естественные таланты и позволяет давать ценность другим.


  Дальше — согласуй свои цели и уклад жизни с жизненной целью, то есть позаботься о согласии
  внутреннего и внешнего мира. Твои цели должны быть вложены в видение, выражающее твоё призвание.
  Когда это есть — спланируй, как это появится во внешней реальности. Что тебе понадобится — курс,
  практика, учёба? Отметь и то, что уже есть, и сложи план к целям.


  Имея план, не бросайся сразу в 20-летний мегапроект. Да, мечтай крупно, но начинай с малых шагов.
  Если это должно стать работой — продумай, какая модель заработка подойдёт именно тебе. То, что
  жизненная цель не обязана приводить к деньгам, не значит, что она не может — просто это здесь не
  главное. Между прочим, это, пожалуй, лучший способ зарабатывать, который я могу себе представить.


  А потом — просто ныряй в работу, которая для тебя значима и осмысленна. Вкладывай время, таланты и
  энергию во что-то, что ценно для тебя и даёт ценность другим. Начни уважать своё подлинное «я»,
  живя изнутри наружу.


  Как понять, что это происходит? Хотя бы по тому, что вместо чувства постоянной недосытости и
  пустоты появится свершённость. Появится радость. К тому же то, что ты делаешь, станет настолько
  важным, что будет стоить тяжёлой работы и преодоления ограничений — страха, внешних обстоятельств,
  сомнений. Открытие жизненной цели действительно добавляет смелости: ты начинаешь служить чему-то
  большему, чем себе и своему эго.
