author: Лилия Янушкевич (подтвердить авторство после редакторской проверки)
content: '## Проверяем проверяемое


  Хорошая презентация ещё не рассказывает об образовании специалиста и границах его компетенции. Уточните подготовку, актуальную
  практику и то, как организованы консультации. Не стесняйтесь спрашивать, с какими темами человек работает, а с какими —
  нет.


  ## Прислушиваемся к контакту


  На знакомстве важно, объясняет ли специалист свои действия, отвечает ли на вопросы и уважает ли ваши решения. Нормально,
  если доверие складывается постепенно. Необязательно сразу рассказывать всё личное только потому, что вы пришли на встречу.


  ## Обсуждаем правила


  Формат, стоимость, длительность, переносы, конфиденциальность и границы связи между встречами должны быть понятны заранее.
  Чёткие договорённости помогают чувствовать себя спокойнее и уменьшают число неприятных неожиданностей.


  ## Если сомнения остаются


  Выбирать специалиста можно без спешки. Даже опытный психолог подходит не каждому человеку. Обсуждать ощущение несоответствия
  допустимо; продолжать работу только из вежливости не нужно.

