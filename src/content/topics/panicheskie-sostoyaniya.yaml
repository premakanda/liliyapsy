title: Панические переживания
description: Когда внезапный приступ страха пугает своей силой.
cardTitle: Панические переживания
intro: 'Иногда страх приходит резко: учащается сердцебиение, трудно сосредоточиться, появляется ощущение потери
  контроля. После такого эпизода человек может избегать мест, где, как ему кажется, это способно повториться.'
workProcess: Психологическая работа может включать исследование обстоятельств приступов, смыслов, которые человек
  придаёт телесным ощущениям, и поведения после испуга.
important: Первый или необычный приступ с сильными телесными симптомами важно оценить медицински. Психолог не заменяет
  врача и не устанавливает диагноз.
