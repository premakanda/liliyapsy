slug: emotsionalnoe-vygoranie
title: Эмоциональное выгорание
description: Когда сил всё меньше, а привычный отдых не возвращает интерес.
cardTitle: Эмоциональное выгорание
intro: При длительной нагрузке человек может замечать раздражительность, усталость, эмоциональную отстранённость
  и ощущение, что времени на себя больше нет. Часто отдых сопровождается чувством вины, а список дел не заканчивается.
workProcess: Можно исследовать границы, распределение ответственности, привычку игнорировать потребности и отношение
  к собственным достижениям. Цель обсуждения — найти более устойчивый способ жить и работать.
important: Постоянная выраженная усталость бывает связана и с физическим состоянием. При сомнениях стоит обратиться
  к врачу.
