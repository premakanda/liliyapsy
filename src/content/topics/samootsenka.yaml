title: Самооценка и уверенность
description: Когда собственные достижения не помогают почувствовать опору на себя.
cardTitle: Самооценка и уверенность
intro: Человек может часто сравнивать себя с другими, избегать ошибок, обесценивать успехи и тяжело переносить замечания.
  Иногда именно строгий внутренний критик становится главным источником напряжения.
workProcess: В разговоре можно исследовать привычные оценки себя, историю их появления и способы разговаривать с
  собой менее жёстко. Важно не «стать идеальным», а научиться действовать, оставаясь несовершенным человеком.
important: Формат консультации и возможные задачи определяются совместно. Универсальных формул роста уверенности
  не существует.
