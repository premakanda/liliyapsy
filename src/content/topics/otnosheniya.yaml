title: Отношения и близость
description: Когда хочется взаимопонимания, но разговоры снова приводят к ссорам.
cardTitle: Отношения и близость
intro: 'В отношениях трудности нередко повторяются по знакомому сценарию: один отдаляется, второй добивается ответа,
  оба чувствуют себя непонятыми. Бывает сложно просить о поддержке, говорить «нет» или выдерживать различия.'
workProcess: На встречах можно исследовать собственные реакции, ожидания, границы и способы говорить о важном. В
  индивидуальном формате фокус остаётся на том, что может изменить сам человек.
important: Работа с парами — отдельный формат, наличие которого нельзя утверждать без подтверждения.
