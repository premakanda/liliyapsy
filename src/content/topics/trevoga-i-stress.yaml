slug: trevoga-i-stress
title: Тревога и стресс
description: Когда мысли не дают отдохнуть, а напряжение становится привычным.
cardTitle: Тревога и стресс
intro: Тревога иногда помогает замечать риски, но бывает, что внутреннее напряжение не отпускает даже в спокойные
  моменты. Человек начинает избегать непростых разговоров, откладывать решения или постоянно проверять, всё ли в
  порядке.
workProcess: На встречах можно рассмотреть ситуации, которые усиливают беспокойство, и привычные реакции на них.
  Постепенно становится яснее, где есть реальная задача, а где срабатывает знакомый сценарий ожидания опасности.
important: Если тревога сопровождается выраженными физическими симптомами, сильно нарушает сон и обычную жизнь,
  стоит обсудить состояние с врачом.
