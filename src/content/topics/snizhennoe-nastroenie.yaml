title: Сниженное настроение
description: Когда радости стало меньше, а каждое действие требует усилий.
cardTitle: Сниженное настроение
intro: Иногда привычные занятия перестают приносить удовольствие, а повседневные решения требуют больше сил. Подобные
  переживания могут иметь разные причины, поэтому важно не торопиться с самостоятельными ярлыками.
workProcess: На консультации можно говорить о нагрузке, утрате интереса, внутренних требованиях к себе и способах
  поддержки. Работа строится с вниманием к возможностям и состоянию человека.
important: Если изменения настроения выражены, продолжаются долго, появляются мысли о причинении себе вреда или
  резко ухудшается функционирование, необходима медицинская оценка и при угрозе жизни — экстренная помощь.
