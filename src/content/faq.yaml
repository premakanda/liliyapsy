items:
- id: faq-01
  question: Кто вы и как вы можете мне помочь?
  answer: Я Лилия Янушкевич, психолог. Помогаю внимательнее относиться к себе, разбираться в переживаниях, замечать повторяющиеся трудности и искать новые способы действовать. На встречах мы вместе проясняем ваш запрос и определяем, на что важно обратить внимание именно сейчас.
  publish: true
  needsOwnerReview: true
- id: faq-02
  question: С какими запросами можно к вам обратиться?
  answer: Можно обсудить тревогу и стресс, сложности в отношениях, вопросы самооценки, эмоциональное истощение, кризисы и тяжёлые переживания. Не обязательно заранее формулировать точный запрос — можно начать с того, что сейчас трудно. Возможность работы с вашей конкретной ситуацией уточним до встречи.
  publish: true
  needsOwnerReview: true
- id: faq-03
  question: Как понять, подходит ли мне психолог?
  answer: Обратите внимание, насколько понятно специалист объясняет процесс, уважает ваши границы и позволяет задавать вопросы.
    Важно не только образование и опыт, но и ощущение, что вас слышат и не торопят.
  publish: true
  needsOwnerReview: true
- id: faq-04
  question: Что происходит на первой встрече?
  answer: Обычно первая беседа помогает познакомиться, описать то, что беспокоит, и обсудить ожидания. Не обязательно заранее
    формулировать идеальный запрос. Конкретный порядок встречи уточняется при записи.
  publish: true
  needsOwnerReview: true
- id: faq-05
  question: Что происходит на следующих встречах?
  answer: По мере работы можно подробнее рассматривать привычные реакции и ситуации, искать возможные причины повторяющихся
    трудностей и обсуждать новые способы взаимодействия. Темп и содержание зависят от запроса человека.
  publish: true
  needsOwnerReview: true
- id: faq-06
  question: Сколько нужно встреч провести, чтобы получить результат?
  answer: Универсального количества встреч нет. Оно зависит от запроса, обстоятельств и вашего темпа. В процессе мы будем обсуждать, что меняется, какие задачи остаются и нужна ли дальнейшая работа. Заранее обещать результат к определённой встрече я не могу.
  publish: true
  needsOwnerReview: true
- id: faq-07
  question: В каком формате вы работаете?
  answer: Консультации проходят онлайн в Google Meet, на русском языке. Одна встреча длится 75 минут. Вам понадобятся стабильный интернет, устройство с камерой и микрофоном и место, где вы сможете спокойно поговорить без посторонних.
  publish: true
  needsOwnerReview: true
- id: faq-08
  question: Что нужно для онлайн-консультации?
  answer: Обычно достаточно устройства с камерой и микрофоном, стабильного интернета и пространства, где можно поговорить
    без посторонних. Конкретную платформу и технические условия сообщают при записи.
  publish: true
  needsOwnerReview: true
- id: faq-09
  question: Нужно ли заранее формулировать запрос?
  answer: Нет, начать можно с простого описания того, что сейчас трудно. Прояснение запроса само по себе может быть частью
    первоначального разговора.
  publish: true
  needsOwnerReview: true
- id: faq-10
  question: Нужно ли рассказывать личные подробности при записи?
  answer: Нет. При первом контакте достаточно сообщить, что вы хотите записаться, и оставить удобный способ обратной связи.
    Чувствительные подробности лучше обсуждать в согласованном конфиденциальном формате.
  publish: true
  needsOwnerReview: true
- id: faq-11
  question: Конфиденциальность.
  answer: Для меня важно бережное отношение к вашей личной информации. До начала работы важно прояснить правила конфиденциальности, обращения с данными и возможные ограничения. Вы можете задать вопросы об этом при записи. Подробно рассказывать о личной ситуации в первом сообщении не обязательно.
  publish: true
  needsOwnerReview: true
- id: faq-12
  question: Можно ли записывать консультацию?
  answer: Правила аудио- и видеозаписи необходимо заранее согласовать со специалистом и всеми участниками. Без такого согласования
    запись лучше не вести.
  publish: false
  needsOwnerReview: true
- id: faq-13
  question: Чем психолог отличается от психиатра?
  answer: Психиатр — врач, который может оценивать состояние с медицинской точки зрения и назначать лечение. Психолог помогает
    разбираться с переживаниями и жизненными трудностями в рамках своей квалификации. В отдельных ситуациях полезно участие
    обоих специалистов.
  publish: true
  needsOwnerReview: true
- id: faq-14
  question: Когда важно обратиться за медицинской помощью?
  answer: Если состояние резко ухудшается, мешает базовой безопасности или повседневной жизни либо есть опасения за жизнь
    и здоровье, важно обратиться к врачу или местной экстренной службе. Сайт не предназначен для экстренной помощи.
  publish: true
  needsOwnerReview: true
- id: faq-15
  question: Какие расценки на услуги?
  answer: Актуальную стоимость консультации можно уточнить у меня в Telegram или по электронной почте. До начала встреч мы согласуем цену и порядок оплаты, чтобы все условия были понятны заранее.
  publish: true
  needsOwnerReview: true
- id: faq-16
  question: Как записаться на консультацию?
  answer: Напишите мне в Telegram @liliyapsy или на liliyapsy@gmail.com. Коротко расскажите, с каким запросом хотите поработать, и укажите предпочтительное время встречи. Я отвечу в течение дня, и мы обсудим условия и время консультации. Если пока сложно описать запрос, об этом тоже можно написать.
  publish: true
  needsOwnerReview: true
- id: faq-17
  question: Можно ли перенести или отменить встречу?
  answer: Правила переноса, отмены и оплаты должны быть согласованы заранее и доступны в условиях работы. Не предполагается
    автоматический срок отмены, пока Лилия его не подтвердит.
  publish: false
  needsOwnerReview: true
- id: faq-18
  question: Что делать, если формат мне не подходит?
  answer: Об этом можно сказать открыто. Вы вправе задавать вопросы о процессе, обсуждать сомнения и выбирать формат помощи,
    который соответствует вашим потребностям и обстоятельствам.
  publish: true
  needsOwnerReview: true
- id: faq-19
  question: Какие подходы вы используете?
  answer: В моей работе важны совместное исследование запроса, внимание к повторяющимся реакциям и уважение к вашему темпу. Мы связываем понимание происходящего с посильными изменениями в повседневной жизни. Если вам важно узнать о конкретных методах, спросите об этом перед записью.
  publish: true
  needsOwnerReview: true
- id: faq-20
  question: Работаете ли вы с подростками?
  answer: Возможность работы с подростком необходимо уточнить у меня до записи. Укажите его возраст и кратко опишите ситуацию. Вопросы подходящего формата, участия родителей и конфиденциальности для несовершеннолетних важно обсудить отдельно до начала работы.
  publish: true
  needsOwnerReview: true
- id: faq-21
  question: Сколько времени потребуется для работы?
  answer: Одна консультация длится 75 минут. Общая продолжительность работы зависит от запроса, частоты встреч и жизненных обстоятельств. Сначала мы обсудим ваши ожидания и ориентиры, а затем будем возвращаться к ним и при необходимости пересматривать договорённости.
  publish: true
  needsOwnerReview: true
# Справочный источник для ответа об онлайн-формате:
# https://www.apa.org/topics/psychotherapy/online-therapy
- id: faq-22
  question: Эффективна ли онлайн-терапия?
  answer: Онлайн-консультации могут быть полезны, но такой формат подходит не для каждого запроса и не каждому человеку. Важны подходящие условия, устойчивый контакт и возможность спокойно говорить без посторонних. Подходит ли онлайн-работа именно вам, обсудим до начала консультаций.
  publish: true
  needsOwnerReview: true
